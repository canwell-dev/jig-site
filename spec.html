| OI-28 | Closed in the 0.13 amendment: the Godot plugin has played an action, and §7.26.9 now gives the mapping (a two-bone IK for each limb, a look-at for the head, the hips moved directly, `weight` as `influence`, poles chosen by the host, a step after the IK for a target's `rotation`). It stays informative. |
| OI-29 | One person per use point: an action has one figure at a use point. Since 0.14 several people may use one action at different use points, each on its own clock (§7.26.11). Two people at one use point (two at one table), an action that needs another person's hand, and targets for other roles (the spine, the shoulders) are left out. Narrowed in 0.17: a hand or foot target may carry a `pole` for the elbow or knee (§7.26.3, D-132 of `spec/drafts/v0_17.md`, DD-63); spine and shoulder targets were considered and kept out. |
| OI-30 | Closed in 0.17: a character gives each hand and foot a grip, an offset and an optional turn in the bone's frame, which a host puts on the target instead of the joint; models still aim at joints, and contact names on the model stay out (§7.24.6; D-131 of `spec/drafts/v0_17.md`, DD-62). |
| OI-31 | A target has one `on` for a whole phase (§7.26.3): a hand that goes from a lever to a cup in one phase is written in one frame, or split across phases or hands. A frame that changes within a phase (an `on` per interval) may be added if authors need it. Kept out in 0.17 (D-134 of `spec/drafts/v0_17.md`, DD-65); open until a model needs it. |
| OI-32 | Closed in the 0.14 amendment: `hold` and `reverse` could form a cycle (with `enter` the `reverse` of `exit`, and `loop` and `exit` both holding, enter's held values were exit's, exit's loop's and loop's enter's); V-47 now rejects `hold` on such an `exit` at `exit.hold`, and §7.26.8 samples a phase after the phases it reads (D-114 of `spec/drafts/use_actions_0_14.md`). |
| OI-33 | Closed in the 0.14 amendment: a `reverse` whose named event has no previous event of the prop in the named phase puts the prop back at its own place, whichever phase is named; a place an earlier phase left it in is not used (§7.26.5, G.20; D-116 of `spec/drafts/use_actions_0_14.md`). |

| OI-38 | Placing geometry on another part's surface: by surface coordinates (u, v) or by a ray cast at it, with an offset along the surface normal, so a pocket, a button or an eyebrow follows the shape it sits on when parameters change. |
| OI-39 | Colour as a zone id per vertex plus a small palette texture, instead of a vertex colour per solid, so a host recolours zones by editing the palette. |
| OI-40 | Sheen and clearcoat factors, and semantic material labels (`skin`, `cloth`, `hair`, `metal`…), on JIG's own solids; today only an asset's materials take such factors (§7.21.6). |

| OI-44 | Closed in 0.19: a chain loft's sections may be open curves with a `[left, right]` thickness and `flat` or `round` tips, and paths of SVG-style commands written as JSON objects (absolute M L Q C Z), not strings (§7.16.1, G.22; D-152, D-162 to D-169, DD-74). `loft` itself keeps rings of equal length. |

| # | Risk | Mitigation |
|---|---|---|
| R-01 | Transcendental functions differ in the last bit between platforms, so fingerprints can't be exact. | Tolerances in §8.3; the hash uses integers only. |
| R-02 | The Godot reader stores positions and colours in 32-bit floats. | Allowed for final vertex data (C-03); tolerances. |
| R-03 | 0.6 rejects many 0.5 documents (revision history), and every 0.x version may do so again (REQ-06). | Each case has a mechanical fix listed in the revision history. |
| R-04 | GLSL's names suggest GLSL's 32-bit precision and undefined cases. | §7.2.6 lists every difference; binary64 is stated in §2.4 and C-02. |
| R-05 | The draft character extensions change before ratification, so a bake of 0.12 may need a newer form. | DEP-10 names the draft revision; a baker follows changes and the revision history records them; the extensions are never required. |
| R-06 | A clip's keys depend on `sin`, `cos` and other transcendental functions that differ in the last bit between platforms. | Keys are compared within the tolerances of §8.3, not exactly (R-01). |
| R-07 | Two hosts with different IK solvers place a figure differently for the same targets, and a figure whose proportions differ from the author's may not reach them. | JIG fixes the targets, the weights and the order (§7.26.7), not the pose; the conformance data holds samples, not solved poses; the guide says to aim at joints and to fade weights in and out. |

  });

  // Wrap tables so wide ones scroll on their own
  article.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div'); w.className = 'tablewrap'; t.parentNode.insertBefore(w, t); w.appendChild(t);
  });

  // Heading ids + contents
  var used = {}, reserved = { settings: 1, sidebar: 1, customize: 1, upgrade: 1, downloads: 1 };
  function slug(t) {
    var s = t.toLowerCase().replace(/§/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'section';
    if (reserved[s] || /^comment-/.test(s)) s = 's-' + s;
    var b = s, i = 2; while (used[s]) s = b + '-' + i++; used[s] = 1; return s;
  }
  var toc = document.getElementById('toc'), tocM = document.getElementById('toc-m'), lastLi = null, lastLiM = null, links = [];
  article.querySelectorAll('h2, h3, h4').forEach(function (h) {
    var text = h.textContent.trim(); h.id = slug(text);
    var a = document.createElement('a'); a.className = 'anchor'; a.href = '#' + h.id; a.textContent = '#'; a.setAttribute('aria-label', 'Link to ' + text); h.appendChild(a);
    if (h.tagName === 'H4') return;
    function item(parentTop, last) {
      var li = document.createElement('li'), l = document.createElement('a'); l.href = '#' + h.id; l.textContent = text; li.appendChild(l);
      if (h.tagName === 'H2' || !last) { parentTop.appendChild(li); return li; }
      var sub = last.querySelector('ol'); if (!sub) { sub = document.createElement('ol'); last.appendChild(sub); }
      sub.appendChild(li); return null;
    }
    var r = item(toc, lastLi); if (r) lastLi = r;
    var rm = item(tocM, lastLiM); if (rm) lastLiM = rm;
    links.push({ h: h, a: toc.querySelector('a[href="#' + h.id + '"]') });
  });
  document.querySelectorAll('#toc-m a').forEach(function (a) { a.addEventListener('click', function () { a.closest('details').open = false; }); });

  // Highlight the current section
  if ('IntersectionObserver' in window) {
    var cur = null;
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (e.isIntersecting) {
          var l = links.find(function (x) { return x.h === e.target; });
          if (l && l.a) { if (cur) cur.classList.remove('current'); cur = l.a; cur.classList.add('current'); }
        }
      });
    }, { rootMargin: '0px 0px -75% 0px' });
    links.forEach(function (l) { io.observe(l.h); });
  }

  function go() { var id = location.hash.slice(1); if (!id) return; var el = document.getElementById(id); if (el) el.scrollIntoView(); }
  window.addEventListener('hashchange', go); go();
})();
</script>
