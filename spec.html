| Skeleton | For a character, and for any model with blended geometry (§7.15.7): one `skin`, `joints` the nodes of all the parts, the root part's first and then in creation order; `skeleton` the root part's node; `inverseBindMatrices` W⁻¹ of every part (Appendix G.19). A part's mesh is **skinned** when the model is a character, or when the part is the home part of a blended solid: it gets that `skin`, and in each primitive `JOINTS_0` (unsigned short) and `WEIGHTS_0` (float): (j, 0, 0, 0) and (1, 0, 0, 0), a rigid binding to the part's own joint j, for its rigid vertices, and up to four joints and their weights for its blended ones. A skinned mesh's vertices are written in model space at the reference pose, with reversed triangle order for a mirrored part (Appendix G.19). Every other part's mesh stays in part space, unskinned, so a model without blended geometry that is no character bakes with no skin. An asset's own skins and joints are copied with it, vertices and inverse bind matrices as written (§7.21.1) | A glTF importer makes a skeleton from the skin's joints, and may then hang a joint node's children on bone attachments. A blended surface follows its joints' nodes: a host that moves a body by simulation (§7.22) must copy that body's transform to its joint node, as for any ragdoll, or the blended surface stays behind |
| Roles | `KHR_character_skeleton_mapping`: `skeletalRigMappings`: one set named by `scheme`, each role `{"node": the glTF node index, "name": the node's name}`. A part's role names its node; an asset's role the placed copy of the named node. Written only when some role exists | |
| Reference pose | The animation named `reference_pose`, first in `animations`, with `KHR_character_reference_pose {"poseType": reference_pose}`: for each part's node a `translation` and a `rotation` channel, and a `scale` channel when the node has a scale, each sampler `STEP` with one key at time 0 holding the node's value with every `pose` 0 and no `move` (Appendix G.13) | Written for every character. `poseType` is `t_pose` or `a_pose`; an `a_pose` bake writes no arm offsets: a host finds them from the nodes (G.21) |
| Clip (§7.25) | One animation per clip the build animates (§7.25.1), in the order of `clips`, named as the clip. Per part and per channel kind, a channel on the part's node: `rotation` for `pose`, `translation` for `move`; per `morph` channel, a `weights` channel on each node of the asset's placed copy that has a mesh with the target. Samplers are `LINEAR`; their input is the clip's keys (Appendix G.18), and the output the sampled values. A clip needs no character: a wheel's spin is an animation too. A clip with `reverse` (§7.25.1) is an animation of its own, after the clips before it, with the channels of the clip it reverses (the same nodes and properties) and its own sampled values (Appendix G.18); the glTF has no link between the two | |
| Expression clip (§7.25.4) | `KHR_character_expression`: one entry `{"name": clip name, "animation": the clip's animation}` per expression clip, in the order of `clips`, with `KHR_character_expression_morphtarget {"channels": […]}` listing the animation's `weights` channels and `KHR_character_expression_joint {"channels": […]}` listing its `translation` and `rotation` channels, each only when it has any | The clip is also an ordinary animation |
| Expression map | `KHR_character_expression_mapping`: `expressionSetMappings`: scheme → input name → `[{"source": the clip's index in `KHR_character_expression`, "weight": weight}]` | |
| Asset animation (§7.25.5) | After the clips and the action phase clips, a copy of the animation, named `name/animation`, its channels pointing at the placed copies of the nodes, its samplers and accessors copied as they are, but for the translation, rotation and scale channels of the placed root node, which are left out with their samplers (§7.25.5) | |
| Action phase clip (§7.26.6) | An ordinary clip animation (the Clip row), named `action/phase`: one per phase that some part animates, after the clips of `clips`, in the order of `actions` and within an action `enter`, `loop`, `exit`; a phase with `reverse` an animation of its own. Listed in `CANWELL_jig.clips` (`loop` true for a `loop` phase). Channels of an entry with `use` (§7.26.6) are in the same animation; `CANWELL_jig.actions` lists them per use point, so a host plays them on that use point's clock (§7.26.11) | |
| Actions (§7.26) | The sampled targets, bone rotations and attach events in `CANWELL_jig.actions` on the model's root node (below), and the names of a use point's `actions` with it in `CANWELL_jig.placement`. No glTF extension: Khronos has none for IK targets, and there is no person in the model | Hosts without JIG ignore them |
| Character overrides (§7.26.12) | Not sampled: a bake has one document and the overrides need the model's. They travel in the source document (`CANWELL_jig.documents`); a host with a reader at run time merges them (the pair step), and a host without one plays the model's targets | |

**Materials.** Faces are grouped by their texture, alpha settings,
roughness factor, metalness factor and emission; each group is one material with
`pbrMetallicRoughness.baseColorFactor` [1, 1, 1, 1] (the colour is in
`COLOR_0`, which glTF multiplies in). The roughness factor is the
primitive's `roughness` if given, else 1 under a roughness map, else the
surface kind's (§7.17); the metalness factor likewise. The emission
(§7.17) bakes to `emissiveFactor`, the `emissive` colour converted from
sRGB to linear (Appendix G.2), and, when `emissive_strength` isn't 1,
`KHR_materials_emissive_strength {"emissiveStrength": …}` on the
material, with the extension in `extensionsUsed`, never
`extensionsRequired` (a viewer without it shows the colour at strength
1). Faces with a black `emissive` have no emission whatever the strength:
no `emissiveFactor` (glTF's default `[0, 0, 0]`) and no extension; this
rule is for JIG's own materials, and a kit material follows §7.21.8. A
texture bakes to:

- `image` → `baseColorTexture`, with a sampler that repeats for `tile`
  and `surface` and clamps to the edge for `face`;
- `normal` → `normalTexture`, with `scale` = `normal_scale`; a
  bake may leave out `TANGENT`, and viewers then compute MikkTSpace
  tangents as §7.6 expects; if it writes `TANGENT`, it is MikkTSpace;
- `metallic_roughness` → `metallicRoughnessTexture`. A texture with a
  separate `roughness` or `metallic` map can't be baked: glTF holds both
  in one image, and a baker doesn't decode images to pack them. The bake
  fails naming the texture; give it `metallic_roughness` instead;
- `occlusion` → `occlusionTexture`;
- `alpha_mode` and `alpha_cutoff` → `alphaMode` (`OPAQUE`, `MASK`,
  `BLEND`) and `alphaCutoff`.

A kit material (§7.21.8) bakes to a copy of its glTF material, with its
images and extensions, the roughness and metalness factors and the
emission replaced where the primitive gives them; the tint stays in `COLOR_0`. The
`CANWELL_jig` texture entry's `material` is the index of the kit
material's unmodified copy.

**Assets: baking by reference.** A bake shares an asset's data instead
of copying it, so a kit of 40 pieces placed 2,000 times stays the size
of the kit and a list of nodes. The placement node carries the asset's
transform relative to the part, as Appendix G.13 writes a part's, with
a uniform scale in its `scale`. A `repeat` copy's node is named `as_k`, but the `assets[].as` of the
`CANWELL_jig` extension is the repeat's `as`. A `socket` statement's
node is named `socket_<name>` with the socket's name, not its resolved id.
Node `KHR_lights_punctual` and `MSFT_lod` and primitive
`KHR_materials_variants` are dropped from asset copies: lights and
variants are not part of an asset (§7.21.1), and levels are chosen at
build. A `repeat` copy's stretch, along the
copy's own Z, goes in the `scale` of one more node between the
placement node and the asset's subtree.

| Bake case | glTF output |
|---|---|
| An asset placed as it is: no slicing, `materials` or `morph` | Its subtree's nodes, each node's mesh shared by every placement of it |
| With `materials` | One mesh object per distinct set of overrides, its primitives sharing the accessors, pointing at one material copy per distinct set |
| With `morph` | The shared mesh; the weights in each node's `weights` |
| Sliced | Its own `POSITION`, `NORMAL` and `TANGENT` accessors (and morph target positions), since they differ per size, and its socket nodes at their moved origins; every other accessor, texture and material shared |
| Many copies, when the host asks | `EXT_mesh_gpu_instancing`, below |
| Each asset as its own file, when the host asks | glTF 2.1 external assets once ratified (OI-08) |

The bake copies every extension an asset or kit material uses into
`extensionsUsed`, and into `extensionsRequired` those its file
required. Asset images are copied as they are, KTX2 included. The bake
must still pass the glTF-Validator with no errors (REQ-08).

**Parameters as morph targets** (optional, informative). A parameter
whose actual class is at most `shape` never changes the count of
anything (§7.19), so a baker may offer to bake it as a glTF morph
target: build at its minimum and maximum and store the difference. That
is exact only where positions vary linearly with the parameter;
otherwise the baker adds in-between targets and reports the largest
error. A "body build" or "wear" slider then works in an engine without
a JIG reader.

`shuffle` is a hint for renderers, so a bake repeats images plainly; the
extension keeps `shuffle` and `layout` for an importer. Images are embedded
or written next to the bake with the same relative paths (§9.2).

**Optional extensions.** A baker writes core glTF 2.0 by default. It may
offer, but never require, `EXT_mesh_gpu_instancing` for repeated
identical component geometry, `MSFT_lod` for several levels of detail in
one file, and `KHR_mesh_quantization` or `EXT_meshopt_compression` for
size. An extension that must appear in `extensionsRequired` is used only
when the host asks for it.

**glTF 2.1** (informative until ratified, OI-07 to OI-09): part ids are
meant to become glTF 2.1 unique ids as well as node names, imported
components may become external assets, and `box` and `cylinder` may bake
as implicit shapes for bounds and collision.

**The `CANWELL_jig` extension (provisional).** A baker may write it so a
JIG-aware importer can make the model editable again. Its schema is
[`canwell_jig.schema.json`](canwell_jig.schema.json). It keeps the
`CANWELL_` prefix until a second, independent implementation exists, as
glTF's extension process expects; fields may change before they are
marked stable. When written, it is listed in `extensionsUsed`, never in
`extensionsRequired`.

At the glTF root, `extensions.CANWELL_jig`:

| field | value |
|---|---|
| `documents` | list of `{"name", "bufferView", "mimeType": "application/jig+json", "version"}`: the source document, byte for byte, in a buffer view, and the reader's format version |
| `surfaces` | the surface names of §6.3, in index order |
| `assets` | list, one per asset the document declares, in the order `textures` uses: `name`, `gltf` (the source path), `nodes` (one node name or index per level), and `slice` and `stretch` when given |
| `textures` | list, one per texture used, in the document's order: its own `textures` as written, then those of each import in the order of `imports`, each by this same rule, a texture listed once: `name`, `fit`, `align`, `origin`, `offset`, `random_offset`, `shuffle`, `layout` (`{}` when none), `size` (for `tile`, or `surface` with a size), `normal_scale`, `alpha_mode`, `alpha_cutoff`, and `image`, `normal`, `roughness`, `metallic`, `metallic_roughness`, `occlusion` as glTF image indices (the ones the texture has) |

On the model's root node, `extensions.CANWELL_jig`:

| field | value |
|---|---|
| `document` | index into `documents` |
| `seed`, `lod` | the values built with |
| `size` | `[width, height, depth]` |
| `params` | parameter name → settled value (§8.1; colours as `#rrggbb`) |
| `parts` | resolved part id → glTF node index |
| `clips` | list, one per clip the build animates (§7.25.1), in the order of `clips`: `{"name", "animation", "length", "loop", "expression"}` and, when the clip has a `speed`, `"speed"` (metres per second along +Z); `animation` the index of its glTF animation (written only when the build has clips) |
| `assets` | list, one per placed asset in placement order: `{"asset", "node", "as"}`, the asset's index in the root `assets`, the placement's glTF node index, and its `as` if it has one |
| `actions` | object, action name → phase (`enter`, `loop`, `exit`) → `{"length", "times", "reverse", "animation", "use", "targets", "bones", "attach"}` (§7.26.10), written only when the document has `actions`. `length`: seconds. `times`: the key times (G.18, G.20). `reverse`: the name of the phase it reverses, when it reverses one. `animation`: the index of the phase's glTF animation, when some part animates it. `use`: the glTF node index of a use point's part → the indices, in that animation's `channels`, of the channels that play on that use point's clock (§7.26.11); the others play first in, last out; written only when some entry has `use`. `targets`: role → `{"on", "at": [[x, y, z], …], "rotation": [[x, y, z, w], …], "pole": [[x, y, z], …], "weight": […]}`, one entry per key, in the order written, held ones last; `on` the glTF node index of the part, only for a target that has one; `at` and `pole` in metres in the target's frame (the use point's, without `on`); `rotation` and `pole` each only for a target that has one. `bones`: role → `[[x, y, z, w], …]`, one unit quaternion per key. `attach`: list of `{"node", "follow", "from", "until", "at": [x, y, z], "rotation": [x, y, z, w], "keep", "release"}`, `node` the glTF node index of the part, or of the asset's placement; `keep` written only as `true`, for an event that keeps its place, and then no `at` and `rotation`; `release`, when given, `"keep"` or `{"on", "at", "rotation"}` (`on` as a target's, only when given); in a `reverse` phase, the release that puts the prop back where it was before the named event took it (§7.26.5, G.20), so a host applies every release as written. A phase with `reverse` holds its own values, backwards (G.20), as a reverse clip is an animation of its own. An attach event the build left out (V-51) is not written |
| `grips` | object, limb role → `{"at": [x, y, z], "rotation": [x, y, z, w]}`, the character's grips as evaluated (§7.24.4, §7.24.6), in the order written; `at` always, `[0, 0, 0]` when not given; `rotation`, a unit quaternion with w ≥ 0, only for a grip with a turn. Written only when the document declares `character` with `grips`. No Khronos extension has a field for it |

### 9.2 Security

A document can reach only files inside its own folder, and runs no code
but its own expressions.

- Every path (`imports`, the texture image and maps, data `file`, data,
  mesh, asset and kit material `gltf`) is **relative**: segments
  separated by `/`, resolved from the folder of the document that
  contains it.
- A path is one or more segments joined by single `/`s. A segment is one
  or more of the characters `A–Z a–z 0–9 - . _ ~ ! $ & ' ( ) * + , ; = @`
  and is not `..`. So a path can't be empty, start or end with `/`,
  contain `//`, `\`, `%`, `:`, a space or a non-ASCII character, name a
  drive or be a URL. A path that breaks these rules is an error, even if
  the file it names exists.
- These are exactly the RFC 3986 relative references that need no
  percent-encoding and contain no `..`, so a JIG path is also a valid
  glTF URI that names the same file; a bake can carry it unchanged.
  Percent-encoding is not allowed.
- Inside a glTF file read by §7.7, §7.16 or §7.21, a buffer or image URI
  is a `data:` URI or a relative reference, percent-decoded as glTF requires and resolved from
  the glTF file's folder. After decoding it must not be empty, start
  with `/`, contain `\` or a `..` segment, or name a drive or a scheme,
  and it must stay inside the JIG document's folder.
- An imported document's own paths are resolved from its folder, which is
  inside the importing document's folder, so the whole tree stays inside
  the first document's folder.
- A reader must not follow a path out of the folder by any other means
  (for example a symbolic link), and must not fetch anything over a
  network because a document asked for it.
- Expressions can't read files, the clock or the environment; the only
  inputs are the document, its files and the host's values (§4.3).
- §11 bounds the work.

## 10. Errors

### 10.1 Error table

| Situation | Reader behaviour |
|---|---|
| A rule of §6.2 fails (bad JSON, unknown key, wrong type, unknown statement, missing argument, unknown surface name, unknown name or function in any branch, bad path, missing or unreadable file, import cycle, too-short data, …) | Reject the document when it loads, with the path of the first problem. Build nothing. |
| `version` newer than the reader, or another major version | Reject at `version`. |
| A run-time error: a `dynamic` body without volume or `mass`, joint limits with `min` > `max`, a `joint` expression that doesn't give a bool, a density ≤ 0 or a friction or restitution < 0 (§7.22); a light's zero `direction`, `intensity` < 0, `range` ≤ 0, or `cone` outside 0 ≤ inner < outer ≤ π/2 (§7.23.6); wrong type, division or `mod` by zero, a non-finite result, `normalize` of a zero vector, a zero rotation axis, an index out of range, a bad swizzle or constructor, a bad random key, a size limit that isn't a number above 0 or is below the other limit, a part id that is empty, contains `/` or is used twice, a bad `mesh` index, loft rings of different lengths, a `chain_loft` error (§7.16.1, G.22: a `chain` part that doesn't exist yet, isn't a child of the one before or is mirrored differently; a `blend` or `weights` of the wrong length or type, or weights all 0; a section `t` out of order or outside 0–1; a `ring`, `line`, `path` command, anchor index or `thickness` that is wrong; anchors in another order than the first section's; an `id` that is empty, has `/` or is used twice; a bridge to no earlier chain loft, to itself, to an end that isn't `open` or is bridged already, to a chain mirrored differently, or between rings whose anchors differ), a `superellipse_ring` exponent ≤ 0, a non-uniform scale at an `asset` or `repeat` (§7.21.2), a `repeat`'s `up` parallel to the run, a socket reference to an id not placed yet, a zero socket `normal` or an `up` parallel to it, a non-finite morph weight | Stop the run (constants, size limits, derived values or build) at the statement or value, with its path. |
| A run-time error of characters and clips (§7.24, §7.25): a role given twice; an `a_pose` character whose four arm roles are not asset nodes, or whose arm offset can't be found (V-39, G.21); a `role`, `roles`, expression clip, or `animate` clip name that the model's `character` or `clips` don't allow, found when a library's part runs (V-39, V-42); a clip `length` that isn't a number from 0.001 to 600, or a clip `speed` that isn't a finite number; a grip value of the wrong type or not finite (§7.24.6); a channel value of the wrong type, not finite, or a `morph` weight that is not finite; two placements of asset animations under one clip name, or an asset animation named like any other clip of the model | Stop the run at the statement or value, with its path (`clips.walk.length`, `clips.walk.speed`, `build[3].role`, `build[2].animate.walk.pose`, `character.grips.rightHand.at`). |
| A run-time error of actions (§7.26): a phase `length` that isn't a number from 0.001 to 600; a target, bone or attach value of the wrong type or not finite; an attach `from` or `until` that isn't a number, or doesn't satisfy 0 ≤ `from` < `until` ≤ the phase's length; an attach `asset` that two placements share; two events of one prop in a phase that overlap; a use point's `facing` with no horizontal part; the name of an action that a library's use point, or of an action phase that a library part's `animate`, names and the model doesn't have, found when it runs (V-49, V-42); an `animate` entry's `use` whose template gives an empty id or one with `/`, or names a built part that holds no use point offering the action, or more than one (§7.26.6); a character override value of the wrong type or not finite, found by the pair step (§7.26.12), and any run-time error of a phase override's `let` there | Stop the run at the statement or value, with its path (`character.actions.sit.enter.targets.hips.at`, `character.actions.sit.enter.let.seat`, `actions.sit.enter.length`, `actions.sit.enter.targets.hips.at`, `actions.make_coffee.loop.attach[0].from`, `build[2].clearance.facing`, `build[3].animate.sit/enter.use`). |
| A limit of §11 exceeded | Stop the run with the path of the statement that went over. |

A degenerate primitive (§7.16) is not an error.

### 10.2 Recovery

A reader produces no geometry from a run that stopped. Hosts should report
the error and may keep showing the last good result.

### 10.3 Error messages

An error names where it is: the JSON path, with object keys joined by `.`
and list indexes in brackets, ending with the statement keyword and the
key, then `: ` and a message. For example:

```text
build[2].box.size: unknown name 'dpeth'
params[3].options: an enum needs a list of option names
components.wheelset.do[0].part: part id 'wheels_1' is used twice
derived.zf.class: reaches "shape" (build[4].box.center), which ["placement"] doesn't cover
```

A joint's errors name the document key, not the statement: `build[2].joint.when: …`, `build[2].joint.limits: …`; for the shorthand `"joint": "expression"` the path is `build[2].joint`. So are those of a part's `role` and `animate`: `build[2].role`, `build[2].animate.walk.pose_deg`, `build[2].animate.walk.morph.panel.open`; V-43 is reported at `build[2].animate`. A clip's errors name `clips`: `clips.walk.length`, `clips.walk`. An action's
errors name `actions`, the action, the phase and the key as written:
`actions.sit.enter.targets.hips.at`, `actions.sit.enter.bones.leftUpperLeg.pose_deg`,
`actions.make_coffee.loop.attach[0].from`; a value of a `reverse` phase that fails is
reported at the phase it names, as a reverse clip's is. A character's overrides name
`character.actions` the same way (`character.actions.sit.enter.targets.hips.at`, a `let` name at `character.actions.sit.enter.let.seat`); a value
evaluated for a reverse phase is reported at the override it comes from. A use point's errors name the
clearance statement's key: `build[2].clearance.actions`, `build[2].clearance.facing`.

A primitive's argument of the wrong type, or one that fails at run time,
is reported at that argument (`build[0].ellipsoid.radii`,
`build[0].torus.tube_sides`), and a chain loft's at its key as written
(`build[0].chain_loft.sections[1].t`,
`build[0].chain_loft.sections[0].path[2].Q`,
`build[0].chain_loft.ends[0]`). An error about the primitive's input as a
whole is reported at the statement: loft rings of different lengths,
`mesh` indices out of range or not a multiple of 3, `uvs` not one per
point (`build[0].loft`, `build[0].mesh`).

An error in an imported document is reported at the import, followed by
the imported document's own path (e.g. `imports.rail: rail_parts.jig.json:
constants.GAUGE: …`). A run-time error inside a function or component
reports the statement that was running.

### 10.4 Warnings

A **warning** is a problem that doesn't stop the document from loading or
building. A reader reports each as a path and a message, like an error
(§10.3), and builds as normal. There are eight kinds, all listed in §6.2:
V-38 is found when the document loads; V-45, V-46, V-51, V-52, V-53 and V-58 are
found by a build, at its defaults for `conformance/warnings.json` (seed 1,
`lod` 0, the parameters at their defaults), because roles, clip and phase
values, the parts a build has and the shape of a chain loft may depend on the inputs. V-55 is found
by the pair step (§7.26.12), for a character and a model, each built at
its inputs. A warning's path is where the thing is written; a
statement run several times warns once at its path.

## 11. Limits

A reader **must** apply these limits, and reject or stop with an error
(§10) when a document goes over one. It must not apply lower ones. There
is no limit on the size of a document's file: these limits bound the
work, and how large a file a host accepts is the host's (D-128).

| Limit | Value |
|---|---|
| Steps per run (the constants of each document, the size limits, the derived values, the build) | 1,000,000. One step for every statement run, every function call (built-in or the document's), and every item a list comprehension produces |
| Items in any list an expression makes (literal, comprehension, `+`, `range`, `steps`, `flatten`, `path_distances`, …) | 100,000 |
| Length of any string an expression makes | 100,000 code points |
| Nesting of function calls and `use`, together | 64 deep |
| Triangles per build, after dropping degenerate ones; an asset's own triangles cost a reader nothing per triangle and don't count | 1,000,000 |
| Import nesting (a model importing a library that imports another counts 2) | 8 deep |
| Numbers per data block, and per accessor a glTF `mesh` reads | 1,000,000 |
| Assets placed per build, `repeat` copies included. An `asset` statement counts one step like any statement; each `repeat` copy counts one more | 100,000 |
| Distinct glTF files per document, imports included | 256 |
| Vertices per sliced asset, per level | 1,000,000 |
| Sockets per asset | 256 |
| Colliders per build, inferred and declared | 100,000 |
| Points a convex hull is made from | 100,000 per hull |
| Placement items per build (clearances, supports, openings, effects, lights) | 100,000 |
| Clips per document | 64 |
| Actions per document, and action overrides in `character.actions` | 64 each |
| Attach events per build, those kept (§7.26.5); a build over it stops at the phase that crosses it (`actions.sit.loop`) | 1,000 |
| Keys per clip (30 Hz over at most 600 s, Appendix G.18) | 18,001 |
| Roles per build | 1,000 |
| Sampled channel values per build (keys × channels, summed over clips, the clips of action phases included, and over action phases: a target counts its `at` and its `weight`, and its rotation and its `pole` each when it has one, a bone channel one, held ones (§7.26.2) included; a build over the limit stops at the phase that crosses it, after the clips are counted: `actions.sit.loop`) | 1,000,000. Sampling is a run of its own with the 1,000,000 steps of §11's first row. The pair step (§7.26.12) is another, with its own 1,000,000 steps and 1,000,000 values (each merged phase counted as above), stopping at the override's phase (`character.actions.sit.loop`) |
| `sides` | 3–256 (clamped, not an error) |
| A `chain_loft`'s `steps` | 1–256 (clamped). Each path command and each evaluation of `weights` counts steps of the build (first row) |
| `bezier` segments | 1–256 (clamped) |
| Texture layout | 1–8 courses, 1–8 units per course |

### 12.2 Acceptance

A reader may call itself a conforming JIG 0.19 reader when it:

1. accepts every model in `models/` and rejects every document in
   `conformance/errors/` with the named path;
2. matches `conformance/reference.json` within the tolerances of §8.3;
3. gives the hash test vectors of Appendix G.3 exactly;
4. applies the limits of §11 and the path rules of §9.2.

A baker also passes TC-06 and TC-07.

  "constants": {"SEAT": 0.035, "LEG": 0.02},

    {"surface": "wood"},

### Appendix F: Glossary

| Term | Meaning |
|---|---|
| Asset | A node of a glTF file and its subtree, placed by a document and passed through unchanged (§7.21). |
| Block | A list of statements; scopes `let` names and restores surface, grain and crease angle. |
| Action | A named description of how a humanoid uses a use point: up to three phases of targets, a bone clip and attach events, in the use point's frame (§7.26). |
| Attach event | An interval of a phase in which a part or placed asset of the model follows a bone, such as a cup in a hand (§7.26.5). |
| Bone clip | The rotations of VRM humanoid roles in a phase, "how the body moves"; a character may replace it (§7.26.4, §7.26.7). |
| Character override | A character's change to the targets of a model's action phase, written relative to the model's targets; a reader merges it with the model's in a pair step (§7.26.12). |
| Grip | A character's point and frame of a hand or foot that a host puts on a target instead of the joint (§7.24.6). |
| Blended geometry | A solid whose vertices are bound to several parts with weights, such as a `chain_loft` sleeve that bends at the elbow; it belongs to its home part (§7.15.7, §7.16.1). |
| Chain loft | A surface along a smooth curve through a chain of parts' pivots (or a path), with sections matched and interpolated along it (§7.16.1). |
| Home part | The part a `chain_loft` runs in, which owns it for drawing and output (§7.15.7). |
| Section | A chain loft's outline at a place along its curve: a `ring`, a `path` of commands or a thick `line` (§7.16.1). |
| Pole | A point in a hand or foot target's frame that the elbow or knee bends toward (§7.26.3). |
| Character | A model whose parts and skinned assets' bones form one skeleton with roles (§7.24). |
| Clip | Motion of parts and morph weights written as expressions of time, sampled at 30 Hz (§7.25). |
| Expression | A clip run by a 0–1 driver instead of by time, such as a blink (§7.25.4). |
| Phase | One of `enter`, `loop`, `exit` of an action; also a clip named `action/phase` (§7.26.2, §7.26.6). |
| Reference pose | The model with every part's `pose` 0, the pose a figure is modelled in (§7.24.2). |
| Target | Where an end effector (hips, head, hand, foot) must be in a phase, with a weight, in the use point's frame (§7.26.3). |
| Use point | Where a person using a model goes: `point`, `facing`, free names, and the actions it offers (§7.23.1). |
| Role | The standard name of a bone in a naming scheme, such as `leftUpperArm` (§7.24). |
| Scheme | An outside naming scheme for roles or expressions, such as `vrm1_humanoid` (§7.24.3). |
| Crease angle | Faces meeting at less than this are shaded smooth (§7.17). |
| Face | One primitive face, for texture fitting (§7.6). |
| Global name | Parameter, constant, data block, derived value, import alias or built-in name (§7.2.3). |
| Instance name | The `as` of a `use`; prefixes the resolved ids of the parts it makes. |
| Key | The value that selects a random number (§7.2.5). |
| Kit | A glTF file of assets made to fit together by their sockets; a kit material is one of its materials used as a texture (§7.21.8). |
| Library | A document with no `build`, imported for its definitions. |
| Part space | Coordinates relative to a part's pivot and axes, before its pose (§7.15.7). |
| Piece seed | A number in [0, 1) per solid, from the seed and the solid's piece key: where its statement is and the `use`s and `for`s it runs under (§7.2.5). |
| Resolved id | A part's id with its instance prefixes (§7.15.7). |
| Slice zone | A slab of an asset, marked by the artist, that may stretch so the asset reaches a size (§7.21.5). |
| Socket | A named frame where pieces meet: origin, +Z out of the piece, +Y up (§7.21.3). |
| Solid | What one primitive makes; smoothing and piece seeds work per solid. |
| Swizzle | Reading several components of a vector or colour at once, in any order: `p.xz`, `c.rgb` (§7.2.2). |
| Element | One vector (or one number) of a data block, as glTF counts accessor elements (§7.7). |

### Appendix G: Algorithms (normative)

Everything here changes the output, so readers must follow it exactly
(within floating-point rounding where the result isn't an integer).
"Normalize" divides by the length; internal normalizations of zero vectors
here give zero and are not errors (§7.2.4's error is for the `normalize`
built-in only).

#### G.1 Number formatting

`str()` and templates print a number x as follows. If x is a whole number
and |x| < 10¹⁵, print it as a decimal integer with no point (`-0` prints
`0`). Otherwise round x to 14 significant digits (a tie rounds up), take
the resulting binary64 value y, and print the shortest decimal that reads
back as y, as ECMA-262 Number::toString does: plain digits with a point
when 10⁻⁶ ≤ |y| < 10²¹ (`0.1`, `1234.5678`, `0.000001`), otherwise one
digit, a point and more digits if any, `e`, a sign and the exponent
(`1e-7`, `1.5e+21`).

#### G.2 Colours

Channels are binary64 numbers. **RGB to HSV** (for `.h .s .v` and `vary`): with M = max(r, g, b), m = min(r, g, b), δ = M − m:

```text
v = M
s = M ≠ 0 ? δ / M : 0
h = δ = 0 ? 0
  : r = M ? (g − b) / δ
  : g = M ? 2 + (b − r) / δ
  :         4 + (r − g) / δ
h = h / 6;  if h < 0: h = h + 1
```

**HSV to RGB** (for `hsv()` and `vary`), with h already in
[0, 1):

```text
if s = 0: r = g = b = v
else:
  h6 = h × 6;  i = floor(h6);  f = h6 − i     (i = 6 counts as 5)
  p = v (1 − s);  q = v (1 − s f);  t = v (1 − s (1 − f))
  (r, g, b) = i 0: (v, t, p)  1: (q, v, p)  2: (p, v, t)
                3: (p, q, v)  4: (t, p, v)  5: (v, p, q)
```

`hsv(h, s, v)` first wraps h: h − floor(h). Alpha is 1.

**darken(c, f)** = (r(1 − f), g(1 − f), b(1 − f), a).
**lighten(c, f)** = (r + (1 − r) f, g + (1 − g) f, b + (1 − b) f, a).

**vary(c, a, key)**: with (h, s, v) of c and r₁, r₂, r₃ the draws k = 1, 2,
3 of G.3:

```text
v' = clamp(v × (1 + (0.36 r₁ − 0.18) a), 0, 1)
s' = clamp(s × (1 + (0.24 r₂ − 0.12) a), 0, 1)
h' = h + (0.024 r₃ − 0.012) a;   h' = h' − floor(h')
result = HSV-to-RGB(h', s', v'), alpha a of c
```

**Hex output** (`str()`, glTF `params`): each channel clamped to 0–1,
× 255, rounded half away from zero, two lower-case hex digits.

**sRGB to linear** (baking `COLOR_0`): c ≤ 0.04045 ? c / 12.92 :
((c + 0.055) / 1.055)^2.4.

#### G.3 Random hash

All arithmetic in this section is on unsigned 32-bit integers, modulo
2³². The hash is PCG-hash (Jarzynski & Olano 2020):

```text
pcg(x):
  state = x × 747796405 + 2891336453
  word  = ((state >> ((state >> 28) + 4)) xor state) × 277803737
  return (word >> 22) xor word
```

A list of words w₁ … wₙ hashes by chaining:

```text
H(w₁ … wₙ):  h = 0;  for each w: h = pcg(h + w);  return h
U(h) = floor(h / 256) / 16777216          (top 24 bits, in [0, 1))
```

Values are encoded as words, each starting with a tag:

| value | words |
|---|---|
| number x | 1, lo(x), hi(x): the low and high 32 bits of x's IEEE 754 binary64 bit pattern, after turning −0 into +0 |
| string | 2, the number of Unicode code points, then each code point |
| list | 5, the number of elements, then each element's words |

The seed is encoded as a number. Then:

| draw | value |
|---|---|
| keyed: u(seed, key, k) | U(H(enc(seed), enc(key), k)) |
| piece seed of a primitive statement with piece key K: p(seed, K) | U(H(enc(seed), 7, enc(K))) |

`random` and `random_range` use k = 0; `vary` uses k = 1, 2, 3. Tag 7
never starts a key's encoding, so the two kinds of draw never collide.

The **piece key** K of a primitive statement, each time it runs, is the
list [d, s, U, F]:

- d: the path of the document the statement is in, from the folder of
  the document being built, `/`-separated with no `.` or `..` segments
  (§9.2); `''` for the document being built. A document imported as
  `parts/wheel.jig.json` that imports `hub.jig.json` gives
  `'parts/hub.jig.json'`.
- s: the statement's JSON path in that document, as error messages write
  it (§10.3) without the keyword: `'build[3].do[1]'`,
  `'components.wheel.do[0]'`.
- U: for each `use` the statement runs under, outermost first, the list
  [d, s, n] of that `use` statement's document, its JSON path and its
  instance name (the resolved `as`, or `''` without one).
- F: for each `for` the statement runs under, outermost first and
  across components, the variable's value when it is a whole number, a
  string, or a list of those; otherwise its position in the `in` list,
  counting from 0. A computed fraction can differ in its last bit between
  readers (R-01, R-02), so it is keyed by position.

The key never counts statements, so it is the same at every `lod` and
whatever else runs; values rather than positions in F keep a piece's
seed when a `for` list changes its step (`range(0, 12, lod == 0 ? 1 : 3)`).
Tags 3, 4 and 6 are unused and reserved (0.6 used 3 and 4 for vector
keys).

In JavaScript, use `Math.imul(x, y) >>> 0` for products and `>>> 0` after
sums; in GDScript and other languages with 64-bit integers, multiply and
add in 64 bits and keep `& 0xFFFFFFFF` (the products stay below 2⁶³); read
the bit pattern with a `DataView` / `encode_double`.

| pcg(0) | `07bb2fe2` | |
| pcg(1) | `a8beea3c` | |
