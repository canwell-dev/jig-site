# JIG — JSON Instructions for Geometry, version 0.19

## Document control

| | |
|---|---|
| Title | JIG — JSON Instructions for Geometry |
| Format version | **0.19** |
| Status | Draft |
| Last updated | 2026-11-18 |
| Schema | [`jig.schema.json`](jig.schema.json); glTF extension [`canwell_jig.schema.json`](canwell_jig.schema.json) (Appendix C) |
| Normative references | GLSL 4.60 for expressions, glTF 2.0 for data, materials and baking (§3) |
| Reference reader | The JavaScript reader in `js/` (Node 22 or later, no dependencies): `node js/bin/reference.mjs` writes `conformance/reference.json` and `node --test js/test/` checks it (§8.3). The CanWell JIG Godot plugin, `godot/addons/canwell_jig/`, is checked against the same references. |

Section numbers changed in 0.6, and in a few places in 0.7. Appendix H maps the earlier numbers to the
new ones.

## Revision history

The revision history is in [HISTORY.md](HISTORY.md): one row per format version, newest first, with every breaking change and the mechanical way to update a document (REQ-06).

---

## 1. Introduction

### 1.1 Purpose

JIG describes a **parametric 3D model**: the parameters a user can set,
the values derived from them, and the steps that turn
parameter values into geometry, from low-poly to scanned detail. A JIG
**document** is a JSON file, conventionally named `*.jig.json`.

This specification defines what a valid document is, and what geometry a
reader must build from a document and a set of parameter values.

### 1.2 Background

Mesh formats (glTF, OBJ) store one finished shape. A JIG document stores
how the shape is made, so a reader can rebuild it at any size or setting:
a bench at any length, a crate with any number of planks, a track along
any curve. One document replaces a family of meshes, and stays small.

### 1.3 Scope

In scope:

- the document: parameters, presets, constants, functions, components,
  derived values, build statements and the expression language;
- the geometry a reader builds: triangles, normals, vertex colours,
  surface kinds, texture coordinates, parts;
- image textures and binary data blocks a document refers to;
- composing finished glTF assets (§7.21): which asset, where, how many,
  and how it fits the requested size, with the asset's own look kept;
- physics (§7.22): colliders, mass properties, physical materials,
  motion types, collision filters and joints;
- placement data (§7.23): clearances, use points, mounts, the wall side,
  supports, openings, passages, footprints, plan symbols, tags, socket
  types, lights, effect zones and selectable parts;
- characters (§7.24): a skeleton of parts and skinned assets whose bones
  have standard names;
- animation (§7.25): clips of parts' poses, movements and morph weights,
  written as expressions of time and sampled at a fixed rate, facial
  expressions, and an asset's own animations passed through;
- use actions (§7.26): how a humanoid uses a use point, as targets for
  end effectors and a bone clip in VRM roles, sampled at a fixed rate,
  with the model's own parts moving in step and props following a hand;
- baking one variant to glTF (§9.1).

Out of scope:

- simulation: a host steps the physics (§7.22). Playing clips, blending,
  retargeting, inverse kinematics, look-at, camera and visibility hints
  and building ragdolls from joints are the host's; JIG describes the
  skeleton, the clips and the actions with their targets (§7.24 to
  §7.26), and the solver that moves a figure onto them is the host's. A part can still be posed
  by a host through its pivot (§7.15.7) and its joint (§7.22.6). Baked
  part nodes (§9.1) are valid targets for glTF's `KHR_animation_pointer`
  and `KHR_interactivity`;
- materials beyond the surface kinds, textures and the `roughness`,
  `metallic` and `emissive` values (§7.15.4, §7.6, §7.17): emissive maps, scene lighting
  beyond a model's own lights (§7.23.6),
  weathering and dirt belong to the renderer. An asset's or kit's own
  glTF materials are kept as they are, and a document may change only
  their factors (§7.21.6);
- editing an asset's geometry beyond placing it, slicing it (§7.21.5)
  and setting its own morph targets (§7.21.6);
- scene layout: where models are placed, the curves path models follow,
  pathfinding, and whether a layout is valid (§7.23 gives only the
  volumes);
- how a host stores parameter values.

### 1.4 Roles

| Role | Does |
|---|---|
| **Author** | Writes documents, by hand or with tools. |
| **Reader** | Loads and checks a document, settles parameter values and builds the geometry. |
| **Host** | The program that uses a reader: sets parameters, size, `seed` and `lod`, supplies a path curve, renders the result, plays clips and actions (§7.25, §7.26). |
| **Baker** | A reader that writes one variant to glTF (§9.1). |

## 2. Requirements and design goals

### 2.1 Requirements

| # | Requirement |
|---|---|
| REQ-01 | A document is plain JSON (RFC 8259) and nothing else. |
| REQ-02 | A reader rejects an invalid document before building, naming the place of the first problem (§10). |
| REQ-03 | Names and functions are checked in every branch, including branches that don't run. |
| REQ-04 | The same document, parameter values, size, `seed`, `lod` and path give the same geometry in every conforming reader, within the tolerances of §8.3. |
| REQ-05 | No document can cause unbounded work (§11) or read files outside its own folder (§9.2). |
| REQ-06 | Before 1.0, a version may change or remove any form. A renamed or replaced form is removed: there are no aliases, legacy forms or opt-outs. A key's unit twin (an angle in radians and its `_deg` key in degrees, §5.1) is one property written in two units, not an alias. The revision history lists every breaking change and how to update a document. From 1.0, every 1.N document is a valid 1.N+1 document and reads the same. |
| REQ-07 | A model can be rebuilt at any size within its limits, any level of detail and any seed. |
| REQ-08 | A baked file is valid glTF 2.0: the Khronos glTF-Validator reports no errors for it (§9.1). |
| REQ-09 | A reader can tell, before building, what a change of inputs can affect (§7.19); whatever it reuses between builds, its output equals a full build with the same inputs (§7.20). |
| REQ-10 | With its geometry, a reader builds each part's colliders, mass properties, physical material, motion type, collision filter and joint (§7.22). The same document and inputs give the same physics in every conforming reader, within §8.3's tolerances; how a host simulates it is not specified. |
| REQ-11 | A document without physics markup still has physics: colliders inferred from its geometry, values from its surface kinds, every part welded to its parent (§7.22). |
| REQ-12 | A bake writes physics with the Khronos glTF physics extensions, never in `extensionsRequired` (§9.1). |
| REQ-13 | A model may say how it is placed and used: clearances, use points, mounts, its wall side, supports, wall openings and passages, navigation footprint, plan symbol, tags, socket types, lights, effect zones and selectable parts (§7.23). Placing models, pathfinding and checking a layout stay the host's. |
| REQ-14 | A model may be a character: its parts and the bones of its skinned assets form one skeleton, each bone may have a role from a naming scheme, and the same document and inputs give the same roles in every conforming reader (§7.24). |
| REQ-15 | A document may author clips as expressions of time. Every conforming reader samples them at the same fixed rate and gives the same keys, within §8.3's tolerances (§7.25, Appendix G.18). A clip changes no geometry, physics or placement. |
| REQ-16 | A bake writes the character, its animations and its expressions with the Khronos character extensions, never in `extensionsRequired` (§9.1). |
| REQ-17 | A use point may offer actions: named phases of targets, bone rotations and attach events, written as expressions of time in the use point's frame. Every conforming reader samples them at the same fixed rate and gives the same keys, within §8.3's tolerances (§7.26, Appendix G.20). An action changes no geometry, physics or placement. Solving the targets is the host's. |
| REQ-18 | A bake writes the sampled targets, bone rotations and attach events of the actions beside the use points, and the model's own part motion as glTF animations named `action/phase` (§9.1). |

### 2.2 Design goals

In priority order when they conflict.

| Goal | Description | Success criteria |
|---|---|---|
| A recipe, not a mesh | A document stores how a shape is made, so a reader can rebuild it at any size or setting. Stored results (data blocks, `mesh`) are a last resort and stay parametric around them. Sculpted assets are ingredients the recipe places, sizes and picks, never edits (§7.21). | Library models have parameters and sizes; data blocks feed constants; a composed model resizes without stretching sculpted detail. |
| Plain JSON | Any JSON tool reads and writes a document. Comments are `//` keys, vendor data `x-` keys. | No syntax beyond JSON except expressions inside strings. |
| No clutter before 1.0, strict after | Before 1.0 the format changes freely: a renamed or replaced form is removed, with no alias, legacy form or opt-out. From 1.0, every 1.N document is a valid 1.N+1 document and reads the same. | The revision history lists every breaking change with how to update a document; no version carries a compatibility form. |
| Strict and checkable | Unknown keys are errors; names are checked in every branch; errors carry a path. | Every check of §6.2 runs at load, before any build and without the host's inputs. |
| Bounded and safe | No unbounded work; no access outside the document's folder. | §11 limits, §9.2 paths. |
| One format, many readers | The spec alone is enough to build a reader that matches the references. | A new reader passes `conformance/` (§12). |
| Easy to write | People and AI models write documents by hand, and fix them from the error message alone. | Errors name the place and the cause (§10.3); the authoring guide's examples are checked; a text editor and a reader are all an author needs. |
| The host controls the host's things | Size, seed and detail belong to the host; appearance beyond geometry to the renderer. | No parameters that duplicate them (§8.2). |
| Fast to change | A host rebuilds a model while the user drags a slider, and knows before building what a change can affect. | Impact classes found from the document alone (§7.19); a partial rebuild equals a full one (§7.20). |
| Real-world and simple | Metres, Y up, origin on the floor, sRGB, radians with a degree twin. One general mechanism over several special ones. | §5.1 conventions. |
| Low-poly to scanned detail | The format scales from a crate to a scanned bust without changing character. | Compact documents; sidecar data only where geometry is data. |

### 2.3 Design principles

- Each statement does one thing; blocks scope names and state.
- Values are immutable; the only state is the build's current transform,
  part, surface, grain and crease angle, all restored at the end of a block.
- Evaluation order is defined everywhere it can change the result.
- Everything that changes the output is specified exactly (Appendix G).
- **GLSL governs expressions; glTF governs data.** Expressions use GLSL's
  operators, swizzles, constructors and built-in names (§7.2). Data
  blocks, textures, materials, coordinates and baked output use glTF's
  vocabulary and rules (§7.6, §7.7, §9.1).
- **Same name, same definition.** A function or key with a GLSL or glTF
  name behaves as GLSL or glTF defines it. Where JIG deliberately
  differs, the text says so in a "Differs from GLSL" or "Differs from
  glTF" note.

### 2.4 Non-functional requirements

- **Work limits.** §11 fixes the work a document may cause. A reader must
  apply them.
- **Nesting.** Functions and components nest at most 64 deep; imports at
  most 8 deep (§11).
- **Determinism.** Arithmetic is IEEE 754 binary64, not GLSL's 32-bit
  `float`: GLSL supplies notation and function definitions, not
  precision. The random hash uses
  32-bit integers only (Appendix G.3), so it is bit-identical everywhere.
  Transcendental functions (`sin`, `pow`, …) may differ in the last bit
  between platforms; the conformance tolerances (§8.3) allow for it.
- **Document size.** No limit is defined; see OI-04.

## 3. Assumptions, constraints, dependencies

| # | Assumption |
|---|---|
| A-01 | Hosts can rebuild a model when a parameter changes; building is fast enough for interactive editing. |
| A-02 | Documents and their files are stored together in one folder tree. |

| # | Constraint |
|---|---|
| C-01 | A document is UTF-8 JSON. |
| C-02 | A reader evaluates numbers as IEEE 754 binary64. |
| C-03 | Readers may store final vertex data (positions, normals, colours) in 32-bit floats. |

| # | Dependency |
|---|---|
| DEP-01 | JSON, RFC 8259. |
| DEP-02 | sRGB colour space (IEC 61966-2-1). |
| DEP-03 | PNG and JPEG images for textures; a reader must load both. These are glTF 2.0's core image formats. Images inside an asset's or kit material's glTF file may also be KTX2 (`KHR_texture_basisu`), which a reader must pass on and render (§7.21.1). WebP (`EXT_texture_webp`) is a candidate for later versions. |
| DEP-04 | glTF 2.0 (Khronos), **normative**: the vocabulary and rules for data blocks (§7.7), glTF geometry (§7.16), materials and texture maps (§7.6, §7.17), coordinates (§5.1) and baking (§9.1). |
| DEP-05 | IEEE 754 binary16, binary32 and binary64 for data blocks and arithmetic. |
| DEP-06 | The OpenGL Shading Language (GLSL) 4.60, **normative** for expression syntax (its chapter 5: operators, precedence, swizzles, constructors) and for the definitions of the built-in functions JIG adopts (its chapter 8). Version 4.60 because it defines the double-precision built-ins. Where JIG differs, §7.2.6 says so. |
| DEP-07 | URIs, RFC 3986: every path is a relative reference (§9.2). |
| DEP-08 | The Khronos glTF-Validator, for checking bakes (§8.3). |
| DEP-09 | The Khronos glTF physics extensions `KHR_implicit_shapes` (release candidate) and `KHR_physics_rigid_bodies` (draft, glTF PR #2424), **normative** for physics (§7.22): JIG takes their meanings, units and defaults, in its own spelling (`static_friction` for `staticFriction`), and tracks their changes until they are ratified (OI-19). |
| DEP-10 | The Khronos character extensions of glTF PR #2512 (draft, head 7ab5368): `KHR_character`, `KHR_character_skeleton_mapping`, `KHR_character_reference_pose`, `KHR_character_expression` with `_morphtarget`, `_joint` and `_mapping`, **normative** for what a bake writes (§9.1) and for the meaning of expressions (§7.25.4). JIG tracks their changes until they are ratified (OI-23). |
| DEP-11 | The VRM 1.0 specification (`VRMC_vrm-1.0`, humanoid and expressions), **normative** only for the role names of the scheme `vrm1_humanoid` (also those of an action's `bones` and `attach`, §7.26) and the expression names of `vrm1_expressions` (§7.24.3). |
| DEP-12 | `KHR_node_selectability` (ratified), for `selectable` parts (§9.1). |

Informative references, not needed to build a reader: glTF 2.1 (announced,
not ratified; OI-07 to OI-09), `KHR_interactivity` (its math nodes share
GLSL's names), `KHR_animation_pointer`, `KHR_texture_transform` (§7.6),
and the optional bake extensions of §9.1.

## 4. Overview

### 4.1 How a document becomes geometry

A reader loads a document and everything it imports, checks it
completely, and evaluates its constants. For each build it takes the
host's inputs (parameter values, size, `seed`, `lod` and path), settles
them (§8.1), evaluates the derived values (§7.18), then runs the build
statements. The
statements drive a **mesh kit**: they place primitives, each a **solid**,
into **parts**. The result is a set of parts, each with triangles carrying
positions, normals, colours, surface data and texture coordinates. A
document that declares a character or clips also gives its roles and
samples its clips after the build (§7.24, §7.25); one that declares
actions also samples them (§7.26).

### 4.2 Context

| Component | Responsibility |
|---|---|
| Document (`*.jig.json`) | Parameters, derived values and build steps. |
| Sidecar data (`*.data.bin`) | Large number tables for `data` blocks (§7.7). |
| glTF files (`*.gltf`, `*.glb`) | Accessors for `data` blocks (§7.7) and node geometry for `mesh` (§7.16). |
| Textures (PNG, JPEG) | Images and maps for texture values (§7.6). |
| Reader | Checks, settles, builds (§7). |
| Host | Supplies values, `seed`, `lod` and a path; shows and renders the parts. |
| Baker | Writes one variant to glTF (§9.1). |

### 4.3 Data flow

```text
document + imports + data + images
        │ load, check (§6.2, §10)
        ▼
  constants evaluated (§7.12)
        │
host values, size, seed, lod ──► presets (§7.11), size limits (§7.8) ──► settled inputs (§8.1)
        │                                                                 │
host path ───────────────────────────────────────────────────────────────┤
                                                                          ▼
                                                        derived values (§7.18)
                                                                          │
                                                        build statements (§7.15)
                                                                          │
                                                       parts: triangles, normals,
                                                       colours, surface data, UVs
                                                                          │
                                                       roles collected, clips and actions sampled (§7.24 to §7.26)
                                                                          │
                                                       render, or bake to glTF (§9.1)
```

### 4.4 Characteristics

| | |
|---|---|
| Format | JSON (RFC 8259), UTF-8 |
| Extension | `.jig.json` |
| Media type | `application/jig+json` (**provisional**: not registered) |
| Versioning | `"major.minor"` in `version` (§5.4) |

## 5. File design

### 5.1 File characteristics

- **Encoding.** UTF-8 JSON (RFC 8259). Duplicate keys in one object are
  an error.
- **Member order is significant.** `let`, `constants`, `derived`, `data`,
  `textures`, `presets`, `params` and statement lists are read in the
  order written. A tool that rewrites a document must keep the order of
  object members.
- **Units** are metres. **Axes** are right-handed with **+Y up**: glTF's
  frame, so a bake needs no axis conversion (§9.1). A model's front faces
  +Z, as in glTF (a convention, §8.2). The model's origin is on the
  floor; documents describe where it is (e.g. "centred", "at the post").
- **Angles** are radians, in documents and in expressions, as in GLSL
  and glTF. Every key that takes an angle has a **twin** whose name ends
  in `_deg` and that takes degrees: `pose` / `pose_deg`, `rotation` /
  `rotation_deg`, `phase` / `phase_deg`, `smooth` / `smooth_deg`, `spin`
  / `spin_deg`, and the `rotate` op's `angle` / `angle_deg`. The two
  are one property: a reader converts degrees with d · π / 180 before
  anything else reads the value, and a document gives at most one of a
  pair (V-27). Expressions convert with `radians()` / `degrees()`, and
  `rotate_deg()` is the degree twin of `rotate()` (§7.2.4).
- **Colours** are sRGB-encoded, written `#rrggbb` (also `#rgb`,
  `#rrggbbaa`), as glTF's base colour images are. Roughness, metalness and
  baked vertex colours are linear (§9.1; conversion in Appendix G.2).
- **Comments**: in any object, a key that starts with `//` is ignored.
  Use `"//"` for one comment, and `"//2"` and so on if an object needs
  several.
- **Extensions**: top-level keys starting with `x-` are reserved for
  vendor data and ignored by readers that don't know them. Any other
  unknown key is an error.
- **`null`** is never a value. A key whose value is `null` is an error;
  leave the key out instead.

### 5.2 Naming

- Documents: `*.jig.json`.
- Sidecar data: `*.data.bin` by convention, next to the document.
- Images: any relative path, conventionally under `textures/`.
- glTF sources: `*.gltf` or `*.glb`.
- All paths follow §9.2: relative, `/`-separated, inside the document's
  folder.

### 5.3 Structure

```json
{
  "format": "jig",
  "version": "0.8",
  "name": "Plank bench",
  "description": "…",
  "imports":    { … },
  "path":       { … },
  "size":       { … },
  "textures":   { … },
  "data":       { … },
  "params":     [ … ],
  "presets":    { … },
  "constants":  { … },
  "functions":  { … },
  "components": { … },
  "derived":    { … },
  "build":      [ … ],
  "character":  { … },
  "clips":      { … },
  "expression_map": { … },
  "actions":    { … }
}
```

Only `format` and `version` are required. §6.1.1 lists every top-level key.

### 5.4 File-level information

`format` is always `"jig"`.

`version` is `"major.minor"`: the **lowest reader version the document
needs**. It is not a feature switch: a reader reads every document by its
own rules, whatever `version` says, and must not enable, disable or change
any behaviour because of it.

- A reader accepts a document with its own major version and a minor
  version up to its own.
- A reader with a lower minor version doesn't try: it rejects the document
  at `version`, naming the version it needs.
- A reader rejects any other major version.

An author sets `version` to the lowest version whose features the
document uses. A document that says `"0.3"` but uses a 0.8 feature is read
as normal by a 0.8 reader. Before 1.0, a document written for an older
version may be rejected by a newer reader (REQ-06); the revision history
says how to update it.

`name`, `description`, `author` and `license` are free text.

## 6. Data dictionary

### 6.1 Keys

Types: *number*, *bool*, *string*; *value* is a number, bool, expression
string or list of values (§7.2); *vec3* is a value giving a vec3 or a
list of 3 numbers. *Identifier* means `[A-Za-z_][A-Za-z0-9_]*`, not a
reserved word or reserved name (§7.2.3). *Path* is a relative path
(§9.2). Every object also accepts `//` comment keys.

A phase (§7.26.2) of an action. Every value is an expression that reads

| # | Key | Definition | Type | Required | Default | Example |
|---|---|---|---|---|---|---|

| 5 | `attach` | List of attach events (§6.1.32): a part or asset of the model follows a role | list | no | `[]` | |
| 6 | `hold` | Every target and bone channel the phase doesn't name takes the last values of the phase before it, for the whole phase (§7.26.2); not on `enter`, not with `reverse`, not in a cycle (V-47) | literal bool | no | `false` | `true` |
| 7 | `doc` | Note | string | no | | |

#### 6.1.32 Target, bone channel and attach event

A **target** (§7.26.3), keyed in `targets` by one of the roles `hips`,
`head`, `leftHand`, `rightHand`, `leftFoot`, `rightFoot`:

| # | Key | Definition | Type | Required | Default |
|---|---|---|---|---|---|
| 1 | `at` | Where the effector must be, metres, in the target's frame: the use point's (§7.26.1), or the part's of `on`; for `head`, the point it looks at. Reads `t` and `u` | value: vec3 | yes | |
| 2 | `rotation` | The effector's orientation in that frame, radians about X, Y, Z (as a part's `pose`, §7.15.7); not on `head`. Reads `t` and `u` | value: vec3 | no | `[0, 0, 0]`: the orientation in the figure's T-pose (§7.24.2) |
| 2 | `rotation_deg` | The same in degrees (§5.1); not with `rotation` | value: vec3 | no | |
| 3 | `weight` | How strongly the solver pulls the effector onto the target, 0 to 1 (§7.26.3); clamped. Reads `t` and `u` | value: number | no | `1` |
| 4 | `on` | The frame of `at`, the rotation and `pole`: the resolved id of a part (§7.15.7), whose frame moves with it; `body`, the root part, is the model's space (§7.26.3) | literal string | no | none: the use point's frame |
| 5 | `pole` | The point the knee or elbow bends toward, metres, in the target's frame (§7.26.3); only on `leftHand`, `rightHand`, `leftFoot`, `rightFoot`. Reads `t` and `u` | value: vec3 | no | none: the host chooses the bend |

A **bone channel** (§7.26.4), keyed in `bones` by any role of
`vrm1_humanoid` (§7.24.3):

| # | Key | Definition | Type | Required | Default |
|---|---|---|---|---|---|
| 1 | `pose` | The bone's rotation from its T-pose (§7.24.2), radians about X, Y, Z (§7.26.4). Reads `t` and `u` | value: vec3 | one of the two | |
| 1 | `pose_deg` | The same in degrees (§5.1); not with `pose` | value: vec3 | | |

An **attach event** (§7.26.5), an object in a phase's `attach` list:

| # | Key | Definition | Type | Required | Default |
|---|---|---|---|---|---|
| 1 | `part` | The resolved id of a part of the model (§7.15.7) | literal string | one of `part` and `asset` | |
| 1 | `asset` | The bare `as` of an asset placed by an `asset` statement (§7.21.2, §7.26.5) | literal string | | |
| 2 | `follow` | The role of the bone it follows: any role of `vrm1_humanoid` | literal string | yes | |
| 3 | `from` | Seconds into the phase when it starts to follow; `0 ≤ from < until` | value: number | yes | |
| 4 | `until` | Seconds into the phase when it stops; at most the phase's length | value: number | yes | |
| 5 | `at` | Offset of the prop's origin from the bone's, metres, in the figure's axes turned by the bone's turn (§7.26.5); not with `keep` | value: vec3 | no | `[0, 0, 0]` |
| 6 | `rotation` | Offset rotation, radians about X, Y, Z; not with `keep` | value: vec3 | no | `[0, 0, 0]` |
| 6 | `rotation_deg` | The same in degrees; not with `rotation` or `keep` | value: vec3 | no | |
| 7 | `keep` | The prop keeps its place at `from`: the host works the offset out (§7.26.5) | literal bool | no | `false` |
| 8 | `release` | Where the prop is from `until` until the person leaves (§7.26.5): a place, or `"keep"` for where the bone left it; not used by a `reverse` of the phase | `"keep"` or object | no | none: the prop goes back to its own place |

A **release place**, the object form of `release`:

| # | Key | Definition | Type | Required | Default |
|---|---|---|---|---|---|
| 1 | `at` | The prop's origin, metres, in the place's frame | value: vec3 | yes | |
| 2 | `rotation` | The prop's orientation in that frame, radians about X, Y, Z | value: vec3 | no | `[0, 0, 0]` |
| 2 | `rotation_deg` | The same in degrees; not with `rotation` | value: vec3 | no | |

| 1 | `targets` | Role (one of the six of §7.26.3) → override target | object | yes | |
| 2 | `let` | Local names for this phase override's targets, as a `let` statement's (§7.15.1): name → value, bound in order at each key (§7.26.12) | object | no | none |
| 3 | `doc` | Note | string | no | |

not `start` or `end` and doesn't end in `_left` or `_right`: the reader
makes those names (§7.16.1).

### 6.2 Validation rules

A reader checks all of these when it loads a document, before any build,
and rejects the document with the path of the first failure (§10.3);
except V-45, V-46, V-51, V-52, V-53 and V-58, which are warnings that need a build,
and V-55, a warning of the pair step (§7.26.12).

| V-01 | The file is valid UTF-8 JSON with no duplicate keys, and its top level is an object. |
| V-02 | `format` is `"jig"`; `version` is accepted (§5.4). |
| V-03 | Every key is defined for its object, is a `//` comment, or (top level only) starts with `x-`. |

### 6.3 Enumerations

| Enumeration | Values |
|---|---|
| Parameter `type` | `float`, `int`, `bool`, `color`, `enum` |
| Surface (index in brackets, used in surface data, §7.16) | `plain` (0), `wood` (1), `metal` (2), `rope` (3), `glass` (4), `stone` (5), `brick` (6), `slate` (7), `gravel` (8), `paint` (9), `grass` (10), `leaves` (11) |
| Texture `fit` | `tile`: repeat every `size` metres; `face`: stretch once over each face; `surface`: the solid's own coordinates |
| Texture `align` | `up`: u runs level; `grain`: u follows the grain |
| Texture `origin` | `part`: the part's origin; `solid`: each solid's first point |
| Texture `shuffle` | `none`, `cells`, `units` |
| Repeat `fit` | `stretch`: copies stretch or shrink to close the run, at most `max_stretch`; `gap`: copies keep their length, with equal gaps between them |
| Slice axis | `x`, `y`, `z` |
| Texture `alpha_mode` | `opaque`: alpha is ignored; `mask`: a point is drawn fully where alpha ≥ `alpha_cutoff` and not at all elsewhere; `blend`: alpha blends the face with what is behind it. glTF's `OPAQUE`, `MASK`, `BLEND` |
| Data `type` | `f32`, `f16` (IEEE floats), `i32`, `u32`, `i16`, `u16`, `i8`, `u8` (integers); glTF codes below |
| `mirror` | `x`, `y`, `z` |
| Impact class (§7.19) | `pose`, `physics`, `placement`, `appearance`, `shape`, `structure` |
| Motion type (§7.22.4; Khronos) | `static`: collides, never moves; `dynamic`: moved by the simulation; `kinematic`: moved only by the host, infinite mass to the simulation |
| Collider `shape` | `box`, `sphere`, `capsule`, `cylinder`, `hull` |
| Combine mode (Khronos) | `average`, `minimum`, `maximum`, `multiply`; for two touching materials, the first of these that either gives |
| Drive `mode` (Khronos) | `force`: the drive gives a force; `acceleration`: it gives an acceleration, scaled by the effective mass |
| Reference pose (§7.24.2; Khronos `poseType`) | `t_pose`; `a_pose` only for a character whose arms are a skinned asset's bones |
| Character scheme (§7.24.3) | `vrm1_humanoid` (roles checked); any other non-empty string is passed on |
| Expression scheme (§7.25.4) | `vrm1_expressions` (names checked); any other non-empty string is passed on |
| Animation channel (§7.25.2) | `pose` or `pose_deg`, `move`, `morph` |
| Action phase (§7.26.2) | `enter`, `loop`, `exit` |
| Target role (§7.26.3, §7.26.12) | `hips`, `head`, `leftHand`, `rightHand`, `leftFoot`, `rightFoot` |
| Limb role: a grip's (§7.24.6) and a target's that may have a `pole` (§7.26.3) | `leftHand`, `rightHand`, `leftFoot`, `rightFoot` |
| Mount (§7.23.2) | `floor`, `wall`, `ceiling`, `surface` (on another model's support) |
| Clearance `purpose` (§7.23.1) | `movement`: space a moving part sweeps; `use`: space to use the model; `access`: space to reach or pass it; `maintenance`: space for service and air |
| Clearance `level` | `required`, `recommended` |
| Light `type` (`KHR_lights_punctual`) | `point`, `spot`, `directional` |
| Chain loft end (§7.16.1) | `cap`: closed flat; `open`: left open; `point`: closed to a point on the curve; a bridge object `{"bridge": id, "end": "start" or "end"}`: joined to another chain loft's open end |
| Path command (§7.16.1) | `M`, `L`, `Q`, `C`, `Z` (absolute; y up) |
| Open-curve `tips` (§7.16.1) | `flat`, `round` |
| Reserved words | `true`, `false`, `for`, `in` |

| Built-in names | `width`, `height`, `depth`, `seed`, `lod`, `PI`, `TAU`, `path_length`, `wall` |

Data types and glTF `componentType` (informative; §7.7):

| `type` | `i8` | `u8` | `i16` | `u16` | `u32` | `f32` | `f16` | `i32` |
|---|---|---|---|---|---|---|---|---|
| glTF `componentType` | 5120 | 5121 | 5122 | 5123 | 5125 | 5126 | none | none |

*Differs from glTF:* `f16` and `i32` have no glTF 2.0 core code; a data
block of either type can't be written as a glTF accessor.

## 7. Evaluation and transformation

### 7.1 Reading order

1. **Load.** Read the document and, depth first in the order listed, each
   import, data file, image and glTF file, assets and kit materials
   included. Check everything (§6.2).
2. **Constants.** Evaluate data blocks, then `constants`, in the order
   written (§7.12), with the build's `seed`.
3. **Settle** the inputs (§8.1): the host's values, parameters not given
   at their defaults, clamped; then presets (§7.11); then the size, clamped
   to its limits (§7.8).
4. **Derive.** Evaluate `derived` in the order written (§7.18).
5. **Build.** Run `build` top to bottom with the settled values. The build
   starts in the root part (§7.15.7) with no transform, surface `plain`,
   grain `[0,0,0]` and crease angle 40° (2π/9).
6. **Characters, clips and actions.** After the build, collect the roles
   (§7.24), sample every clip (§7.25.3), in the order of `clips` and then
   of the clips of the action phases (§7.26.6), and sample the actions
   (§7.26.8).

Within the build, a reader evaluates:

- statements in order; `let` bindings in the order written;
- a `for`'s `in` once, before the first pass;
- a primitive's arguments in the order of §6.1.14, whatever the order in
  the JSON, then its options (`surface`, `smooth`, `roughness`,
  `metallic`, `emissive`, `emissive_strength`);
- a `use`'s arguments in the order of the component's `args`, then its
  `as` template;
- a `part`'s id template, then `pivot`, then `pose`, then `role` (its
  `animate` channels wait until the clips are sampled, §7.25.3);
- an `asset`'s and a `repeat`'s keys in the order of §6.1.17 and §6.1.18,
  a `repeat`'s `index`, `materials` and `morph` once per copy, in copy
  order;
- a `socket`'s `at`, then `normal`, then `up`;
- a `transform`'s operations in order;
- expressions left to right (§7.2.2).

The order matters only for which error is reported first: piece seeds
(§7.2.5) are keyed by where a statement is, not by when it runs.

### 7.2 Expressions

Wherever a document expects a value, it may give:

- a JSON **number** or **boolean**, taken literally;
- a JSON **array**, a list whose elements are again values, e.g.
  `[0, "height / 2", 0]`;
- a JSON **string**, which is an **expression** in the language below.

So `"color": "#a87446"` is an expression (a colour literal), and a text
value inside an expression is written in single quotes: `'lantern'`.

The language is GLSL's expression syntax (DEP-06): its operators,
precedence, swizzles, constructors and built-in function names, with the
same meaning. JIG adds lists, comprehensions, strings, colours and texture
values, and leaves out GLSL's declarations, statements, assignment and
separate integer types. §7.2.6 lists every deliberate difference.

#### 7.2.1 Types

| type | literals and constructors |
|---|---|
| number | `1`, `0.5`, `.5`, `1.`, `1e-6`, `2.5E+3`; all numbers are 64-bit floats and always finite |
| bool | `true`, `false` |
| string | `'text'` (no escapes; can't contain `'`) |
| vec2 / vec3 | `vec2(x, y)`, `vec3(x, y, z)`, and the other constructor forms below |
| colour | `#rgb`, `#rrggbb`, `#rrggbbaa`, `rgb(r, g, b)` (0–1), `hsv(h, s, v)`; four channels r, g, b, a, holding sRGB values |
| texture | `texture('name')`, `texture('name', tint)`: a declared texture (§7.6) and a tint colour, white by default. The name must be a quoted string |
| list | `[a, b, c]`, `[expr for name in list]` |

**Number literals** are decimal, with an optional exponent. A literal
followed directly by a letter, digit or `_` that isn't part of it is an
error, so GLSL's suffixes and hex literals (`1.0f`, `1.0lf`, `2u`,
`0x1F`) are rejected.

**Constructors**, as in GLSL: `vec2(…)` and `vec3(…)` take numbers and
vectors whose components, in order, fill the new vector; the total must
be exactly 2 or 3. A single number fills every component.

```text
vec3(0.5)            → (0.5, 0.5, 0.5)
vec3(p.xz, 0)        → (p.x, p.z, 0)
vec3(1, v2)          → (1, v2.x, v2.y)
vec2(v3)             → error: 3 components for a vec2 (write v3.xy)
```

`vec4` and the matrix types `mat2`, `mat3`, `mat4` are reserved names
(§7.2.3) and not types in 0.9.

**Lists are not vectors.** A list of numbers becomes a vector only when it
is passed to a primitive or built-in function that expects one. For vector
arithmetic, build the vector with `vec3()`.

Hex colours give each channel as its two hex digits / 255 (`#rgb` doubles
each digit); alpha is 1 unless given.

#### 7.2.2 Operators

Lowest precedence first. The levels and their order are GLSL's (GLSL 4.60
§5.1), restricted to the operators JIG has:

| level | operator | meaning |
|---|---|---|
| 1 | `c ? a : b` | choose; `c` must be a bool, only the chosen side is evaluated, both are checked (§6.2 V-13); right-associative |
| 2 | `\|\|` | logical or, bools, short-circuit |
| 3 | `&&` | logical and, bools, short-circuit |
| 4 | `==` `!=` | equality; not chainable (`a == b == c` is an error) |
| 5 | `<` `<=` `>` `>=` | relational, numbers only; not chainable (`a < b < c` is an error) |
| 6 | `+` `-` | left-associative |
| 7 | `*` `/` | left-associative |
| 8 | `-x` `!x` | prefix: negation of a number or vector; logical not of a bool |
| 9 | `f(…)`, `v.xy`, `list[i]` | call, field or swizzle, index |

So `!a == b` is `(!a) == b`, and `a < b == c < d` compares two bools.

What each arithmetic operator accepts:

| operands | `+` `-` | `*` | `/` |
|---|---|---|---|
| number, number | yes | yes | yes |
| vector, vector of the same size | component-wise | component-wise | component-wise |
| vector, number | each component | each component | each component |
| number, vector | each component | each component | each component |
| colour, colour | all four channels | all four channels | all four channels |
| colour, number | | yes, all four channels | yes, all four channels |
| number, colour | | yes | |
| string, string | `+` joins | | |
| list, list | `+` joins | | |

A number with a vector is applied to each component, as in GLSL:
`v + 1` is `vec3(v.x + 1, v.y + 1, v.z + 1)` and `1 / v` is
`vec3(1 / v.x, 1 / v.y, 1 / v.z)`. Anything else, and any arithmetic on
a texture, is an error. There is no `%`; use `mod` (§7.2.4).

`==` and `!=` compare any two values and give one bool: different types
are never equal, numbers compare exactly, vectors are equal when every
component is, lists element by element, colours channel by channel, and
two textures are equal when they name the same texture and have equal
tints. `<` `<=` `>` `>=` compare numbers only.

**Fields and swizzles.** A vector takes 1 to 3 of the letters `x y z`
(only `x y` on a vec2), a colour 1 to 4 of `r g b a`, in any order and
repeated if wanted. One letter gives a number, two a vec2, three a vec3,
and four (`rgba` letters only) a colour: `p.xz`, `v.zyx`, `c.rgb`,
`c.bgra`. Letters from the other set, from both sets at once, or past the
vector's size are errors. A colour also has the single fields `.h .s .v`
(Appendix G.2). Swizzles only read; values are immutable.

Indexes are whole numbers, and a negative index counts from the end.

**Run-time errors.** Division by zero (a number, or any component of a
vector), a result that isn't a finite number (in any component or
channel, from any operator or built-in), a missing name, a wrong type, a
bad swizzle and an index out of range are all errors. Expressions never
silently produce a wrong value.

#### 7.2.3 Names

An expression can read:

- `width`, `height`, `depth`: the current size;
- `seed`: the variation seed (a number) the host builds with;
- `lod`: the level of detail the host builds, 0 to 2 (§7.9);
- `wall`: the thickness of the wall the model is mounted on, in a model
  that declares `wall` (§7.23.3);
- `PI`, `TAU`;
- `path_length`, in path models (§7.5);
- every constant, data block, parameter and derived value (§7.18), and
  `alias.NAME` for imported constants;
- in a `repeat`, its `copy` name (§7.21.4);
- in the values of an `animate` channel, of an action's targets and
  bone channels, and of a character's override targets, `t`, the time in
  seconds, and `u`, `t` / `length` (§7.25.2, §7.26, §7.26.12);
- in a `chain_loft`'s `weights`, `t`, `angle`, `point`, `joint_t` and
  `blend_weights` (§7.16.1);
- local names: `let` bindings, `for` variables, component and function
  arguments, list-comprehension variables.

The **reserved words** `true`, `false`, `for` and `in`, and the
**reserved names** (every built-in function name of §7.2.4, `vec4`,
`mat2`, `mat3`, `mat4`, and `path`), can't be used as any name a document defines:
not for a parameter, constant, data block, derived value, import alias,
texture, asset, socket, function, component, argument, `let`, or `for` or comprehension
variable. So `{"let": {"step": 0.5}}` is an error. Built-in function
names are reserved for values too, although function and value names are
otherwise separate, so that no name means a value and a built-in in one
expression. `path` is reserved because a conformance case gives the
host's path under that key (§8.3). A **global name** (a
parameter, constant, data block, derived value, import alias or built-in name) is
unique: no two globals share a name. A **local name** can't reuse a
global name; it can shadow a local name of an outer block. Function and
component names are separate from value names.

#### 7.2.4 Built-in functions

The functions marked GLSL have GLSL's name and definition (GLSL 4.60
chapter 8), evaluated in binary64; §7.2.6 lists where JIG pins down what
GLSL leaves undefined. The others are JIG's own.

| group | functions |
|---|---|
| component-wise (GLSL) | `abs sign floor ceil trunc fract round`, `mod(x, y)`, `min max`, `clamp(x, lo, hi)`, `mix(x, y, a)`, `step(edge, x)`, `smoothstep(e0, e1, x)`, `sqrt inversesqrt pow(x, y) exp exp2 log log2`, `sin cos tan asin acos`, `atan(x)`, `atan(y, x)`, `radians degrees` |
| component-wise (JIG) | `saturate(x)` = `clamp(x, 0, 1)` |
| geometric (GLSL) | `length(x) distance(a, b) dot(a, b) cross(a, b) normalize(x) reflect(i, n)` |
| vectors (JIG) | `vec2 vec3` (§7.2.1), `rotate(v, axis, angle)`, `rotate_deg(v, axis, degrees)`, `limit_length(v, max)`: shortens `v` to at most `max` |
| lists | `len(list or string)`, `range(n)`, `range(a, b)`, `range(a, b, step)`; `steps(a, b, step)`; `flatten(list)`; `reverse(list)` |
| text | `str(x)` |
| colour | `rgb hsv`, `darken(c, f)`, `lighten(c, f)`, `vary(color, amount, key)` |
| texture | `texture(name, tint = #ffffff)`, `tint(t)`, `with_tint(t, c)` |
| sockets | `socket(id)`, `socket_dir(id)`, in the build (§7.21.3) |
| random | `random(key)`, `random_range(a, b, key)` (§7.2.5) |
| geometry | `rect_ring(center, u, v, half_u, half_v, chamfer = 0)`, `circle_ring(center, radius, sides, axis = [0,1,0], reference = [0,0,0])`, `superellipse_ring(rx, ry, exponent, n)`, `bezier(p0, control, p1, segments)` (vec2 or vec3), `centroid(points)`, `rect_profile(z, half_width, y0, y1)` |
| path | `path_distances(step)`, `path_point(d)`, `path_forward(d)`, in path models (§7.5) |
| actions | `model_at(role)`, `model_weight(role)`, only in a character's override targets (§7.26.12, V-54) |

**Component-wise functions** take numbers and vectors. When any argument
is a vector, the result is a vector of that size, worked out one
component at a time; every vector argument must have that size, and a
number argument is used for every component. So `clamp(v, 0, 1)`,
`mix(a, b, 0.25)`, `step(0.5, v)` and `mod(v, 2)` work as in GLSL.

| function | value, per component (GLSL definitions) |
|---|---|
| `abs(x)`, `sign(x)` | \|x\|; −1, 0 or 1 |
| `floor(x)`, `ceil(x)`, `trunc(x)` | nearest whole number ≤ x, ≥ x, towards 0 |
| `fract(x)` | x − floor(x) |
| `round(x)` | nearest whole number, halves away from zero (§7.2.6) |
| `mod(x, y)` | x − y · floor(x / y), so `mod(-1, 3) == 2`; y = 0 is an error |
| `min(a, b, …)`, `max(a, b, …)` | smallest, largest; also of one list of numbers |
| `clamp(x, lo, hi)` | min(max(x, lo), hi) |
| `mix(x, y, a)` | x · (1 − a) + y · a; also on two colours with a number `a`, all four channels |
| `step(edge, x)` | 0 if x < edge, else 1 |
| `smoothstep(e0, e1, x)` | t = clamp((x − e0) / (e1 − e0), 0, 1), result t²(3 − 2t); when e0 = e1, 0 for x < e0, else 1 |
| `sqrt(x)`, `inversesqrt(x)` | √x, 1 / √x; x < 0 (for `inversesqrt`, x ≤ 0) is an error |
| `pow(x, y)` | xʸ as IEEE 754 `pow`; a non-finite result is an error |
| `exp(x)`, `exp2(x)` | eˣ, 2ˣ |
| `log(x)`, `log2(x)` | natural and base-2 logarithm; x ≤ 0 is an error |
| `sin cos tan` | of x in radians |
| `asin(x)`, `acos(x)` | input clamped to [−1, 1] |
| `atan(x)` | arctangent, in (−π/2, π/2) |
| `atan(y, x)` | angle of the point (x, y), in [−π, π], as IEEE 754 `atan2`; `atan(0, 0)` is 0 |
| `radians(d)`, `degrees(r)` | d · π / 180, r · 180 / π |

Details:

- `length(x)` is the Euclidean length of a vector, |x| of a number;
  `distance(a, b)` = `length(a − b)`; `dot(a, b)` = Σ aᵢbᵢ (a · b for
  numbers); `cross` takes two vec3s; `normalize(x)` = x / length(x), and
  a zero length is an error; `reflect(i, n)` = i − 2 · dot(n, i) · n.
  Vector arguments of one call have one size.
- `rotate(v, axis, angle)` turns vec3 `v` right-handed about `axis` by
  `angle` radians (Appendix G.4); an axis with every component under
  1e-5 in size is an error. `rotate_deg(v, axis, degrees)` is the same
  with the angle in degrees: `rotate(v, axis, radians(degrees))`.
- `range(a, b, step)` gives `a + i × step` for i = 0, 1, … , count − 1
  with count = max(0, ceil((b − a) / step)); a negative step counts down;
  a zero step is an error. `range(n)` is `range(0, n, 1)`, `range(a, b)`
  is `range(a, b, 1)`.
- `steps(a, b, step)`: a running total `a, a + step, (a + step) + step, …`
  while below `b`, the values a `while x < b: x += step` loop visits;
  `step` must be positive.
- `flatten(list)` joins the lists inside a list one level deep; other
  elements stay. `reverse(list)` reverses a list.
- `len` counts list elements or a string's Unicode code points.
- `str(x)` takes a number, bool, string, vector, colour or texture.
  Numbers print as in Appendix G.1; bools as `true` / `false`; vectors as
  `(x, y)` / `(x, y, z)`; colours as `#rrggbb` (lower-case hex, Appendix
  G.2), or `#rrggbbaa` when alpha < 1; textures as
  `texture('name', #tint)`.
- `rgb(r, g, b)` makes a colour with alpha 1; channels are not clamped.
  `hsv(h, s, v)`: h is 0–1 and wraps (floored modulo 1); alpha 1
  (Appendix G.2).
- Colour functions work on the sRGB values directly (no conversion to
  linear light). `darken(c, f)`: r, g, b × (1 − f). `lighten(c, f)`: each
  of r, g, b moved f of the way to 1. Both keep alpha. `vary` shifts
  value, saturation and hue a little (formulas in Appendix G.2).
- `darken`, `lighten` and `vary` also take a texture and change its tint, so colour code keeps working when a colour becomes a texture.
  `tint(t)` gives the tint as a colour; `with_tint(t, c)` the same texture
  with tint `c`.
- `rect_ring`, `circle_ring`, `superellipse_ring`, `bezier`, `centroid`
  and `rect_profile` are defined in Appendix G.5. `circle_ring` sides and
  `superellipse_ring`'s `n` are rounded half away from zero and clamped
  to 3–256; `bezier` segments are rounded and clamped to 1–256.
- `superellipse_ring(rx, ry, exponent, n)` gives n vec2 points of
  |x/rx|^e + |y/ry|^e = 1, starting on +x and running counter-clockwise
  (from +x towards +y), for a `chain_loft` section (§7.16.1). Exponent 2
  is an ellipse (a circle when `rx` = `ry`), larger a rounded rectangle,
  between 1 and 2 a rounded diamond. An exponent ≤ 0 is an error.

#### 7.2.5 Random values

Random values come from a **keyed hash** of the host's `seed`: a value is
a function of the seed and a key, not of how many values came before.

| call | value |
|---|---|
| `random(key)` | a number in [0, 1): u(seed, key, 0) |
| `random_range(a, b, key)` | a + (b − a) · u(seed, key, 0) |
| `vary(color, amount, key)` | a shade shift using u(seed, key, 1), u(seed, key, 2) and u(seed, key, 3) (Appendix G.2) |

u(seed, key, k) is defined in Appendix G.3: integer hashing of the seed,
the key and the draw number k, scaled to [0, 1) with 24 bits. A **key** is
a number, a string, or a list of keys, compared by type and value:
`random(3)`, `random('3')` and `random([3])` differ. A key of any other
type (vector, bool, colour, texture) is an error: readers may hold vectors
in less precision (R-02), and a key must hash the same in every reader.
Key a piece by its loop counters and names (`['tile', i, j]`), not by its
coordinates.

The same seed and key always give the same value, wherever and however
often it is used, in any reader. So a key made of loop variables gives
each piece its own value, and leaving pieces out at a lower `lod` doesn't
change the others:

```json
{"for": "i", "in": "range(count)", "do": [
  {"box": {"center": ["x0 + i * pitch", 0.02, 0], "size": [0.1, 0.04, "depth"],
           "color": "vary(plank_color, 0.5, ['plank', i])"}}
]}
```

The key is required. Random calls are pure, so they are allowed in
constants, derived values, functions, components and the build; not in
size limits, which don't depend on the seed (§7.8).
Imported code uses the importing model's `seed`.

**Piece seed.** Every solid also gets a piece seed, used for
`random_offset` (§7.6) and handed to renderers in the surface data
(§7.16). It is p(seed, k) (Appendix G.3), with k a **piece key** that
names the primitive statement where it runs: the document it is in, its
place in that document, the enclosing `use`s and the values of the
enclosing `for`s. So a piece that comes or goes with a parameter or the
level of detail never changes another piece's seed, and a piece keeps its
seed when unrelated parameters change. (Editing the document moves
statements, and so changes the seeds of those after an edit in the same
list.)

#### 7.2.6 Differences from GLSL

JIG differs from GLSL 4.60 deliberately in these places; everything else
in §7.2 means what GLSL says.

| Differs from GLSL | JIG | GLSL |
|---|---|---|
| Number types | One type: IEEE 754 binary64, always finite. No `int`, `uint`, `float`, `double`, no integer division, no literal suffixes or hex literals | Several scalar types |
| Precision | binary64 throughout, with the exact algorithms of Appendix G | `float` is 32-bit with loosely specified precision |
| `round` | Halves away from zero | Halves implementation-defined (`roundEven` rounds them to even; not in JIG) |
| Undefined cases | Defined: `asin`/`acos` clamp their input; `atan(0, 0)` is 0; `smoothstep` with e0 = e1; `pow` as IEEE 754. Errors: `sqrt`, `inversesqrt`, `log`, `log2` out of range, `mod` or division by zero, any non-finite result | Undefined results |
| Number arguments | A number may stand for a vector in any argument of a component-wise function | Only in the overloads GLSL lists (e.g. `mix(v, v, float)`) |
| `min`, `max` | Also take more than two arguments, or one list | Two arguments |
| `mix` | Also blends two colours | Numbers and vectors |
| Swizzles | `xyzw` letters on vectors, `rgba` on colours only; no `stpq`; on a colour, `.s` is HSV saturation; at most 3 components for a vector, since there is no `vec4` | Every set on every vector type |
| Constructors | Exact component count; `vec2(v3)` is an error (write `v3.xy`) | A single larger vector is truncated |
| Types | No `vec4`, matrices, `bool` vectors or structs; added: colours, strings, textures, lists and comprehensions, negative list indexes, `len` | Vectors, matrices, arrays, structs |
| Comparison | `==` and `!=` give `false` for values of different types; neither they nor `<` … chain | Operands must match; `a == b == c` parses |
| `texture` | `texture('name', tint)` names a declared texture (§7.6) and gives a texture value | `texture(sampler, uv)` samples an image |
| `rotate`, `rotate_deg` | JIG's own functions, in radians and in degrees | No such built-ins |
| Left out | `%`, bitwise operators, `^^`, `++` `--`, assignment, the comma operator, unary `+`, declarations, statements | Present |

### 7.3 Defaults and omitted keys

An omitted optional key takes the default listed in §6.1. In particular:

| Where | Omitted key means |
|---|---|
| `size` | min 0.01, max 100, default 1 on every axis |
| texture | `fit` `tile`, `align` `up`, `origin` `part`, `offset` `[0, 0]`, `random_offset` false, `shuffle` none, `normal_scale` 1, `alpha_mode` opaque, `alpha_cutoff` 0.5 |
| data block | `offset` 0, `normalized` false, elements packed (no `stride`); with `gltf`, `shape` from the accessor |
| parameter | no `min` / `max`: unbounded; no `unit`: none |
| `if` | missing `then` or `else`: an empty block |
| `part` | `pivot` and `pose` `[0, 0, 0]` |
| `use` | no `as`: no prefix; no `with`: `{}`, so every argument takes its default (§7.14) |
| component argument | its `defaults` entry, evaluated when the `use` leaves it out; none: the `use` must give it |
| `rotate` | `origin` `[0, 0, 0]` |
| action target / attach event | `weight` 1; no `rotation`: the orientation in the figure's T-pose (§7.24.2); an attach event's offset `at` `[0, 0, 0]` and rotation 0 (§7.26) |
| primitive | arguments as in §6.1.14; options from the enclosing block |

`null` is never a default and never a value (§5.1).

### 7.4 Imports and libraries

```json
"imports": {"rail": "rail_parts.jig.json"}
```

Each entry loads another JIG document and gives it an alias. Its
constants, functions and components become available as `alias.NAME`,
e.g. `rail.GAUGE`, `rail.paint(c)` and `{"use": "rail.wheelset", …}`. Its
textures are available as `alias.name` (§7.6). Paths follow §9.2 and are
resolved from the importing document's folder.

Any document can be imported. A **library** is simply a document with
only constants, functions and components and no `build`. Imported code
runs with its own document's names: it sees its own constants, data and
other definitions, and its own parameters and size **at their defaults**,
never the importing model's, so pass anything it needs as arguments. Its derived
values are evaluated with those defaults too (§7.18). It shares the
importing model's `seed` (§7.2.5), current transform, part, surface,
grain and crease angle, and its `lod`.

A document with a `path` can be imported only by a document with a
`path`; its path tools and `path_length` then use the importing model's
path.

An alias must be an identifier, and it can't clash with any other global
name. Import cycles are an error, and imports nest at most 8 deep (§11).

### 7.5 Path-following models

```json
"path": {"doc": "Follows the host's path. Without one it runs straight along X, width metres long."}
```

A model with a `path` is laid along a curve the **host** supplies, such as
track, roads, kerbs, fences or rope. The curve is an input like the
parameters, not part of the document. A host without a curve, a model
placed without one, or a curve with fewer than two points or shorter than
0.01 m, uses the default: a straight line along +X, `width` long, centred
on the origin.

Positions along the path are **distances** in metres, from 0 to
`path_length`, measured along the curve. At every distance the path
defines a **frame**:

- the origin is on the curve;
- **+X** is forward, along the curve;
- **+Y** is up: the frame stays level, tilting only with the slope and
  never banking;
- **+Z** is to the left of the direction of travel.

Model coordinates inside a frame use these axes, so a cross-section in
(z, y) is the same shape everywhere along the path. Hosts give curves as
cubic Bézier splines: points with in and out handles relative to the
point, in model space. Appendix G.11 says exactly how a reader measures
and samples them.

Path tools (allowed only in documents with a `path`):

| tool | meaning |
|---|---|
| `path_length` | name: the length of the path |
| `path_distances(step)` | distances from 0 to the end, evenly spaced and at most `step` apart: count = max(1, ceil(length / step)) intervals, so count + 1 distances; just `[0, length]` for the straight default. `step` must be positive |
| `path_point(d)`, `path_forward(d)` | the frame's origin and +X direction at distance `d` (Appendix G.11) |
| `{"along_path": d}` | transform op (§7.15.6): work in the frame at distance `d` |
| `sweep_profile` | primitive (§7.16): sweep a cross-section along the whole path |

Example: sleepers at an even pitch and two rails.

```json
{"let": {"count": "max(2, ceil(path_length / 0.9))"}},
{"for": "i", "in": "range(count)", "do": [
  {"transform": [{"along_path": "path_length / count * (i + 0.5)"}], "do": [
    {"box": {"center": [0, 0.27, 0], "size": [0.25, 0.12, 2.6], "color": "#4a3a2c"}}
  ]}
]},
{"for": "side", "in": [-1, 1], "do": [
  {"sweep_profile": {"profile": "rect_profile(side * 0.7175, 0.034, 0.406, 0.45)", "color": "#4f4b47"}}
]}
```

### 7.6 Textures

```json
"textures": {
  "brick":  {"image": "textures/brick.jpg",  "size": [0.9, 0.6]},
  "planks": {"image": "textures/planks.jpg", "size": [2.0, 0.4], "align": "grain", "random_offset": true},
  "dial":   {"image": "textures/clock_dial.png", "fit": "face"}
}
```

`textures` names the images a document paints with; §6.1.5 lists the
keys. Anywhere a colour goes, a document can give a **texture value**
instead (§7.2.1): `"color": "texture('brick', wall_color)"`. The face then
shows the image multiplied, channel by channel in linear light, by the
**tint** colour (here `wall_color`). This is the rule glTF uses for
`baseColorTexture` and `COLOR_0`, so a baked model looks the same (§9.1).

Texture names are identifiers. Imported textures are named `alias.name`.
A reader must find and decode every image when it loads the document.
A texture may also be a material from a glTF file, a **kit material**
(§7.21.8).

**Images.** Paint an image meant to be tinted near white, so the tint
supplies its colour: bricks at 80–100% grey, the mortar darker. A
full-colour image (a sign, a poster) uses the default tint, white. A tiled
image must repeat seamlessly.

**Where the image goes.** Each face is projected onto its own plane, in
part space (§7.15.7), in metres. A reader works out two axes on the face,
u and v, from its outward normal n:

1. With `align: "grain"`, u is the face's grain direction (§7.15.5)
   projected onto the face, as long as that projection is longer than 0.3
   (the grain is unit length).
2. Otherwise, and for `align: "up"`, u is normalize(up × n): a level line
   along the face, so brick courses stay level and slates run along a roof,
   whichever way it faces. Up is the model's +Y, in part space.
3. On a level face (|n · up| ≥ 0.98), u is the model's +X (in part space)
   projected onto the face, reversed on a face that looks down.

Then v = n × u. Seen from outside, u points right and v points up, so an
image is never mirrored, even under a `mirror` transform. For a vertex at
position p (part space), with s the solid's piece seed (§7.2.5), the
texture coordinates are:

```text
tile:  u' = (p·u + offset.u) / size.u + (random_offset ? 7.31 s : 0)
       v' = (p·v + offset.v) / size.v + (random_offset ? 3.17 s : 0)
face:  u' = (p·u − min u) / (max u − min u),  v' likewise over the face
```

with (u', v') = (0, 0) at the image's bottom-left corner. Appendix G.10
gives how they are stored: in glTF's convention, with (0, 0) at the
image's top-left corner and v running down, so a bake writes them
unchanged (§9.1). The stored coordinates of `tile` equal metre
coordinates under a `KHR_texture_transform` with scale
(1/size.u, 1/size.v); a baker writes the stored coordinates and needs no
extension. Every solid in a part shares the same origin,
so courses line up across separate boxes. A **face**, for `fit: "face"`,
is one primitive face: one side of a `box` or loft, one facet of a lathe
or cylinder, one `polygon`, one triangle of a `mesh`, or one whole cap of
a loft, cylinder or `extrude`. The image is stretched to the face's
bounds, so make it in the face's proportions (a square dial, a 4:1 name
board).

A tiled image breaks at each facet of a round solid and can jump at a
vertical corner (courses still line up). Images that look like noise, such
as wood grain, hide this. The jump grows with the distance from the
origin, so `"origin": "solid"` measures p from each solid's own first
point (the first vertex it emits, Appendix G.5) instead of the part's
origin. A loose solid then shows the same part of the image wherever it is
placed.

**Surface coordinates.** With `fit: "surface"`, a solid that knows its own
layout gives each vertex coordinates (u, v) along its surface, and the
image is laid over the solid as a whole, with no breaks between facets:

| primitive | u (round) | v (along) |
|---|---|---|
| `loft` (and `box`, `cylinder_between`, `sweep`, `sweep_profile`) | distance round each ring from its first point, closing back to it | distance from ring to ring, between ring centroids |
| `lathe`, `cylinder` | angle round, from `phase` (0 for `cylinder`) | distance along the profile |
| `ellipsoid` | as its sphere's; with `size`, the distance round its ring from the ring's first point, measured on the ellipsoid | as its sphere's; with `size`, the distance along its meridian from the bottom pole, measured on the ellipsoid |
| `torus` | as a lathe: angle round the ring | distance round the tube from its inner equator, as a lathe's profile |
| `chain_loft` (§7.16.1) | as a loft: distance round each ring from its point 0, closing back to it | t, the distance along the curve (G.22); a bridge strip keeps its rings' v, and u made continuous along its walk (G.22) |
| `extrude` (walls) | distance along the outline from its first point | height |
| `mesh` | its `uvs`: u, and 1 − v (they are given in glTF's convention, §7.16) | |

Without `size`, u and v are fractions, 0 to 1, of the whole length (for a
loft, u is a fraction of each ring's own perimeter): the image is
stretched once over the solid, for maps baked to fit it. With `size`, they
are metres, tiled and offset like `tile` (round a lathe, u is measured at
each point's radius). Faces with no such layout, such as caps, a `polygon`
or a `mesh` without `uvs`, are fitted like `face`. In a loft, keep the
rings' first points lined up, so the seam (u = 0 and 1) runs straight
along the solid.

**Maps.** A texture may carry maps that use the same coordinates as its
image. It may also have maps and no image: a shape detail over a plain
colour. Each map means what the glTF material slot of the same kind
means:

- `normal`: a tangent-space normal map, glTF's `normalTexture`: red is
  +X (right in the image), green is +Y (up the image), blue points out
  of the face (the OpenGL convention). The tangent frame is MikkTSpace,
  computed from the stored texture coordinates and the smoothed normals
  (§7.17), as glTF viewers compute it, so a bake looks the same. A
  reader stores no tangents in its output. `normal_scale` s scales the
  map as glTF does: the normal is normalize((2·rgb − 1) × (s, s, 1)).
- `roughness`: roughness from the image's green channel.
- `metallic`: metalness from its blue channel.
- `metallic_roughness`: one image with roughness in green and metalness
  in blue, glTF's `metallicRoughnessTexture`; in place of `roughness` and
  `metallic`.
- `occlusion`: ambient occlusion from the red channel, glTF's
  `occlusionTexture`: 0 is fully occluded, 1 not at all. It darkens only
  indirect light. It may be the same file as `metallic_roughness` (an
  "ORM" image).

The roughness and metalness maps replace the surface's own roughness and
metalness, and a primitive's `roughness` and `metallic` (§7.17) scale
them. A texture with maps can't `shuffle`.

**Alpha.** The face's alpha is the image's alpha (1 without an image or
without an alpha channel) times the tint's alpha. `alpha_mode` says what
it does, as glTF's `alphaMode` (§6.3): `opaque` (the default) ignores
it, `mask` draws a point only where alpha ≥ `alpha_cutoff`, `blend`
blends. A colour without a texture is always opaque; give a texture to
use alpha.

*Differs from glTF:* JIG keys and values are lower-case `snake_case`
(`alpha_mode: "mask"` for `alphaMode: "MASK"`), and a texture's maps and
alpha settings travel together with its image instead of in a separate
material.

**Hiding the repeat.** A tiled image should cover several metres and have
no standout features: repetition is easiest to see in a small image with
one memorable detail. `shuffle` (only with `fit: "tile"`) lets a renderer go
further. It changes only which part of the image a point shows, never the
texture coordinates, and a renderer that can't vary an image, or a glTF
bake, repeats it plainly:

- `"cells"`: the image has no regular layout (gravel, grass, render, rough
  stone, plain wood grain). A renderer may sample it at random offsets
  that change from place to place and blend between them. Never use it on
  an image whose rows or joints must line up: bricks, slates, tiles, or
  boards with visible joints between them.
- `"units"`: the image is made of units laid in courses (bricks, slates,
  tiles, setts) and `layout` (required, and allowed only here) says where
  they are. A renderer may draw each unit on the face from a randomly
  chosen unit of the same width in the same kind of course of the image,
  so the bond stays exact and no run of units repeats.

```json
"brick_flemish": {"image": "textures/brick_flemish.jpg", "size": [1.35, 1.2], "shuffle": "units",
  "layout": {"unit": [0.225, 0.075], "courses": [{"units": [1, 0.5]}, {"units": [1, 0.5], "shift": 0.75}]}}
```

`unit` is one unit with its joints, in metres along u and v. `courses`
lists 1 to 8 courses, bottom to top, repeating up the face. Each course
repeats its `units`, 1 to 8 widths in units, from `shift` units along u.
The image is painted in the same layout, with course 0 at its foot, and
must hold a whole number (at least 1) of every course's repeats across and
of the whole list of courses up: `size.u / (sum of units × unit.u)` and
`size.v / (courses × unit.v)` must each round to at least 1 and be within
1e-4 of a whole number. The usual bonds, with a brick of 0.225 × 0.075 m
(215 × 65 mm and a 10 mm joint) and a header of half a unit:

| bond | courses |
|---|---|
| stretcher | `[{"units": [1]}, {"units": [1], "shift": 0.5}]` |
| stack | `[{"units": [1]}]` |
| third (raking) | `[{"units": [1]}, {"units": [1], "shift": 0.333}, {"units": [1], "shift": 0.667}]` |
| English | `[{"units": [1]}, {"units": [0.5], "shift": 0.25}]` |
| Flemish | `[{"units": [1, 0.5]}, {"units": [1, 0.5], "shift": 0.75}]` |
| English garden wall | `[{"units": [1]}, {"units": [1], "shift": 0.5}, {"units": [1]}, {"units": [0.5], "shift": 0.25}]` |
| header | `[{"units": [0.5]}, {"units": [0.5], "shift": 0.25}]` |

Slates and tiles are a stretcher bond of their own size, e.g.
`{"unit": [0.3, 0.25], "courses": [{"units": [1]}, {"units": [1], "shift": 0.5}]}`.
Layouts that aren't made of courses, such as herringbone and basket
weave, can't be described; paint them as plain tiled images.

**Surfaces and levels of detail.** `surface` (§7.15.4) still says what the
face is made of: a renderer keeps its roughness and metalness and
uses the image in place of its procedural pattern. A part keeps its
textures at every level of detail (§7.9), as it keeps its colours.

### 7.7 Data

```json
"data": {
  "HEAD": {"file": "bull_head.data.bin", "type": "f16", "shape": [94, 64, 3]},
  "TETRA": {"base64": "AAAAAAAAAAAAAAAAzcxMPg…", "type": "f32", "shape": [4, 3]}
}
```

`data` holds large tables of numbers, such as scanned rings, outside the
JSON text; §6.1.7 lists the keys. Each entry becomes a constant (§7.12): a
list nested to its `shape`, whose innermost axis is one **element**
(below). An element of 2 or 3 numbers is a vec2 or vec3, so `HEAD[r][p]`
is a vec3 and `HEAD[r][p].y` its height; any other element is a number, or
a list of four numbers for a last axis of 4 (there is no `vec4`, §7.2.1).
A shape of `[3]` gives one vec3. Constants may use it like any other.

A data block is a glTF buffer view plus accessor, written in JIG's
terms. Numbers are little-endian, as in glTF, and in row-major order (the
last axis varies fastest), starting `offset` bytes in; `offset` must be
a multiple of the number size, as glTF requires of an accessor. A block
may hold at most 1,000,000 numbers (the product of `shape`), and the
bytes must hold them all; extra bytes are ignored. `f16` keeps about
three significant digits: 0.2 mm on a half-metre sculpture. A block that
decodes to a non-finite number (an `f16` or `f32` infinity or NaN) is an
error.

**As a glTF accessor.** A shape whose last axis has 2, 3 or 4 numbers is
an accessor of `type` `VEC2`, `VEC3` or `VEC4`, whose `count` is the
product of the other axes; any other shape is a `SCALAR` accessor whose
`count` is the product of the whole shape. One **element** is one such
vector, or one number for `SCALAR`. `type` maps to `componentType` as in
§6.3. So `[94, 64, 3]` is `count` 6016, `VEC3`.

**Normalized.** With `normalized: true`, integers stand for fractions
exactly as glTF decodes them (Appendix G.12): `u8` 255 is 1.0, `i16`
−32767 is −1.0. Scanned data can then be stored compactly.

**Stride.** Without `stride`, elements follow each other with no gap.
With `stride`, element i starts at `offset + i × stride`, so interleaved
data can be read where it is. As for glTF's `byteStride`, the stride is a
multiple of 4 and of the number size, 4 to 252, and at least the size of
one element. The bytes must hold `offset + (count − 1) × stride` plus one
element.

**From a glTF file.** `{"gltf": "head.glb", "accessor": 3}` reads
accessor 3 of a glTF 2.0 file, so scanned or tool-made data can live in
standard glTF files:

- the file is GLB when it starts with the GLB magic `glTF`, otherwise
  glTF JSON; its `asset.version` is `2.0`, or a later 2.x whose
  `asset.minVersion`, if given, is at most `2.0`; anything it lists in
  `extensionsRequired` other than `KHR_mesh_quantization` is an error;
- its buffers are the GLB `BIN` chunk, a `data:` URI with base64 bytes,
  or a relative path that follows §9.2, resolved from the glTF file's
  folder and inside the JIG document's folder;
- the accessor's `componentType` gives `type` (5120 `i8`, 5121 `u8`,
  5122 `i16`, 5123 `u16`, 5125 `u32`, 5126 `f32`), its `normalized` and
  its buffer view's `byteStride` apply, and its `type` and `count` give
  the default `shape`: `[count]` for `SCALAR`, `[count, n]` for `VECn`;
  a matrix accessor is an error;
- `shape`, if given, must hold exactly as many numbers, and reshapes
  them: `"shape": [94, 64, 3]` for a `VEC3` accessor of 6016;
- a sparse accessor, or one without a buffer view, is an error.

Nothing else in the glTF file is read. *Differs from glTF:* a data block
is a nested list of numbers and vectors once read; it has no `min` /
`max` and no target.

### 7.8 Size

Every model has three size parameters: `width` (X), `height` (Y) and `depth`
(Z). The model sets the range it is designed for (§6.1.4). A reader always
clamps the size to that range, so a bench can't be stretched into
something that is no longer a bench.

```json
"size": {"min": [1.0, 0.3, 0.2], "max": [8.0, 0.6, 0.6], "default": [3.0, 0.45, 0.32],
         "doc": "width = seat length, height = seat height, depth = seat depth"}
```

The values must satisfy `0 < min ≤ default ≤ max`. A host that lets users
scale a model should scale the size parameters and rebuild, not stretch
the mesh.

**Limits from other inputs.** An entry of `min` or `max` may be an
expression instead of a number, so one axis can follow the others or the
parameters: a tower stays near square, a sculpture keeps its proportions.

```json
"size": {"min": [1.8, 9, "max(1.8, 0.75 * width)"], "max": [4, 26, "min(4, width / 0.75)"],
         "default": [2.4, 14, 2.4]}
```

A limit expression may read parameters (after presets), the other size
axes, constants, data blocks, the document's functions and imported
constants and functions. It can't read its own axis, `seed`, `lod`,
the path or derived values, or call `random`, `random_range` or `vary`,
directly or through the functions it calls. The reader settles the axes in the order
their limits need (an axis whose limits read another comes after it; a
cycle is an error at load, V-06), evaluates each limit and clamps the
axis to it. A limit that isn't a finite number above 0, or a `min` above
its `max`, stops the build at `size.min[i]` or `size.max[i]`. The host
shows the clamped size: it is the input the build uses (§8.1).

### 7.9 Level of detail

Every model also has the built-in parameter `lod`: **0** is full detail,
**1** medium and **2** low. The host chooses the level, for example per
placed object, or by building all three and switching by distance. A
document doesn't declare `lod` in `params`; it reads it like `seed`.
Readers round it half away from zero, like an `int` parameter, and
clamp it to 0–2; the default is 0.

A model honours `lod` so that a host can swap levels without anyone
noticing anything but the detail; §8.2 gives the conventions.

```json
{"let": {"facets": "[12, 8, 5][lod]"}},
{"if": "lod < 2", "then": [ … ladder rungs … ]}
```

### 7.10 Parameters

An ordered list of parameters (§6.1.8). Readers show them in this order.

```json
{"name": "splay", "type": "float", "min": 0, "max": 16, "step": 0.5, "unit": "°", "default": 8,
 "doc": "Leg angle from vertical."}
```

`name` is a global name (§7.2.3). `default` is required and must be valid.
A reader clamps numbers to `min` / `max` and rounds `int` values half away
from zero. `step` is a hint for sliders; readers don't snap values to it.

### 7.11 Presets

A preset maps the options of an `enum` parameter to values for other
parameters.

```json
"presets": {
  "colorway": {
    "pine": {"seat_color": "#d9b27c", "frame_color": "#a8794a"},
    "oak":  {"seat_color": "#a87446", "frame_color": "#5e3d22"}
  }
}
```

When the user picks an option that is listed, the reader sets those params
and **locks** them (shows them read-only). An option that isn't listed,
such as `"custom"` here, leaves the parameters unlocked and keeps their
current values. Preset values are literals, not expressions; numbers are
clamped and rounded like any parameter value. A preset can set any other
parameter, including another `enum`, but not its own `enum` and not the
size. Presets apply in the order the `presets` object lists them; a preset
keyed by an `enum` that an earlier preset set uses the new value.

### 7.12 Constants

Named values, evaluated in the order written (§5.1), once per document and
seed. A constant's value is a value (§7.2), and may use:

- earlier constants, data blocks and imported constants;
- built-in functions, including random values (§7.2.5);
- imported functions.

It can't use parameters, size, derived values, `seed`, `lod`,
`path_length`, path tools, or the document's own functions.

```json
"constants": {"SEAT_THICKNESS": 0.04, "MAX_BAY": 0.75, "PROFILE": [[0, 0], [0.24, 0]]}
```

A constant that calls a random function depends on the seed; a
reader evaluates constants again when the seed changes, or caches them by
seed.

### 7.13 Functions

Expression helpers with arguments (§6.1.10). A function body can read its
arguments and the global names (constants, data, parameters, size, `seed`,
`lod`, derived values (§7.18), and `path_length` in path models). Functions may call each other
and themselves; since `c ? a : b` evaluates only the chosen side,
recursion can stop. Functions and components share one nesting counter:
calls nest at most 64 deep (§11).

```json
"functions": {"paint": {"args": ["base", "i"], "return": "vary(base, 0.4, ['paint', i])"}}
```

A function can't have the name of a built-in function. A call must pass
exactly as many arguments as the function's `args`. A function may have a
`doc`, a note for people, as a parameter may.

### 7.14 Components

Reusable blocks of build statements (§6.1.11), invoked with `use`
(§7.15.8).

```json
"components": {
  "trestle": {"args": ["x"], "do": [ … statements … ]}
}
```

A component body sees its arguments and the global names. It does not see
the caller's local names; pass anything it needs as an argument. A
component **makes parts** if its body, in any branch, contains a `part`
statement or a `use` of a component that makes parts.

**Defaults.** `defaults` gives an argument a value for a `use` that
leaves it out:

```json
"tube": {"args": ["a", "b", "r0", "r1", "col"],
         "defaults": {"r1": "r0", "col": "#808080"},
         "do": [{"cylinder_between": {"from": "a", "to": "b", "radius": "r0", "radius_end": "r1",
                                      "sides": "[14, 10, 6][lod]", "color": "col"}}]}
```

A default is an expression in the component's scope, never the
caller's: it reads the global names of the component's document and the
arguments before it in `args` (here `r1` reads `r0`). It is evaluated
only when the `use` leaves its argument out, at that argument's place in
`args` order (§7.15.8), so a given argument's default never runs. Its
names are checked at load whether or not any `use` leaves it out (V-15).
A run-time error in a default is reported at the default
(`components.tube.defaults.r1`). A default is checked and run with the
sockets the component's body can place, as the body is, so it may call
`socket()` and `socket_dir()` (§7.21.3, V-13).
Functions (§7.13) have no defaults: their calls are positional, as in
GLSL.

### 7.15 Build statements

`build` is a list of statements, run top to bottom (§6.1.12). Each
statement is a JSON object identified by its keyword key. Keys starting
with `//` are comments, and any other key the statement doesn't define is
an error.

Statements that contain a list of statements (`for`, `if`, `transform`,
`part`, and component bodies) open a **block**. Names a block defines
with `let` disappear at the end of the block. The current surface, grain
and crease angle (§7.15.4, §7.15.5, §7.17) are restored at the end of the
block.

#### 7.15.1 `let`: name values

```json
{"let": {"span": "width - 2 * OVERHANG", "count": "max(2, ceil(span / MAX_BAY) + 1)"}}
```

Names are bound in order, so later names can use earlier ones. A `let`
binds at least one name. Each is a local name (§7.2.3).

#### 7.15.2 `for`: repeat

```json
{"for": "i", "in": "range(count)", "do": [ … ]}
{"for": "side", "in": [-1, 1], "do": [ … ]}
```

`in` must evaluate to a list. The body runs once for each element, in
order, with the element bound to the variable. The variable is a local
name (§7.2.3), and so is the variable of a list comprehension
`[expr for name in list]`.

There is one variable, deliberately: `for` and comprehensions don't
unpack (`for y, s in pairs` is an error). Bind the element and index it,
`[p[0] * p[1] for p in pairs]`, or loop over indexes,
`[ys[i] * ss[i] for i in range(len(ys))]`.

#### 7.15.3 `if`: choose

```json
{"if": "head == 'lantern'", "then": [ … ], "else": [ … ]}
```

The test must evaluate to `true` or `false`; numbers are not truth values.
`then` and `else` are both optional.

#### 7.15.4 `surface`: what the faces are made of

```json
{"surface": "wood"}
```

Sets the surface for the geometry that follows in the block, one of §6.3.
A renderer may use it to texture faces procedurally; a renderer that
can't draw a kind draws it as `plain`, but the surface data keeps the
kind (§7.16). Every primitive also accepts `"surface"` to override it for
that one primitive.

A string that is a surface name is taken literally. A single identifier
that is neither a surface name nor a name in scope is an error. Any other
text is an expression that must give a surface name when it runs:

```json
{"surface": "style == 'iron' ? 'metal' : 'paint'"}
```

#### 7.15.5 `grain`: texture direction

```json
{"grain": [0, -1, 0]}
```

Sets the grain direction of wood and similar patterns for the faces that
follow, in the coordinates where the statement runs: the transforms it
runs inside turn it, and a `transform` opened after it does not. So
`{"grain": [0, 1, 0]}` before a block that turns a shape on its side still
means up the model. `[0, 0, 0]`, the default, lets each primitive pick it,
in the primitive's own coordinates:

| primitive | automatic grain |
|---|---|
| `box`, `box_between` | along the box's longest side (x, then y, then z on ties), turned by its `rotation` |
