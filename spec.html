| `loft` (and `cylinder_between`, `sweep`, `sweep_profile`) | its `grain` argument if not zero; otherwise, on each band of side faces, from one ring's centroid to the next; on the caps, from the first centroid to the last |
| `lathe`, `cylinder` | +Y |
| `ellipsoid`, `torus` | its own +Y, turned by its `rotation` |
| `chain_loft` | as a loft without `grain`: on each band, from one ring's centroid to the next; on the caps, from the first centroid to the last; on a bridge strip, from this end ring's centroid to the other's |
| `extrude` | R (the outline's first axis, §7.16) if its bounds are at least as wide in a as in b, else U |
| `polygon`, `mesh` | none |

A face with no grain (zero, or a primitive with none) has no grain
direction: `align: "grain"` falls back to `up` (§7.6), and the vertex
grain is zero.

#### 7.15.6 `transform`: place geometry

```json
{"transform": [{"translate": [0, 1, 0]}, {"rotate": {"axis": [0, 1, 0], "angle_deg": 90}}], "do": [ … ]}
```

Operations (§6.1.13) are applied in order, each in the frame of the
previous one, so the first operation is outermost.

| op | value |
|---|---|
| `translate` | vec3 offset |
| `rotate` | right-handed rotation by `angle` (radians) or `angle_deg` (degrees) about `axis` through `origin` (Appendix G.4); an axis with every component under 1e-5 in size is an error |
| `scale` | vec3 factors |
| `mirror` | `"x"`, `"y"` or `"z"`: flip that axis |
| `along_path` | the path frame at that distance (§7.5) |

Faces stay outward-facing under mirroring and negative scale (§7.16).

#### 7.15.7 `part`: named, posable pieces

```json
{"part": "lid", "pivot": [0, "height", "-depth / 2"], "pose_deg": ["-lid_open", 0, 0], "do": [ … ]}
```

Geometry in the body belongs to a separate part. Hosts can then animate
it. Parts nest.

- **Id.** `part` is a **template**: `{expression}` inside it is replaced
  by the value as `str()` prints it (§7.2.4), e.g. `"head_{i + 1}"`. The
  result is the part's **id**: not empty, without `/`.
- **Resolved id.** A part's resolved id is its id, prefixed by the
  instance names of the `use` statements it runs under (§7.15.8),
  outermost first, each followed by `/`: `left_wheel/hub`,
  `bogie_1/left_wheel/hub`. Ids of nested parts are not prefixed by their
  parent part.
- **Root.** Geometry outside every part belongs to the implicit root part,
  whose resolved id is `body`. Top-level parts are its children.
- **Unique.** Two parts with the same resolved id in one build, or a part
  with the resolved id `body`, are a run-time error.
- **Frame.** The part's origin is `pivot`, a point in the enclosing
  coordinates (through the current transform). Its axes are the current
  transform's axes with scale removed (Appendix G.4: Gram–Schmidt, which
  keeps a mirror). Coordinates in this frame are **part space**; the root
  part's part space is model space.
- **Pose.** `pose` rotates the part about its pivot: radians about X, Y
  and Z (or degrees with `pose_deg`, §5.1), applied Z first, then X,
  then Y (Appendix G.4). Hosts animate the
  part by changing this rotation.
- **Role and clips.** A part may name its bone with `role` (§7.24.1) and
  move in clips with `animate` (§7.25.2); neither changes its geometry,
  pivot or pose.
- **Blended geometry.** A part's geometry follows the part rigidly,
  except a `chain_loft` (§7.16.1) whose vertices are **bound** to other
  parts as well: each vertex then carries up to four parts with
  weights. Such a solid is **blended**: some vertex is bound other than
  to its own part with weight 1. It still belongs to the part it runs
  in, its **home part**, which owns it for drawing, colours and output,
  and it is stored in the home part's space at the **reference pose**
  (every `pose` 0; §7.24.2), with each vertex's parts (resolved ids) and
  weights. A reader that shows the build skins it with the built poses
  (G.19), so a static `pose` bends it.

Geometry inside a part is still given in the enclosing coordinates; a
reader stores it in part space, before the pose. The part's transform
relative to its parent part is (parent frame)⁻¹ · (part frame) · pose.

A model's parts must be the same, with the same ids, pivots and
hierarchy, whether its components run in the model itself or in another
model that imports it; only the instance prefix is added.

#### 7.15.8 `use`: run a component

```json
{"use": "trestle", "with": {"x": "-span / 2 + span * i / (count - 1)"}}
```

`with` must give every argument of the component that has no default
(§7.14), may give one that has, and gives nothing else. The arguments
are evaluated in the order of the component's `args`: a given one in the
caller's scope, a left-out one from its default in the component's
scope, which then holds the arguments evaluated so far. The body then
runs with only its arguments and its own document's global names
(§7.14, §7.4).

`as` gives an **instance name**, a template like a part id (§7.15.7),
evaluated after the arguments: not empty, without `/`.

```json
{"use": "rail.wheelset", "as": "wheels_{i + 1}", "with": {"x": "x", "radius": "WHEEL_RADIUS"}}
```

Every part the component makes, directly or through further `use`s, gets
the instance name and `/` in front of its resolved id: here
`wheels_1/axle` for a part `axle` inside `wheelset`. `as` is **required**
when the component is imported and makes parts (§7.14), so two uses of
one library component can't make parts with the same id. It is optional
otherwise. The instance name prefixes socket ids the same way
(§7.21.3), and a `chain_loft`'s `id`, the parts its `chain` names and
the `bridge` it names (§7.16.1); it has no effect on a component that
makes no parts and places no sockets.

Components and functions share the 64-deep nesting counter (§11).

### 7.16 Primitives

Every primitive makes one **solid** in one colour, and every `color`
argument also takes a texture value (§7.6); the vertex colour is then its
tint. Vertex colours are the colour's r, g and b, each clamped to 0–1.
Alpha is dropped, except under a texture whose `alpha_mode` isn't
`opaque`, where the vertex keeps the tint's alpha, clamped to 0–1. A solid is **closed and outward-facing** when the
primitive describes a closed shape: a `box`, a capped cylinder, sweep,
loft or `sweep_profile`, an `extrude`, a `sphere`, `capsule`, `ellipsoid`
or `torus`, a lathe whose profile starts and ends at radius 0, or a
`chain_loft` with neither end `open` (§7.16.1). A `polygon`, anything with `caps: false`, an open lathe
profile and a `mesh` make open surfaces; their faces still face the way
the primitive says.

A primitive whose input is too small **draws nothing** (it still counts
for the piece seed, §7.2.5): a `polygon`, `extrude` outline or
`sweep_profile` profile with fewer than 3 points, a `sweep` path with
fewer than 2 points, a `loft` with fewer than 2 rings, a
`cylinder_between` whose ends are closer than 1e-6 m, or a `chain_loft`
whose curve has fewer than 2 points once points closer than 1e-6 m to
the one before are left out (G.22). Loft rings of
different lengths, `mesh` indices that aren't whole numbers from 0 or
point past the last point, a flat index list whose length isn't a multiple
of 3, and `uvs` not one per point are errors.

Each primitive emits triangles as Appendix G.5 describes: every triangle
is turned to face away from an "inside" point the primitive gives, and
triangles with almost no area are dropped. What each makes:

| primitive | geometry |
|---|---|
| `box` | A loft of two rings (bottom, top) of four corners `center + R·(±size/2)`, with caps. `R` is the rotation of `rotation` about `center`, in the order of `pose` (Z, then X, then Y). 6 faces, 12 triangles |
| `box_between` | A `box` centred between `from` and `to`, size \|to − from\| per axis, not rotated |
| `cylinder` | A lathe at `base`, `phase` 0, of the profile (0, 0), (radius, 0), (radius_end, height), (0, height); without caps (radius, 0), (radius_end, height). A cone when `radius_end` is 0 |
| `cylinder_between` | A loft of `circle_ring(from, radius, sides, to − from)` and `circle_ring(to, radius_end, sides, to − from)`, with `caps` |
| `lathe` | Revolves the profile around +Y through `base`. For each profile segment of non-zero length and each of `sides` steps round, one quad between angles θi = phase + 2π·i/sides and θi+1 (radians), at points `base + (r cos θ, y, r sin θ)`. Walk the profile bottom to top with the outside on your right: each quad faces the profile's right-hand side. Start and end at radius 0 for a closed solid |
| `extrude` | Any simple polygon (a, b), concave allowed, laid in a plane through `base` and extruded along `normal` by `height`: one wall quad per outline edge, facing away from the outline whichever way it winds (by the sign of its area), and two caps, ear-clipped (Appendix G.6), the first facing −`normal` and the last +`normal`. The outline's frame is below |
| `sweep` | A round tube along `path`, without twisting: a loft of one `circle_ring` per path point (Appendix G.5), with `caps` |
| `loft` | Skins consecutive rings, which need the same number of points in the same order: quads between ring s points i, i + 1 and ring s + 1; closes the ends with caps. Faces out by the ring order (below) |
| `polygon` | One face facing `normal`, fanned from the first point: triangles (0, i, i + 1). Meant for convex points |
| `sweep_profile` | Sweeps a cross-section along the whole path: a loft of the profile placed at each of `path_distances(max(step, 0.01))`, in that frame's (Z, Y) plane, with `caps`. Path models only (§7.5) |
| `sphere` | A lathe at `center − (0, radius, 0)` of a half circle of radius `radius` from the bottom pole to the top one, in max(2, round(`sides` / 2)) equal steps: points (radius · sin φ, radius · (1 − cos φ)), φ = π·i/steps. `sides` steps round |
| `capsule` | A lathe at `base` of the profile: a quarter circle of radius `radius` from the bottom pole up to its equator at height `radius`, a straight side to the equator of the top quarter circle of radius `radius_end` centred `height` higher, and that quarter circle to the top pole; each quarter circle in max(1, round(`sides` / 4)) equal steps. `height` is the distance between the two sphere centres, as in Khronos |
| `ellipsoid` | The triangles of a `sphere` with `center` `[0, 0, 0]`, `radius` 1 and the same `sides`, made inside the transform `[{"translate": center}, R, {"scale": radii}]` (§7.15.6, G.4), `R` the rotation of `rotation` as for `box`. So its radii lie along its own X, Y and Z, turned by `R`, and a negative radius still faces out (G.5). Only its surface coordinates differ from that transformed sphere's (§7.6) |
| `chain_loft` | A surface along a smooth curve through its chain's joints (or its `path`), with sections matched and interpolated along it, and its vertices bound to the chain's parts; below (§7.16.1) |
| `torus` | The triangles of a `lathe` at `[0, 0, 0]`, `phase` 0, with `sides`, of the closed circle profile (radius + tube_radius · cos ψ, tube_radius · sin ψ), ψ = π + 2π·j/tube_sides for j = 0 … tube_sides (the last point is the first: the profile starts at the tube's inner equator and walks down round it), made inside the transform `[{"translate": center}, R]`. Unturned it lies flat round +Y through `center`. A `tube_radius` at least `radius` (a self-crossing spindle torus) is built as written |
| `mesh` | Triangles by point index, counter-clockwise seen from outside; each faces the way its winding says. `uvs`, one per point in glTF's convention ((0, 0) at the image's top-left, v running down), are its surface coordinates (§7.6). Or the geometry of a glTF node (below). For shapes no other primitive makes, such as a scan; prefer the others, which keep `lod` and parameters meaningful |

**The extrude frame.** `normal` is the direction the solid rises, and
`up` turns the outline in its plane: the outline's second coordinate b
runs along `up` (made square to `normal`), and its first coordinate a
along `normal` × `up`. Left out, `up` is +Y, or +Z when `normal` is
within about 25° of the Y axis. So the defaults lay the outline flat as
(x, z) and extrude it up +Y from `base`, and an upright shape facing +Z
is `"normal": [0, 0, -1]` with the outline as (x, y), as seen from the
front, rising back into the wall. Seen looking along `normal` with `up`
pointing up, a runs to the right and b up (Appendix G.5).

```json
{"extrude": {"outline": "arch_ring(r, rise, 0.1, n)", "base": [0, 2.4, 0.06],
             "normal": [0, 0, -1], "height": 0.06, "color": "#9a948a", "surface": "stone"}}
```

A zero `normal`, or an `up` parallel to it, is an error.

**Which side is out.** An extrude's walls face away from its outline,
whichever way the outline winds. A loft's faces point out as its ring
order says: the reader closes the loft with its caps, and if that solid's
signed volume is negative, every face turns round (Appendix G.7). So a
loft faces out whether its rings run clockwise or not, and concave rings
(a star, a scanned cross-section) work. A loft with no volume, such as a
box of no height, follows the ring order as given. Caps are cut into
triangles in the ring's own plane by ear clipping (Appendix G.6), so a
concave cap is right too. Each ring should be roughly flat, and
consecutive rings shouldn't cross.

**A mesh from a glTF file.** `{"mesh": {"gltf": "bust.glb", "node":
"head", "color": "#9a948a"}}` takes its points, triangles and `uvs` from
one node of a glTF 2.0 file, read as §7.7 reads files. The model stays
parametric around it: size, `lod`, colour and placement are still the
document's. `gltf` is a literal path and `node` a literal: a whole
number, the node's index, or a string, the name of exactly one node.

- The node must have a mesh. Its primitives are read in order, and each
  must have `mode` 4 (triangles; the default) and a `POSITION`
  attribute. Their points are concatenated, and each primitive's
  `indices` (or 0, 1, 2, … without them) are offset to match.
- Points are transformed by the node's global transform: its own matrix,
  or T · R · S, times its parent's, up to the root of its node tree.
  When that transform's determinant is negative, every triangle's last
  two indices are swapped, so the triangles still face out as glTF draws
  them.
- `TEXCOORD_0` gives the `uvs` when every primitive has it, unchanged
  (both use glTF's convention); otherwise the mesh has no `uvs`.
- Normals, tangents, colours, materials, skins, morph targets and the
  node's children are ignored. Each accessor read counts as a data block
  for the 1,000,000-number limit (§11). To keep them, place the node as
  an asset instead (§7.21).

Then it is a `mesh` like any other.

**What a vertex carries.** Position (part space), normal (§7.17), colour
(above), **surface data** (the surface index of §6.3 plus 0.9 × the
piece seed, so the whole number is the kind and the fraction the seed),
grain (a unit vector in part space, or zero), texture coordinates (§7.6,
Appendix G.10), the primitive's `roughness` and `metallic` if given, and
its emission (§7.17); and the parts it is bound to with their weights:
its own part with weight 1, except in blended geometry (§7.15.7).

#### 7.16.1 `chain_loft`: blended chains and sections

One surface along a smooth curve, from the shoulder to the wrist, with
cross-sections that change along it and vertices that follow the bones
of a chain of parts. Keys in §6.1.35; the exact construction in
Appendix G.22.

```json
{"chain_loft": {
  "chain": ["left_upper_arm", "left_lower_arm"], "end": [0.62, 1.31, 0],
  "blend": [0.05], "steps": "[20, 12, 6][lod]", "sides": "[14, 10, 6][lod]",
  "sections": [
    {"t": 0,   "ring": "superellipse_ring(0.045, 0.042, 2, 16)"},
    {"t": 0.5, "ring": "superellipse_ring(0.041, 0.039, 2, 16)", "offset": [0, -0.003]},
    {"t": 1,   "ring": "superellipse_ring(0.034, 0.022, 2.5, 12)", "rotation_deg": 15}
  ],
  "ends": ["open", "cap"], "color": "#4f6fb0"}}
```

**The chain.** `chain` names parts by id, outermost first, written as in
the same scope and prefixed by the current `use` instance names
(§7.15.8), so a component that makes a limb also makes its chain loft. Each entry is a template like a part id (§7.15.7), so
`"{side}_upper_arm"` works inside a `for`.
Each named part must already exist (made earlier in the build: place the
chain loft after the limb's outermost `part` statement, or in an
ancestor), and each must be a direct child of the one before, with the
same handedness (G.4 keeps a mirror; the sign of its frame's
determinant): a run-time error at `chain` otherwise. The primitive runs
in its **home part**, which needn't be in the chain. The curve runs
through the parts' pivots (their frames' origins, which no `pose`
moves) and then `end`, the free tip past the last part. With `path`
instead of `chain`, the curve runs through the given points, and the
surface is rigid, bound to the home part. A chain of one part is
rigid geometry of that part, with sections.

**The curve and t.** A centripetal Catmull–Rom curve runs through the
points; t is the distance along it as a fraction of its length, 0 at
the first point and 1 at the last, measured on fixed samples so that it is the same at every `lod`.
The **joints** are the pivots after the first; joint k is at t_k. The
curve itself has no bowing keys: a section's `offset` bows the surface
(a calf, a belly).

**Frames.** Each ring has an x and y axis across the curve: at the start,
x is the first chain part's +Z (the figure's front, §7.24.2) made square
to the curve, or its +Y where +Z runs along the curve; with `path`, x
starts as a `sweep`'s reference does (G.5). It is carried along without
twisting. y is the tangent × x. A section's `rotation` is its twist.

**Sections.** Each section gives an outline at its `t`, in the ring's
(x, y) plane, in metres: a `ring`, a closed list of vec2 (any length:
`superellipse_ring` and comprehensions over the other ring helpers, e.g.
`[p.xy for p in circle_ring([0, 0, 0], r, 12, [0, 0, 1], [1, 0, 0])]`,
which starts on +x as `superellipse_ring` does); a `path`
of SVG-style commands; or a `line`, an open curve. `scale`, then
`rotation` (from x towards y), then `offset` are applied to it. Before
the first section and after the last, the nearest one holds; between
two, every number (each matched point's x and y, `offset`, `rotation`,
`scale`) follows a monotone cubic along t, so a value never leaves the
range of its two neighbouring sections.

**Matching sections.** Sections may have different numbers of points.
Each is wound counter-clockwise (from x towards y) first, keeping its
point 0. Point 0 is matched to point 0, so start every section at the
same angle (or name an anchor there): two sections that start half a
turn apart twist the surface through a waist, which no warning catches. Every ring then has `sides` points, placed on each section by
distance round its outline from point 0. **Anchors** name points
(`"anchors": {"front": 4, "back": 12}` on a `ring` or `line`, `anchor`
on a path command): they split the outline into spans, and every section
gives each span the same number of points, so anchors line up from
section to section and the ring starts at the first section's first
anchor. Sections must name the same anchors (checked at load, V-57) in
the same order round the outline (checked when built: a run-time error
at the section). A **sharp** anchor stays a ring point, and the
surface's normals split there (a crease, G.9). A ring has
max(`sides`, number of anchors) points.

**Paths.** A `path` is a list of command objects, SVG's letters with
absolute coordinates in the ring's plane, metres, y up (an outline
copied from a drawing, where y runs down, comes out mirrored):

```json
{"t": 0.5, "path": [{"M": [0, 0], "anchor": "heel", "sharp": true}, {"L": ["w", 0]},
                    {"Q": [["w + 0.01", 0.03], [0, 0.03]]}, {"Z": true}]}
```

`M` starts it; `L` draws a line to a point, `Q` a quadratic Bézier
(control, end) and `C` a cubic (control, control, end); `Z` closes it
back to the `M` point. One subpath. Points are placed on the exact
curves by distance along them, so a path is as smooth at every `lod`;
a corner is a ring point only where it is a sharp anchor. A path is JSON,
not a value: to reuse one, make the whole primitive in a component.

**Open curves.** A `line`, or a `path` without `Z`, is an open curve, and
needs `thickness: [left, right]`, metres either side of it (left is the
direction of travel turned +90°): `[w / 2, w / 2]` centred, `[w, 0]` to
one side. It becomes the closed outline round it: along the left side,
round the end, back along the right, round the start; corners mitred,
and a mitre longer than 4 times its side's thickness cut to a bevel.
`tips` shapes both ends: `flat` (the default), a straight end, or
`round`, a half circle. On an open curve, an anchor `X` names two outline
points, `X_left` and `X_right`; `flat` tips add the sharp anchors
`start_left`, `start_right`, `end_left` and `end_right` at their corners,
and `round` tips the smooth anchors `start` and `end` at their tips. So
every section of a primitive has the same `tips`, or names the same
anchors in another way. An outline that crosses itself is built as
written, with a warning (V-58).

**Rings.** `steps` + 1 rings at t = i / `steps`, and 3 more at each joint
(below), whatever `blend` is, so the counts depend only on `steps`,
`sides`, the chain and `ends`. Tie both to `lod` the usual way
(`"[20, 12, 6][lod]"`, §7.9); the format doesn't lower them by itself.

**Weights.** Outside the joints' blend bands, a ring follows the part of
its stretch of curve (the part whose pivot is the last joint at or
before its t). `blend` gives each joint a band width in metres along the
curve; within the band the part after the joint gets weight
s = smoothstep(t_k − h, t_k + h, t), h the half width in t, and the part
before it 1 − s. h is clamped to half the shorter neighbouring stretch,
so bands never overlap. The 3 extra rings of a joint sit at t_k − h/2,
t_k and t_k + h/2, so a bend has geometry to bend at any `steps`; with
`blend` 0 they all sit at the joint, and the switch is there.

`weights` overrides this per vertex: an expression evaluated once per
vertex, giving one number per chain part in chain order. While it runs
these names exist (and only there, V-57):

| name | value |
|---|---|
| `t` | the vertex's ring's t, 0–1 |
| `angle` | radians in [0, 2π): `atan(y, x)` of the vertex in its ring's frame, 0 at x (the front) |
| `point` | vec3, the vertex in the home part's space at the reference pose |
| `joint_t` | list of the joints' t, in chain order |
| `blend_weights` | list, the weights `blend` gives this vertex, one per chain part |

```json
{"weights": "[w * (1 + 0.2 * cos(angle)) for w in blend_weights]"}
```

A result that isn't a list of numbers of the chain's length is a run-time
error at `weights`; negative weights count as 0; all 0 is an error. Each
evaluation counts as steps of the build (§11). A cap vertex takes its
ring vertex's weights; a `point` tip is evaluated once, with its t, `angle`
0 and `point` the tip. Every vertex then keeps its 4 largest weights,
divided by their sum (G.22).

**Ends.** `ends` gives the start and the end: `cap` (the default) closes
the end ring flat by ear clipping, as a loft cap; `open` leaves it open,
to bury in another solid (a sleeve's start inside the torso); `point`
closes it to its point on the curve, a fan, for a fingertip or a horn
(with sections shrinking towards it, a rounded tip). A **bridge**,
`{"bridge": "sleeve", "end": "end"}`, joins this end ring to the `end`
(`"start"` or `"end"`, default `"end"`) of the chain loft whose `id` is
`sleeve`, with a strip of triangles between rings of any counts:

```json
{"chain_loft": {"id": "cuff", "chain": ["left_lower_arm"], "end": [0.66, 1.31, 0],
  "steps": 4, "sides": 16, "ends": [{"bridge": "sleeve"}, "point"],
  "sections": [{"t": 0, "ring": "superellipse_ring(0.03, 0.025, 2, 16)"}], "color": "#4f6fb0"}}
```

The target must be a chain loft made earlier in the build, its end must
be `open` and not bridged yet, and its chain must have the same
handedness; it can't be the primitive itself: a run-time error at the
`ends` entry otherwise. The strip belongs to the declaring primitive (its
colour, surface and home part); its vertices are copies of the two rings'
points, keeping their normals, texture coordinates (u made continuous
across the ring's seam) and weights, so the seams shade smooth. A strip between chain lofts of different parts is
blended even when both are rigid (a hose between two rigid pipes). The
rings match anchor to anchor when both have anchors (the same names, else
an error at the entry), else from the point nearest in angle (G.22). No
rule limits how far apart the rings are or which parts hold them.

The surface is closed and outward-facing (§7.16) when every end is `cap`,
`point`, a bridge, or the target of one. Like a loft, it faces out
whichever way its sections wind (G.7). A section larger than the curve's
own bend radius folds over on the inside of the bend in the reference
pose; that is built as written, with a warning (V-58). Folding in a posed
bend is the skinning's (OI-51).

**Ids.** `id` is a template like a part id (§7.15.7), prefixed the same
way; empty, with `/`, or used twice in a build is a run-time error at
`id`. Only chain lofts have ids, and only bridges read them.

### 7.17 `smooth`: shading, and `roughness`, `metallic` and `emissive`

```json
{"smooth_deg": 50},
{"cylinder": {"base": [0, 0, 0], "radius": 0.1, "height": 1, "sides": 16, "color": "#5e3d22"}},
{"box": {"center": [0, 1, 0], "size": [0.3, 0.05, 0.3], "color": "#5e3d22", "smooth": 0}},
{"lathe": {"base": [0, 1, 0], "profile": "KNOB", "sides": 24, "color": "#b08a52", "roughness": 0.3, "metallic": 1}}
```

`smooth` sets the **crease angle**, in radians, clamped to 0–π, for the
geometry that follows in the block; `smooth_deg` sets it in degrees,
clamped to 0–180 (§5.1). A primitive's own `"smooth"` or `"smooth_deg"`
sets it for that primitive. The default is **40°** (2π/9).

Where two faces of one solid share a point and meet at less than the
crease angle, the edge is shaded smooth; sharper edges stay crisp. Each
vertex normal averages the normals of the faces of its solid that touch
that point, weighting each by its angle there and leaving out faces that
meet its own face at the crease angle or more (Appendix G.9). With 40°,
the facets of a round solid with 10 or more sides blend, while box edges
(90°), steps in a moulding and octagons (45°) stay sharp. `0` keeps every
face flat, the low-poly look. Smoothing never crosses from one solid to
another, so separate boards stay separate.

`roughness` and `metallic`, clamped to 0–1, are options on any primitive.
They mean glTF's `roughnessFactor` and `metallicFactor`: they replace the
roughness and metalness the surface (§7.15.4) would give, or scale a
texture's maps (§7.6). Leave them out to keep the surface's own. A
solid's colour is its glTF base colour.

Each surface kind has its own roughness and metalness, which a bake
writes as the material's factors (§9.1) and a renderer uses as the flat
value of the kind:

| surface | roughness | metallic |
|---|---|---|
| `metal` | 0.45 | 0.5 |
| `glass` | 0.12 | 0 |
| `slate` | 0.7 | 0 |
| `paint` | 0.6 | 0 |
| every other kind | 0.85 | 0 |

A renderer that draws a kind's pattern procedurally may vary these
values across a face around the table's value.

**Emission.** `emissive`, a colour, and `emissive_strength`, a number,
are options on any primitive too: the light the faces give off by
themselves, for a lamp's glass, a screen or a signal lens.

```json
{"sphere": {"center": [0, 2.4, 0], "radius": 0.12, "sides": 16, "color": "#fff4d0", "emissive": "lit ? #ffd890 : #000000", "emissive_strength": 4}}
```

`emissive` is a colour (§7.2.1), sRGB like every colour in JIG, its alpha
ignored and each channel clamped to 0–1, as a vertex colour is (§7.16),
so `lighten(…)` can't go past white; a texture value is an error at run time (§10.1). It is glTF's
`emissiveFactor`. The default is `#000000`: no emission. A surface kind
emits nothing. `emissive_strength`, default `1`, clamped to ≥ 0,
multiplies it: glTF's `KHR_materials_emissive_strength`, for light
brighter than the colour's 1.0 can say. A strength with a black
`emissive` gives no emission. Emission lights only the face itself: to
light the scene around it, give the model a light (§7.23.6). There are no
emissive maps.

### 7.18 Derived values

```json
"derived": {
  "planks_fit": {"value": "min(planks, max(1, floor((height + GAP) / (MIN_PLANK + GAP))))",
                 "doc": "Planks that fit the height."},
  "zf": {"value": "depth / 2 - 0.62", "class": ["placement", "shape"], "unit": "m",
         "doc": "Front axle, from the centre."}
}
```

`derived` names values the model computes from its inputs (§8.1).
§6.1.15 lists the keys. They are evaluated after the inputs are settled
and before the build, in the order written, once per build. A derived
value may read the inputs (parameters, size, `seed`, `lod`, and in a
path model `path_length` and the path tools), constants, data blocks,
the document's functions, imported constants and functions, and earlier
derived values. A derived value can't read itself or a later one,
directly or through the functions it calls. It may use random values
(§7.2.5).

A derived value's name is a global name (§7.2.3): the build, the
document's functions and components, and later derived values read it
like a parameter. Constants and size limits come first and can't read
it. A host may show derived values to the user as read-only outputs,
with their `doc` and `unit`. A run-time error stops the run at
`derived.NAME.value`.

A derived value's impact class (§7.19), what a change of it can
affect, is its actual class, which the reader works out. `class` may
state it as well: the declaration must then cover what the value
actually reaches (V-22), and declaring more is allowed. Declare it to
keep a value within its class: `["placement"]` on a value that must
never change a shape. An imported document's derived values
are evaluated with its own parameters and size at their defaults
(§7.4), and only its own functions and components read them;
`alias.NAME` reads constants only.

### 7.19 Impact classes

An **impact class** says what a change of a value can change in the
output. There are six:

| class | a change can change |
|---|---|
| `pose` | the pose of parts: their rotation about their pivots |
| `physics` | data that carries no geometry: physics (§7.22), placement (§7.23), roles and clips (§7.24, §7.25) |
| `placement` | where solids and parts sit: transforms and pivots |
| `appearance` | colours, surface data, roughness, metalness, emission, smoothing, grain and texture coordinates, and assets' material factors; not positions |
| `shape` | vertex positions, normals and skin weights (the parts a vertex is bound to and their weights, §7.16.1), with the same statements running, including sliced assets and morph weights |
| `structure` | anything: which statements run, how many points, triangles, items, parts or placed assets there are, and which asset is placed |

A class set is a set of these; `structure` covers all the others, so a
set that holds it stands for all five. A set **covers** another when it
holds `structure` or every class of the other.

**Sinks.** Every place a value is used is a **sink** of one class, by
its position in the grammar:

| class | sinks |
|---|---|
| `pose` | a part's `pose` or `pose_deg` |
| `physics` | the `physics` block's `mass`; a `joint`'s keys (`when` too), or a `joint` expression; a `collider`'s arguments, `trigger` and `filter`; a physical material's values; every value of a placement statement (§7.23), `wall_gap` and a light's values; a part's `role` template and the values of its `animate` channels, and a clip's `length` and `speed` (§7.24, §7.25); the values of an action's phases: their `length`, targets, bone channels and attach events (§7.26). They change no geometry |
| `placement` | transform operations (`translate`, `rotate` with its `axis`, `angle` or `angle_deg`, and `origin`, `scale`, `along_path`), a part's `pivot`, an asset's `at` and `spin` or `spin_deg`, a `socket`'s `at`, `normal` and `up`, a `repeat`'s `up` |
| `appearance` | a primitive's `color` (including a texture value's tint), the options `surface`, `smooth` or `smooth_deg`, `roughness`, `metallic`, `emissive` and `emissive_strength`, the statements `surface`, `smooth` or `smooth_deg`, and `grain`, a loft's `grain`, a mesh's `uvs`, the values of an asset's `materials` |
| `structure` | the condition of `if`; a `for`'s `in` and the list a comprehension reads; a list index; `sides`, `tube_sides` and `caps`; a `chain_loft`'s `steps`, `chain`, `ends` and `id`; a mesh's `triangles`; a `sweep_profile`'s `step`; the count arguments of built-ins (all of `range` and `steps`, `bezier`'s segments, `circle_ring`'s sides, `superellipse_ring`'s `n`, `rect_ring`'s chamfer, `path_distances`' step); part id and `as` templates; an asset's `index`; a `repeat`'s `from`, `to` and `max_stretch` |
| `shape` | every other primitive argument: coordinates, sizes, radii, profiles, rings, outlines, points, `phase` or `phase_deg`, the `rotation` or `rotation_deg` of a box, ellipsoid or torus, `normal`, `up`, `base`, `height`; a `chain_loft`'s `path`, `end`, `blend` and `weights`, and its sections' values (`t`, `ring`, `path` commands, `line`, `offset`, `rotation` or `rotation_deg`, `scale`, `anchors` indices, `thickness`); an asset's `size` and `morph` weights |

**Flow.** A name's **actual class** is the union of the classes of every
sink its value reaches. A reader finds it from the document alone,
without evaluating anything, in every branch whether it runs or not
(like V-13):

- An operand of an operator or a built-in reaches wherever the result
  goes, unless its position is a structure sink above. A random key
  reaches wherever the random value goes.
- The condition of `c ? a : b` reaches wherever the result goes, and
  `structure` as well when the result reaches a **list argument**: a
  primitive's `outline`, `profile`, `rings` or `points`, a `sweep`'s `path`, or a
  mesh's `uvs`, where a list of another length would change the count.
  So `finish == 'oak' ? a : b` as a colour is `appearance`.
- A `let` name, a `for` variable, a comprehension variable and a
  derived value pass on: the names their value reads reach every sink
  they reach.
- **Functions**, once per function: for each argument, whether it
  reaches the function's result, and whether it reaches a structure sink
  inside the function (through its body and the functions it calls). At
  a call, the names in that argument reach where the call's result goes
  if it reaches the result, and `structure` if it reaches a structure
  sink. A global name the body reads counts as such an argument at every
  call.
- **Components**, once per component: an argument's class is the union
  of the sinks it reaches in the body (through `let`, calls and nested
  `use`s). At a `use`, the names in a `with` value reach that class.
  A global name the body reads reaches its sinks there. A default
  (§7.14) is part of the body: the names it reads, global names and
  earlier arguments, reach every sink its own argument reaches.
- An `enum` parameter that keys a preset reaches every sink the
  parameters it sets reach. A name a size limit reads reaches every sink
  that size axis reaches.
- `seed` reaches every sink a random value reaches (in constants,
  derived values and the build), and `appearance` (piece seeds, §7.2.5).
- **Sockets.** The names that reach where a socket is (its `socket`
  statement's keys, or its asset's placement keys, `size` and the
  `repeat` that placed it, and the transform operations and pivots
  around it) also reach `placement` at every asset attached `onto` it,
  and wherever `socket()` or `socket_dir()` of it goes. A reference
  names no value, so it adds nothing else.
- **Chains.** A `chain_loft` with `chain` (§7.16.1) is shaped by where
  its chain's parts sit, which only a build knows. So in a document
  whose build or components (imported ones included) hold one, every
  `placement` sink is also a `shape` sink.
- `lod` is always `structure`. The path reaches what `path_length`
  and the path tools reach, `placement` through `along_path`, and
  `structure` through `sweep_profile`.

Functions and components may call each other; a reader repeats the
analysis until no set grows (they only grow, so it ends). The class of
an **input** or a **derived value** is its actual class; hosts may read
it to know what a change can affect. A derived value that declares
`class` must cover its actual class (V-22); a reader rejects the
document at `derived.NAME.class` otherwise, naming a sink the value reaches that the
declaration doesn't cover:

```text
derived.zf.class: reaches "shape" (build[4].box.center), which ["placement"] doesn't cover
```

*Errors cut across classes:* a change of any class can make a build
stop with an error (§10). The classes describe what a change can do to a
build that succeeds.

### 7.20 Incremental builds

A reader may reuse anything between builds, but its output must equal
a full build with the same inputs (REQ-04, REQ-09), errors included.
Reuse is optional. The rest of this section is informative: what a
reader is meant to do.

1. On any change of inputs, settle them (§8.1) and evaluate every
   derived value again.
2. Compare each input and each derived value with its value in the last
   build, using `==` (§7.2.2). The **impact** is the union of the classes
   of the names that changed: the actual class of each (§7.19).
3. With `structure` in the impact, rebuild everything. Otherwise rebuild
   only the parts whose statements read a changed name, directly or
   through the functions and components they call, and within the impact:
   new poses for `pose`; for `physics`, the physics data of §7.22, the
   placement data of §7.23, the roles of §7.24, the clips of §7.25 and the
   actions of §7.26 alone;
   transforms and pivots for `placement`; for
   `appearance`, when the changed names reach only `color`, `surface`,
   `roughness`, `metallic`, `emissive` and `emissive_strength`, repaint those parts' vertex colours,
   surface data, textures and materials in place, keeping their
   triangles, positions and normals; where a face's texture changes, work
   out its texture coordinates again from the face, which needs only what
   the build already made: its plane, grain and points, its solid's first
   point and piece seed, and the primitive's surface coordinates (§7.6,
   Appendix G.10). A change of `smooth`, `grain`, mesh `uvs` or the seed
   moves normals or texture coordinates of faces that keep their texture,
   so rebuild those parts; for an asset's `materials`, set the new
   factors in place;
   positions and normals for `shape`, and an asset's slicing and morph
   weights.
4. A `shape` change can still change a part's triangle count: degenerate
   triangles are dropped (§7.16) and ear clipping depends on the
   positions (Appendix G.6). When a rebuilt part's counts differ from
   before, rebuild that part fully, and its smoothing with it (§7.17).
5. A `chain_loft`'s home part also reads where its chain's parts sit
   (§7.16.1, §7.19), and a bridge strip reads its target's end ring:
   rebuild the home part when a chain part's frame, or the target, changes.

Keyed piece seeds (§7.2.5) keep a piece's seed when other pieces come
or go, so a part rebuilt alone gets the seeds a full build would give it.

Clips are sampled on the parts as built (Appendix G.18): a change of
`placement`, `pose` or an asset's morph weights that reaches a part a
clip animates also changes that clip's keys, so a reader samples the
clip again; the clips of action phases (§7.26.6) are clips. The targets,
bone channels and attach events of an action (§7.26) are sampled from
the values alone, in the use point's frame, so a change of a use point's
`point` or `facing` changes none of them, and a change of `placement`,
`pose` or a morph weight changes them only through the names their
expressions read.

### 7.21 Assets

A document can compose **assets**: finished, sculpted pieces from glTF
files, such as a kit of doors, wall bays and trims. JIG decides which
asset, where, how many, and how it fits the requested size; the glTF file
decides what it looks like. A reader never re-triangulates, re-smooths or
re-textures an asset.

```json
"assets": {
  "door_oak":   {"gltf": "kit/doors.glb", "node": "door_oak"},
  "door_steel": {"gltf": "kit/doors.glb", "node": "door_steel"}
},
"build": [
  {"asset": {"name": "door_oak", "at": [0, 0, 0.12]}}
]
```

`mesh` (§7.16) and `asset` do opposite jobs. `mesh` takes geometry into a
JIG solid, which JIG then shades and textures: use it for raw scan data.
`asset` passes a piece through untouched: use it for finished, artist-made
pieces.

#### 7.21.1 Declaring assets

`assets` names the assets a document uses (§6.1.16). An asset name is an
identifier; an imported asset is `alias.name`. `gltf` and `node` (or
`lods`) are literals, read and checked when the document loads, as §7.7
reads files.

- **What an asset is.** The node and its whole subtree: meshes,
  materials, normals, tangents, every texture coordinate set, vertex
  colours, morph targets, skins and extensions, all as the file defines
  them.
- **Its frame.** The asset's origin and axes are the node's own: the
  node's transform and its parents' are not applied, its children's are.
  So a kit file may lay its pieces out side by side.
- **Allowed extensions.** The file may list in `extensionsRequired`
  only `KHR_materials_*` extensions, `KHR_texture_basisu`,
  `KHR_texture_transform`, `KHR_mesh_quantization` and
  `EXT_meshopt_compression`. Anything else is an error at load
  (V-23). A reader must render what these extensions describe, or
  pass them on unchanged to a renderer that does.
- **Left out.** Cameras, lights (`KHR_lights_punctual`) and the file's
  scenes are not part of an asset. Skins and their joints are passed on
  with it, and `roles` can name its bones (§7.24.1). Its animations are
  passed on when one `asset` statement places it (§7.25.5); a `repeat`
  drops them (§7.21.4). Nothing else in JIG poses a skin (OI-17 is
  closed).
- **Skins.** A skin of the subtree keeps its joints and its inverse bind
  matrices as the file writes them, and a reader multiplies none of them.
  The left-out transform Q (the global matrix of the asset's root node:
  its own local matrix and its parents', multiplied from the top) leaves
  the joints' frames too, so a joint j with global matrix G_j in the file
  has the frame Q⁻¹ · G_j in the asset's frame. A vertex v of a skinned
  mesh, with the file's weights, is then at rest at
  Q⁻¹ · G_j · IBM_j · v: the file's own rest position (G_j · IBM_j · v)
  moved by Q⁻¹, as every rigid mesh of the asset is. So a skin from an
  ordinary export, whose root sits at x = 16 and whose inverse bind
  matrices hold −16, lands on its bones at the asset's origin. The
  mesh node's own frame plays no part in a skinned mesh (glTF 2.0, skins).
  A skin with a joint outside the placed subtree is placed as **no skin**:
  its meshes sit by their nodes' own frames, as rigid meshes do, and the
  skin's joints and weights have no effect on them.
  A reader that first moves the vertex positions of skinned meshes by Q⁻¹,
  as it does for rigid ones, multiplies each inverse bind matrix on the
  right by Q (IBM_j · Q) and gets the same result; a reader that does both,
  or neither, puts the skin at the wrong place. A bake keeps vertices and
  inverse bind matrices as written (§9.1).
- **Sockets.** Nodes in the subtree whose names start with `socket_` are
  the asset's sockets (§7.21.3), read from the first level only
  (§7.21.7).

The **extent** of an asset along an axis is the range of its level-0
vertex positions along that axis, in its frame, over every mesh of the
subtree.

#### 7.21.2 `asset`: place an asset

An `asset` statement (§6.1.17) places one asset in the current part,
under the current transform, at `at`. Its sockets are placed with it.

- **Transforms.** The current transform at an `asset` may translate,
  rotate, mirror and scale **uniformly**. A non-uniform scale is a
  run-time error at the statement (§10.1): it would bend the asset's
  normals and tangents away from its normal maps. Stretching goes
  through slicing (§7.21.5) and `repeat` (§7.21.4) instead. The test:
  the current transform's three axis lengths are equal, and the axes
  square to each other, within a relative 1e-6.
- **Look.** An asset keeps its own materials, so the current surface,
  `color`, `smooth`, `roughness`, `metallic` and `emissive` don't apply to it, and
  neither does `grain`. §7.21.6 gives the ways a document may change its
  look.
- **Piece seeds.** An asset has no piece seed and its statement takes
  none (§7.2.5): a `repeat`'s copies vary through `copy` and `random`
  instead.

#### 7.21.3 Sockets

A **socket** is a named frame where pieces meet: an origin, +Z pointing
out of the piece, and +Y as its up (its +X is Y × Z). Sockets come from
two places:

- **In an asset:** a node of the subtree named `socket_` followed by an
  identifier, usually an empty node the artist placed. `socket_hinge`
  is the socket `hinge`. Its frame is the node's transform relative to
  the asset's root, with any scale removed (Appendix G.4).
- **In the build:** a `socket` statement places one at `at`, its +Z
  along `normal` and its +Y along `up` made square to it, all through
  the current transform, with scale removed. `up` left out is automatic,
  as for `extrude` and `repeat`: +Y, or +Z when `normal` is within about
  25° of the Y axis. So parametric pieces can mate with sculpted ones. A
  zero `normal`, or an explicit `up` parallel to it, is an error.

A socket's frame is always right-handed, whatever made it, a mirror or a
`repeat` stretch included. The reader keeps the frame's +Z (normalized),
makes +Y square to it (Gram–Schmidt: remove the part of +Y along +Z,
normalize), and takes +X = Y × Z. A socket node's frame is its transform
relative to the asset's root with scale removed as G.4 says, then this
rule. The asset's root node is never a socket, even if its name starts
with `socket_`.

```json
{"socket": {"name": "door_frame", "at": ["width / 2", 0, 0.12]}}
```

A socket name is an identifier, and may be a reserved word or name,
since it never appears as a name in an expression: `in` and `out` are
the sockets `repeat` uses (§7.21.4). Socket names and asset `as` names
appear only inside strings, so they never clash with global or local value
names (the clash rules of §7.2.3 and V-05 don't apply to them).

**Ids.** A socket's id is its name for a `socket` statement, and
`as.name` for an asset's socket, where `as` is the asset's instance name
(an asset without `as` places sockets no one can name). Like part ids
(§7.15.7), ids are prefixed by the instance names of the `use`
statements they run under: `bay_1/c1.out`. A reference (`onto`,
`socket()`) is read in its own scope, so inside a component `c1.out`
means that instance's `c1.out`. A reference may reach into a `use` of the
same scope whose `as` is literal: `bay_1/c1.out`.

**Which socket.** A reference names the socket with that id placed
**most recently** in the build. So inside a `for`, `"onto": "seg.out"`
chains each piece to the one before. A reference to an id not placed yet
is a run-time error at the statement, naming the reference. At load, a
reader checks that the scope can place the id at all: a `socket`
statement with that name, or an asset with that `as` and that socket,
in the same component body or build, or through the named `use`
(V-13, V-24). For an asset placed with `choose`, the reference is accepted
at load when any candidate has the socket; if the candidate chosen lacks
it, the socket is not placed, which is the run-time error above.

**Mating.** `attach` names a socket of the asset being placed, and
`onto` a placed socket. The reader places the asset so the two origins
coincide, the two +Z axes point in opposite directions and the +Y axes
match,
then turns it by `spin` (radians, or `spin_deg` in degrees) about the placed socket's +Z
(right-handed). With A the attached socket's frame in the asset and B
the placed socket's frame, the asset's transform is

```text
B · Rz(spin) · Ry(180°) · S(s) · A⁻¹
```

where s is the current transform's scale factor and S(s) scales by it
uniformly. The current transform's rotation, translation and mirror are
not used.

```json
{"asset": {"name": "wall_corner", "as": "c1"}},
{"asset": {"name": "wall_straight", "as": "w1", "attach": "in", "onto": "c1.out"}}
```

**Reading sockets.** `socket(id)` returns a placed socket's origin, and
`socket_dir(id)` its +Z, as vec3s in the coordinates of the statement
that evaluates them (through the inverse of the current transform;
`socket_dir` is normalized after it). `id` is a quoted string literal,
like `texture()`'s name. So fill geometry can reach exactly from one
piece to the next:

```json
{"box_between": {"from": "socket('trim_a.out')", "to": "socket('trim_b.in') + vec3(0, 2.4, 0.02)",
                 "color": "texture('plaster')"}}
```

#### 7.21.4 `repeat`: as many copies as fit

A `repeat` statement (§6.1.18) fills the straight run from `from` to `to`
with copies of a piece, chained socket to socket. A piece has the
sockets `in` and `out`, and its **length** is their distance (V-25).

```json
{"repeat": {"name": "rail_segment", "from": "socket('end_a.out')", "to": "socket('end_b.in')",
            "fit": "stretch", "max_stretch": 0.1, "as": "rail"}}
```

With D = |`to` − `from`| (in the current coordinates), L the length and
d the unit direction from `from` to `to`:

- **`fit: "stretch"`** places n = round(D / L) copies (half away from
  zero), and stretches each along d by s = D / (n · L), clamped to
  1 ± `max_stretch`. Copy k's `in` socket sits at
  `from` + d · k · s · L. When s was clamped, the run ends short of `to`
  or past it.
- **`fit: "gap"`** places n = floor(D / L) copies at their own length,
  with equal gaps (D − n · L) / (n − 1) between them; a single copy is
  centred on the run.
- n = 0 (D < L / 2 for `stretch`, D < L for `gap`) places nothing.

Each copy is turned so that its `in` socket's +Z points back along −d,
its `out` socket ahead, and its `in` socket's +Y along `up` made square
to d (left out: +Y, or +Z when d is within about 25° of the Y axis, as
for `extrude`). An `up` parallel to d is a run-time error at `.up`. L is
the same for every candidate (V-25), so it is read from the first. A piece whose `out` socket doesn't lie straight ahead of
its `in` socket is still placed by its `in` socket. A copy's transform
is

```text
T · F_k · Sz(s) · Ry(180°) · A_in⁻¹
```

with T the current transform, F_k the frame at copy k's `in` point with
axes (up × d, up, d), Sz(s) the stretch along its Z (s = 1 for `gap`)
and A_in the `in` socket's frame. This stretch, at most 1 ± 0.5, is the
only non-uniform scale an asset can get outside slicing; the current
transform T must itself scale uniformly (§7.21.2).

`copy` names a local whose value is the copy's number, 0 first, while
that copy's `index`, `materials` and `morph` are evaluated. So
`"index": "floor(random(['bay', copy]) * 3)"` gives per-copy variety, and a
copy keeps its piece when the count changes (DD-26). The copies keep none
of the asset's animations (§7.25.5) and take none of its `roles`
(§7.24.1): each copy would repeat the same names. Each copy's sockets
are placed with ids `as.in`, `as.out`, …; after the `repeat`, a reference
to `rail.out` names the last copy's (most recent wins, §7.21.3).

#### 7.21.5 Slicing: stretch only marked zones

A sculpt has one size. Slicing changes the size of an asset by stretching
only zones the artist marked, so everything outside them keeps its exact
shape and only moves. Artists keep the zones free of sculpted detail.

```json
"assets": {
  "counter": {"gltf": "kit/kitchen.glb", "node": "counter",
              "slice": {"x": [-0.35, 0.35]}, "stretch": [0.5, 6]}
},
"build": [
  {"asset": {"name": "counter", "size": {"x": "width"}}}
]
```

An asset placed without `size` is not sliced. For each axis in the statement's `size`, with the zone [a, b], its length
Z = b − a, the asset's extent E along that axis (§7.21.1) and the target
size T:

- the zone's factor is f = (T − (E − Z)) / Z, clamped to `stretch`, so
  a size that needs more is clamped, like §7.8;
- zone membership is inclusive, a ≤ x ≤ b, and a vertex coordinate x along
  the axis, in the asset's frame, becomes
  x + (f − 1) · (clamp(x, a, b) − c), with c = (a + b) / 2: inside the
  zone it scales about the zone's centre, outside it moves with its end;
- normals are multiplied by the inverse transpose of the zone's scale and
  normalized, and tangents (`xyz`) by the scale and normalized, `w` kept,
  only inside the zone; outside, both are unchanged, so normal maps stay
  right there;
- morph target position offsets inside the zone are multiplied by f along
  the axis; texture coordinates, colours and everything else are kept, so a tiling
  material in the zone stretches with it (OI-18);
- socket origins move by the same rule; their axes are unchanged.

An axis the statement doesn't give keeps the asset's own size. Every
level of detail is sliced with the same zones and factors. A
`size` on an axis the asset doesn't slice is an error at load (V-24).

#### 7.21.6 Variants, material factors and morph weights

Parameters change an asset's look in three controlled ways, each with a
fixed impact class (§7.19). None of them edits the asset's geometry
directly.

```json
{"asset": {"choose": ["door_oak", "door_steel", "door_glass"], "index": "door_style",
           "at": [0, 0, 0.12],
           "materials": {"paint": {"baseColorFactor": "door_color"}},
           "morph": {"open": "door_angle / 90"}}}
```

- **`choose` and `index`** pick one of a literal list of declared assets.
  `index` is truncated toward zero and clamped to the list. Every
  candidate is loaded and checked at load, so every key of the statement
  must suit every candidate (V-24).
- **`materials`** sets factors of the asset's own glTF materials, by
  material name. Only these fields, and only on a material that has them
  (an extension's field only where the material uses that extension):

  | field | value |
  |---|---|
  | `baseColorFactor` | colour, with alpha |
  | `emissiveFactor`, `KHR_materials_sheen.sheenColorFactor`, `KHR_materials_specular.specularColorFactor`, `KHR_materials_volume.attenuationColor` | colour, alpha ignored |
  | `roughnessFactor`, `metallicFactor`, `occlusionTexture.strength`, and every other `…Factor` field of a `KHR_materials_*` extension | number, clamped to 0–1 |
  | `normalTexture.scale` | number |
  | `KHR_materials_emissive_strength.emissiveStrength`, `KHR_materials_volume.thicknessFactor`, `KHR_materials_volume.attenuationDistance` | number, clamped to ≥ 0 (`attenuationDistance` to ≥ 1e-6) |
  | `KHR_materials_ior.ior` | number, clamped to ≥ 1 |

  A material has these fields: `baseColorFactor`, `emissiveFactor`,
  `roughnessFactor` and `metallicFactor` always (glTF's defaults when
  the file leaves them out); `occlusionTexture.strength` and
  `normalTexture.scale` only when that texture is present; an extension's
  fields only when the material has that extension object, any
  `…Factor` field of a `KHR_materials_*` extension counting. Colour
  channels are clamped to 0–1, then converted to linear.

  A value replaces the material's factor. glTF multiplies a factor by its
  texture, so `baseColorFactor` tints the base colour texture, as a JIG
  tint does (§7.6). Colours are given in sRGB and converted to linear as
  Appendix G.2 says.
- **`morph`** sets the weight of the asset's own morph targets, by the
  names in its meshes' `extras.targetNames`. A weight applies to every
  mesh of the subtree with a target of that name. Weights must be
  finite; they aren't clamped, as glTF allows any weight. A target the
  statement doesn't name keeps the mesh's own default weight.

A material or target name the asset's level 0 doesn't have is an error at
load. On other levels a name that is missing is skipped.

#### 7.21.7 Levels of detail

An asset brings its own levels, made by the artist, and `lod` (§7.9)
picks one. A reader never reduces an asset itself. It finds the levels in
this order:

1. `lods`: one node per level, level 0 first, in place of `node`;
2. otherwise the named node's `MSFT_lod` extension, the glTF extension
   for this: the node itself, then the nodes in its `ids`;
3. otherwise the one node serves every level.

With fewer levels than `lod` asks for, the reader uses the last one.
Sockets, extents and the names `materials` and `morph` are checked
against come from level 0, so where an asset sits and what attaches to it
never depend on `lod`.

#### 7.21.8 Kit materials

A texture may take a material from a glTF file in place of an image
(§6.1.5): a **kit material**, so that plain JIG geometry between sculpted
pieces matches them.

```json
"textures": {"plaster": {"gltf": "kit/walls.glb", "material": "plaster", "size": [1, 1]}}
```

It is a texture value like any other: `"color": "texture('plaster')"`
on any primitive. Its texture coordinates come from `fit`, `size`,
`align`, `origin` and `offset` as §7.6 says, written to `TEXCOORD_0`;
every texture of the material must read `TEXCOORD_0` (V-26). The
material's own factors, maps and extensions are kept; the tint
multiplies its base colour as `COLOR_0` does (§9.1), its alpha counting
only when the material's `alphaMode` isn't `OPAQUE`, as in glTF.
`roughness` and `metallic` options replace the material's factors, as
they replace a surface's (§7.17); the surface kind's own roughness and
metalness don't apply. `emissive` and `emissive_strength`, when given,
replace the material's `emissiveFactor` and emissive strength; when not
given, the material's own emission stays. Each replaces only its own
field: a given black `emissive` sets `emissiveFactor` to `[0, 0, 0]`, a
given strength of 1 is written as `emissiveStrength` 1 (the extension
stays), and a strength given without `emissive` changes only the
strength. A kit material's images may be PNG, JPEG or KTX2. A kit
material's glTF file follows the same `extensionsRequired` allow-list as
an asset's (§7.21.1, V-23), and V-11's image checks cover the images the
used materials and kit materials reference.

### 7.22 Physics

With its geometry, every build gives the physics a host's engine needs
(REQ-10): for each part, its **colliders**, **mass properties**,
**physical material**, **motion type**, **collision filter** and
**joint**. JIG takes the meanings, units and defaults of the Khronos glTF
physics extensions, `KHR_implicit_shapes` and `KHR_physics_rigid_bodies`
(DEP-09), so a bake writes them unchanged (§9.1). Every reader gives the
same physics within §8.3's tolerances. How a host steps the simulation,
which gravity it uses and how its engine approximates the shapes are its
own business; neither extension promises engines agree.

Physics comes from the **coarsest level of detail**, `lod` 2, whatever
level is shown, so it does not change with the detail (DD-35). A reader
builds that level once and reuses its physics while only `lod`
changes; when the shown level is 2, it is the same build. So write
physics and placement statements outside any test that reads `lod`; a
validator warns about one (V-38).

#### 7.22.1 Bodies and motion

Each part with a `joint` (§7.22.6) starts a **body**; the root part
`body` starts one too. A part without a `joint` is **welded** to its
parent part: its colliders belong to its parent's body. A body's colliders
are those of its part and of every part welded to it, in the body's part
space.

A body's **motion type** (§6.3) is its joint's `motion`, or for the root
body the `physics` block's `motion`, `"static"` when left out. A joined
part's body is `"dynamic"` unless its joint says otherwise. A host may
override any body's motion type when it places the model.

*Differs from glTF:* in Khronos a node with its own motion is a free
body. In JIG a part moves on its own only through a `joint`; a free
body is a joint whose six axes are all `true` (free).

#### 7.22.2 Colliders

Each primitive **infers** its simplest collider, in its part:

| primitive | collider |
|---|---|
| `box`, `box_between` | a box: the same centre, size and rotation |
| `cylinder`, `cylinder_between` | a cylinder: the ideal round shape, whatever its `sides` |
| `sphere` | a sphere |
| `capsule` | a capsule |
| `ellipsoid` | a sphere when its three radii are the same size and the transform keeps it one; otherwise the hull; none when a radius is 0 |
| `chain_loft` | for each part that is some vertex's **strongest bone** (its largest weight, the lower joint index on a tie, G.22), the convex hull of those vertices, in that part and its space; a bridge strip's vertices likewise. So a sleeve's collider splits between the upper and the lower arm. A part that runs a `collider` statement gets none of these |
| every other primitive | the convex hull of its points (Appendix G.14) |
| an asset (§7.21) | the asset's own `KHR_physics_rigid_bodies` colliders and triggers, read as below; without any, the convex hull of its placed level's positions |

A box, cylinder, sphere or capsule stays that shape only when the
current transform keeps it one: a box when the transform maps its edges
to three perpendicular directions, the round shapes when it scales
their cross-section evenly. Otherwise the collider is the convex hull of
the shape's **fixed point set** (Appendix G.14), whatever its `sides`, as
the round shape it replaces doesn't depend on them; the same holds for a
`collider` statement of those shapes. An ellipsoid that isn't kept a
sphere takes the hull of the sphere's fixed point set for radius 1,
scaled by `radii`, turned by its `rotation` and moved to `center`. A degenerate
primitive (§7.16), and a shape with a size of 0, infers no collider.

The **`collider` statement** declares a collider in the current part
instead. `shape` names a Khronos implicit shape, or `hull` for the
convex hull of `points`; the other keys are the arguments of the JIG
primitive of that name (`center`, `size` and `rotation` or
`rotation_deg` for a box; `center` and `radius` for a sphere; `base`,
`radius`, `radius_end` and `height` for a capsule or cylinder), placed
by the current transform:

```json
{"part": "seat", "do": [
  {"collider": {"shape": "box", "center": [0, 0.45, 0], "size": ["width", 0.06, "depth"]}},
  {"use": "seat_cushion"}
]}
```

When a part runs any `collider` statement, the reader infers no
colliders for that part's own primitives; parts welded to it keep
theirs.

A collider with `"trigger": true` reports when something overlaps it
and does not collide, as a Khronos trigger. It adds no mass.

**An asset's own physics** is read from its placed level (§7.21.7): the
level's node and every node below it. An asset **has its own physics**
when a node there has a `KHR_physics_rigid_bodies` `collider` or `trigger`
that builds a collider as follows; it then has no inferred hull, and a
part's `collider` statement replaces these colliders as it does the
inferred ones. Nodes of other levels are not read.

- Each becomes a collider, with the asset's own placement (scale,
  stretch, mirror), in the body of the part that places the asset. The
  asset's `motion` (apart from its `mass`, below) and its joints are
  ignored: a JIG part moves only through its own `joint` (§7.22.1).
- An implicit shape (`KHR_implicit_shapes`) is the JIG shape of that
  type, with Khronos's defaults for a missing value: a box `size`
  [1, 1, 1], a sphere `radius` 0.5, a capsule or cylinder `radiusBottom`
  and `radiusTop` 0.25 and `height` 0.5. Under a transform that doesn't
  keep it that shape it is a hull, as above.
- A `mesh` geometry, `convexHull` or not, is the convex hull of its
  positions: a triangle mesh is not kept as one.
- In a sliced asset (§7.21.5) every collider is the hull of its points
  (Appendix G.14), moved by the slice as the asset's positions are.
- A trigger that has `nodes` (a compound trigger) has no geometry and is
  skipped, as is a collider whose shape or mesh index doesn't resolve.
- Friction, restitution and their combine modes come from the collider's
  `physicsMaterial`, with Khronos's defaults for missing values (0.6, 0.6,
  0, `average`). Without one, the collider takes the whole physical
  material in effect where the asset is placed (§7.22.3). Its density is
  always that material's, except as follows.
- A node's `motion.mass` sets only the density of the colliders (not
  triggers) it owns, those below it and not below a nearer node with a
  `motion`: density = `mass` ÷ their total volume, in the asset's own
  units, so a scaled asset keeps its density. The body's mass is still the
  sum of volume × density (§7.22.3).
- `collisionFilter` becomes the collider's filter (§7.22.5).

#### 7.22.3 Physical materials and mass

Each collider has a **physical material**: density, static and dynamic
friction, restitution and their combine modes (§6.1.22), with Khronos's
meanings. It takes the values of its surface kind (§7.15.4) from this
table, replaced by any `physics_material` in effect where its primitive
or `collider` statement runs:

| surface | density kg/m³ | static friction | dynamic friction | restitution |
|---|---|---|---|---|
| `plain`, `paint` | 600 | 0.6 | 0.6 | 0 |
| `wood` | 600 | 0.5 | 0.4 | 0.3 |
| `metal` | 7850 | 0.7 | 0.6 | 0.2 |
| `rope` | 1100 | 0.8 | 0.7 | 0.1 |
| `glass` | 2500 | 0.9 | 0.4 | 0.5 |
| `stone` | 2600 | 0.7 | 0.6 | 0.2 |
| `brick` | 1900 | 0.7 | 0.6 | 0.2 |
| `slate` | 2800 | 0.6 | 0.5 | 0.2 |
| `gravel` | 1600 | 0.8 | 0.7 | 0.05 |
| `grass` | 300 | 0.4 | 0.35 | 0.05 |
| `leaves` | 200 | 0.5 | 0.4 | 0.05 |

Both combine modes default to `average`. `plain` and `paint` are not
materials: they take Khronos's friction and restitution defaults and the
density of light timber. The table rounds typical published values
(OI-21). A `collider` statement's collider uses the block's surface.

`physics_material` is a block statement, like `surface`: it sets the
given values for the geometry and colliders that follow in its block,
restored at the end of the block (§2.3). A primitive's own
`physics_material` option sets them for that primitive.

```json
{"physics_material": {"density": 450, "static_friction": 0.45}},
{"box": {"center": [0, 0.4, 0], "size": [0.6, 0.02, 0.4], "color": "#a07850", "surface": "wood"}}
```

A body's **mass** is the sum over its colliders of volume × density,
and its **centre of mass** and **inertia** follow from the same solids
(Appendix G.15), in the body's part space. Overlapping colliders count
their shared volume twice, as JIG solids overlap freely; give `mass`
when that matters. A collider with no volume (a flat hull) and a
trigger add nothing. `mass` in a `joint`, or in the `physics` block
for the root body, replaces the computed mass: the centre of mass stays
and the inertia scales with it.

A `dynamic` body whose colliders have no volume must give `mass`; it is
a run-time error otherwise. Its centre of mass is then the centre of its
colliders' bounds and its inertia that of a solid box filling them. A
reader never gives a mass of 0, which Khronos reads as infinite.

#### 7.22.4 Motion types

`static` bodies collide and never move. `dynamic` bodies are moved by
the simulation. `kinematic` bodies are moved only by the host (by the
part's pose or the model's placement) and act on others as if of
infinite mass. These are Khronos's meanings: a Khronos node with a
collider and no motion is `static`; `isKinematic` gives `kinematic`.

#### 7.22.5 Collision filters

A **collision filter** is Khronos's: `systems`, the collision systems a
body or collider belongs to, and at most one of `collide_with` and
`not_collide_with`, lists of systems; a filter with neither collides
with every system. Two colliders collide unless either's filter rules
the other out. System names are free; the host maps them to its
engine's layers. A body's filter comes from its `joint`, or the
`physics` block for the root body, else its parent body's; a
`collider` statement's `filter` replaces its body's for that collider.

```json
"physics": {"motion": "static", "filter": {"systems": ["furniture"], "not_collide_with": ["debris"]}}
```

#### 7.22.6 Joints

A part's `joint` joins its body to its parent part's body at the
part's pivot, in the part's frame (§7.15.7):

```json
{"part": "lid", "pivot": [0, "height", "-depth / 2"], "pose_deg": ["-lid_open", 0, 0],
 "joint": {"limits_deg": [[-110, 0], false, false], "drive": {"stiffness": 4, "damping": 0.5}},
 "do": [ … ]}
```

- **Limits.** `limits` (radians) or `limits_deg` (degrees, §5.1) give,
  per rotation axis X, Y and Z, `false` (locked), `[min, max]` (free
  between them) or `true` (unlimited); not `null`, which no JIG value is
  (V-04). `slide` gives the same for
  movement along X, Y and Z, in metres. Rotation angles are measured as
  the pose is (Z first, then X, then Y), from the part's frame without
  its pose. A joint that gives none locks every axis: the part moves
  with its parent but is a body of its own, with its own `motion`,
  `mass` and `filter`. `joint` may be `false` instead of an object: there is
  then no joint, and the part is welded to its parent as a part without
  a `joint` is (§7.22.1). `true` is `{}`.
- **`when`.** `"when": expression` in the joint object gives a bool,
  evaluated when the part is built: `false` means no joint (the part is
  welded, as for `"joint": false`), `true` the joint as written. An
  expression that gives anything but a bool is a run-time error at
  `build[n].joint.when`. A string `"joint": "expression"` is the
  shorthand for `{"when": "expression"}`; its error path is
  `build[n].joint`. Every key of the joint is checked (V-31, V-13) whether
  or not `when` is true.
- **Soft limits.** With `stiffness` (and `damping`), every limit of the
  joint is a spring instead of a stop, as Khronos's limits.
- **Drive.** A `drive` pulls the free rotation axes towards the pose,
  and the free slide axes towards 0, with Khronos's formula: force =
  `stiffness` · (target − position) + `damping` · (`velocity` −
  current velocity), at most `max_force`. `velocity` (rad/s, or
  `velocity_deg` in °/s) turns a drive into a motor, such as a wheel's.
  `mode` is `force` (the default) or `acceleration`. `stiffness` and
  `damping` default to 0: a drive with `stiffness` 0 and a `damping`
  pulls towards no target and only damps, towards `velocity`.
- **Breaking.** Above `break_force` newtons the joint detaches and its
  body moves alone. Khronos has no such field; a bake writes it in
  `CANWELL_jig`.
- **Collision.** A joined part does not collide with its parent part's
  body unless `collide` is true (Khronos `enableCollision`).

Limits are checked when the joint is built: `min` > `max` is a run-time
error.

#### 7.22.7 Output

A reader gives, with each build's parts (§7.15.7):

- per body: its part, its parent body, its motion type, mass, centre of
  mass and inertia tensor (in its part space), filter and joint;
- per collider: its body, shape and arguments in the body's part space,
  physical material, trigger flag and filter.

These are host data like the geometry. A host builds its engine's
bodies, shapes and joints from them; a bake writes them as glTF (§9.1).
A part with a role (§7.24) may have a joint too; both are output.

### 7.23 Placement

A model may say how it is placed and used (REQ-13): the space it needs
kept free, where people use it, what it is mounted on, what may stand on
it, the hole it cuts in a wall, the floor it blocks, what it is, how it
snaps to its neighbours, how it looks on a floor plan, its lights, its
effects and what a player can select. A room builder places models with
this; placing them, pathfinding and judging a layout stay the host's.

Placement data, like physics, comes from the coarsest level of detail
(§7.22), so a layout never changes with the detail shown, and every
reader gives the same data within §8.3's tolerances. The statements make
no geometry. Roles, users, groups, tags, socket types, effect names and
filter systems are **free names** the host interprets; the spec fixes a
list only where it changes how a reader builds (DD-37).

#### 7.23.1 Clearance

A **clearance** is a volume the model reserves. It takes the meaning of
IFC's `Clearance` shape representation: it must not overlap another
model's body, and may overlap another model's clearance, so two chairs
can share the space between them. Its `purpose` (§6.3) says why, and its
`level` whether it is `required` (a door can't open without it) or
`recommended` (comfortable space); the host decides whether to block a
placement, warn, or ignore it.

```json
{"clearance": {"shape": "box", "center": [0, 0.6, 0.55], "size": [0.6, 1.2, 0.5], "purpose": "use",
               "point": [0, 0, 0.45], "facing": [0, 0, -1], "role": "sit", "user": "patient", "group": "bench"}}
```

A `use` clearance may carry a **use point**: `point`, where a person
using the model goes (their feet), `facing`, the way they face, and free
names for their `role` (`sit`), `user` (`patient`) and `group`. Use
points with the same group belong together; the group's capacity is its
number of points.

A use point may also offer **actions** (§7.26): `actions`, a list of
action names. It then needs `point` and `facing`, which give the frame
the actions' targets are written in (§7.26.1). The actions are the
model's data, not the clearance's: the clearance volume and the use
point are as without them.

A part with a joint (§7.22.6) that leaves any rotation or slide axis
limited or free **infers** a `movement`, `required` clearance: the
bounding box, axis-aligned in its parent part's frame, of its body's
colliders swept over the whole range of its limits (Appendix G.16). The
part infers none only when it itself runs a `clearance` statement with
purpose `movement`: that one stands in for the swing. Clearances of
other purposes (`use`, `access`, `maintenance`) add to it. Space a
whole model needs when moved, such as a chair pushed back, is a declared
`movement` clearance. A clearance declared in a moving part
stays where it is at rest pose. Clearances don't count in the model's
size or bounds, and are not physics: they don't collide, add no mass and
are not triggers.

#### 7.23.2 Mounting, the wall side and supports

`placement.mounts` lists where the model may go: `floor`, `wall`,
`ceiling` or `surface` (on another model's support), each with an
optional socket (§7.21.3) as its contact frame. Without a socket the
contact is the model's origin (floor, surface), the middle of the back
(−Z) face of its bounds (wall), or the middle of their top (ceiling).
Without `mounts` a model stands on the floor.

For a `wall` mount through a socket, the socket's origin sits on the
wall's room-side face and its +Z points into the wall, as the back of a
cabinet does. The host puts that face where the model goes.

A model's **back** is its −Z side, the side that goes against a wall;
`wall_gap` is the distance it keeps from the wall. A model that has an
`opening` that cuts the wall (§7.23.3) ignores `wall_gap`: the opening
sets how it sits in the wall.

A `support` declares a flat area, facing up, that others may stand on:
a rectangle (`center`, and `size` along x and z) or a polygon of
`points` on one level. `clear_height` is the free height above it (a
shelf), or none for open space (a table top).

#### 7.23.3 Walls, openings and passages

`wall` is a host input like the size (§8.1): the thickness of the wall
the model is mounted on. A model that reads it declares the `wall`
block with its `default`, `min` and `max`; its geometry, such as a
door frame lining the wall, may follow it.

An `opening` declares a volume the host subtracts from the wall the
model is mounted on, as IFC's `IfcOpeningElement`, with the clearance
shapes. Any model may declare one, but it cuts a wall only when the
model is mounted on one (a `wall` mount, §7.23.2); otherwise it cuts
nothing. `"passage": true` makes it a way through for pathfinding,
whether or not there is a wall (a gate, a turnstile, an arch), and a
`passage_filter` (a collision filter's form, §7.22.5) says who may use
it; without one, anyone may. Passage systems are their own list of
names, apart from physics' collision systems.

```json
"wall": {"default": 0.2, "min": 0.08, "max": 0.6},
```
```json
{"opening": {"shape": "box", "center": [0, 1.05, 0], "size": [0.9, 2.1, "wall + 0.02"], "passage": true,
             "passage_filter": {"systems": ["door"], "collide_with": ["staff"]}}}
```

#### 7.23.4 Navigation footprint and plan symbol

A reader gives a model's **navigation footprint** for a height band the
host asks for (the default is 0.05–2 m): for each collider that reaches
into the band, the outline, seen from above, of its part inside the
band, as a convex polygon in model space (Appendix G.17). The footprint
is the list of these polygons; their union is the host's. A part that
runs a `footprint` statement gives its points instead, as one polygon.

Its **plan symbol** (IFC's `FootPrint`) is the footprint for the full
height, plus an arc for each joint that turns about an axis within
about 25° of vertical: centred on the pivot, through the part's farthest
collider point, from the lower limit to the upper one. A part that runs
a `plan` statement gives its points instead. A plan angle runs
right-handed about +Y from +X, so a positive angle heads towards −Z.

#### 7.23.5 Tags and socket types

`placement.tags` are free names saying what the model is (`bed`,
`desk`, `medical`), so a host's rules can ask for one.

A socket may give a free `type`. A host may snap two sockets of the same
type face to face, as `attach` and `onto` mate them (§7.21.3):
counters side by side, corner pieces.

#### 7.23.6 Lights and effect zones

A `light` places a light in the current part with
`KHR_lights_punctual`'s types (§6.3), keys, units and falloff, and a
host shows it as that extension's punctual light:

| Key | Meaning | Allowed |
|---|---|---|
| `at` | Where it is, in the part's frame (m) | |
| `direction` | Where it shines, in the part's frame; normalised | not zero |
| `color` | sRGB, as every JIG colour; channels clamped to 0–1, alpha ignored | |
| `intensity` | Candela for `point` and `spot`, lux for `directional`; 0 is off | ≥ 0 |
| `range` | Metres, where the light has faded to nothing; none is infinite. Not on a `directional` light | > 0 |
| `cone` | A spot's inner and outer angle from its axis, radians (`cone_deg` in degrees) | 0 ≤ inner < outer ≤ π/2 |

A `directional` light has no place and no reach: it ignores `at`, and
`range` on it is an error at load (V-34). A value outside its range is a run-time error at the key
(§10.1), as a negative density is (§7.22). Every key is a value, so
parameters may drive it, and a lamp can change colour, dim or switch
off. A light is in the part's frame, so it moves with the part: its
`pivot`, `pose`, joint and clips (§7.25). The light of a model comes
from the level-2 build, as all placement data (§7.23). A glTF asset's
own lights are not part of it (§7.21.1): a reader drops them, and a
lamp made from an asset gives its light with a `light` statement.

An `effect` is a volume, with the clearance shapes, a free `name`
(`warmth`, `comfort`) and a `strength`; what it does and how it falls
