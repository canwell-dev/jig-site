off are the host's.

#### 7.23.7 Selection

A model is selectable as a whole. A part with `"selectable": true` is
selectable on its own, such as a drawer or a control panel. A bake marks
such a part's node with `KHR_node_selectability` (§9.1).

#### 7.23.8 Assets

A glTF asset may carry supports, clearances, openings and effects as
nodes named `support_`, `clearance_`, `opening_` and `effect_`
followed by a name, as it carries sockets (§7.21.3). Each takes its
node's mesh bounds as its shape (a box, or for a support its top face),
and its other keys from the node's glTF `extras`, named as in the
statement (`{"purpose": "use", "role": "sit"}`). A clearance node
without a purpose is `use`.

#### 7.23.9 Output

A reader gives, with each build: per part, its clearances (shape,
purpose, level, use point), supports, openings (and passages), effects,
lights and `selectable`; for the model, its mounts, wall gap, tags,
socket types, plan symbol, and the navigation footprint for the band the
host asks for.

A clearance's, opening's or effect's shape is given as a collider's
(§7.22.7): a box has a `frame` (a transform in the space of the part
that holds it) and a `size`. An inferred clearance (§7.23.1) is held by
the parent part, names the jointed part it comes from (`from`) and is
marked `inferred`; its box has the identity rotation, so its `frame` only
places the box's centre.

### 7.24 Characters

A document can say that its model is a **character**: its parts, and the
bones of the skinned assets it places, form one **skeleton**, and each
bone may carry a **role**, a name from an outside naming scheme such as
VRM's humanoid bones. A host can then map the skeleton to its own, an
engine's humanoid profile for instance, and play animation made for that
profile (REQ-14). Roles are data about the model: they change no
geometry, physics or placement (§7.19).

```json
{"character": {"scheme": "vrm1_humanoid"},
 "build": [
   {"part": "hips", "role": "hips", "pivot": [0, 0.95, 0], "do": [ … ]},
   {"for": "side", "in": ["left", "right"], "do": [
     {"part": "{side}_upper_arm", "role": "{side}UpperArm", "pivot": ["side == 'left' ? 0.2 : -0.2", 1.45, 0], "do": [ … ]}
   ]}
 ]}
```

#### 7.24.1 Declaring a character and naming bones

- **`character`** (§6.1.26) is a top-level object that gives the naming
  `scheme` and the reference pose, `t_pose` or `a_pose` (§7.24.2). A document has
  at most one character, because it has at most one `character` key.
  Only the document being built declares it, and also `clips`,
  `expression_map` (§7.25) and `actions` (§7.26): those of an imported
  document are ignored,
  as an import brings only constants, functions, components, textures
  and assets (§7.4). A library component that names roles serves the
  character of the model that uses it.
- **`role`** on a `part` (§6.1.12) is a **template**, written like a part
  id (§7.15.7): `{expression}` is replaced by the value as `str()` prints
  it. It is evaluated after the part's id, `pivot` and `pose`. The
  result is the part's role, a non-empty string. It is not prefixed by
  `use` instance names: a role is the scheme's name, not a part id. The
  root part `body` has no `role`; the figure's `hips` is a part inside it.
- **`roles`** on an asset (§6.1.16) maps a role to the name of one node of
  the asset's subtree. It names the asset's own bones, so a bought
  skinned figure joins the character. Each placement by an `asset`
  statement (§7.21.2) takes the roles, on its own copy of the node. The
  copies a `repeat` places take none (§7.21.4).
- **One role, one bone.** A role given twice in one build is a run-time
  error at the second one's path (`build[3].role`, or, for an asset's
  roles, its `asset` statement, `build[4].asset`). A part has one role; an
  asset's `roles` may give one node several.
- **`actions`** in `character` (§6.1.33) changes the targets of other
  models' actions for this character's body, relative to the model's
  targets (§7.26.12). It is not the document's own `actions` (§7.26.1),
  which a use point of this model offers.
- **`grips`** in `character` (§7.24.6) says which point of each hand and
  foot a host puts on a target.
- **A part with a role may also have a joint** (§7.22.6). The bake
  writes both (§9.1); JIG builds no ragdoll from them (OI-26).
- **Where the rules are checked.** `role` and `roles` need `character`
  (V-39). An asset's `roles` is checked at load in every document. A
  part's `role` is checked at load in a document that has a `build`; in a
  library, which doesn't know its model, it is checked when the part
  runs, as a run-time error at the part's `role`. The same holds for the
  clip names an `animate` uses (V-42).
- **Names.** A role is any non-empty string. Whether the scheme defines
  it is a warning, not an error (§7.24.3).

#### 7.24.2 Skeleton and reference pose

Every part of a build is a bone, the root part `body` too. A bone's
origin and axes are its part's pivot and axes (§7.15.7), and the bones
are joined as the parts are. A part's geometry is bound **rigidly** to
its bone: every vertex follows that bone with weight 1, except blended
geometry (§7.15.7, §7.16.1), whose vertices follow up to four bones. A skinned asset
keeps its own skin and joints (§7.21.1); they are not bones of the
character's skeleton, but the nodes `roles` names become roles of it.

The **reference pose** is the model with every part's `pose` 0 and no
`move` (§7.25.2), and every placed asset's nodes as its file places them:
the pose the author models the figure in, and the pose a host retargets
from. The character's `reference_pose` says which pose it is:

- **`t_pose`**, the default: the figure stands on +Y facing +Z (§5.1),
  feet on the floor, legs straight down and arms straight out sideways
  along ±X.
- **`a_pose`**: the same, but with the arms lowered by whatever angle the
  rig has. Only for a character whose arms are a skinned asset's bones
  (§7.21.1): the roles `leftUpperArm`, `rightUpperArm`, `leftLowerArm`
  and `rightLowerArm` are asset nodes, under the scheme `vrm1_humanoid`
  (V-39).

A reader does not check that the figure is in the pose it states.

**The T-pose of a figure.** Bone clips (§7.26.4), a phase's starting
pose (§7.26.7), target rotations (§7.26.3) and grips (§7.24.6) count
from the figure's **T-pose**, so an action means the same on every
figure. A `t_pose` character's T-pose is its reference pose. An `a_pose`
character has an **arm offset** D_s per side s (`left`, `right`; G.21):
the rotation, in the figure's axes, that takes the T-pose arm direction
(+X for the left arm, −X for the right) the shortest way to the rig's
arm direction, from the `{s}UpperArm` joint to the `{s}LowerArm` joint
at the reference pose. Its T-pose is its reference pose with each upper
arm, and everything under it, turned by D_s⁻¹ about the upper arm's
joint. A host applies the offsets as §7.26.7 says. The asset's own
animations (§7.25.5) play on the rig as its file wrote them.

A figure built from JIG's own solids is modelled in the T-pose and stays
`t_pose`. A part's own static `pose` (§7.15.7) sits on top of the
reference pose: a document that sets one builds a pose that is not the
reference pose, and the reference pose is still the one with every
`pose` 0. So a figure that should *look* like an A-pose lowers its upper
arms with a static pose, here 75° down, 15° from the body (+X is the
figure's left, G.4):

```json
{"part": "{name}_upper_arm", "role": "{name}UpperArm", "pivot": ["s * 0.15", 0.9, 0],
 "pose_deg": [0, 0, "-s * 75"], "do": [ … ]}
```

No bone's own axes are turned to suit a host: the part's frame is the
bone's frame (OI-27).

#### 7.24.3 Schemes

A `scheme` is any non-empty string. A reader checks and a baker maps only
the schemes below; any other scheme is passed on as a name (a robot
under `acme_robot` names its bones freely).

**`vrm1_humanoid`** is the VRM 1.0 humanoid bone set, with VRM's
spelling. A reader checks its roles (V-45): a role that is not in the
table is a warning, and so is a missing required bone.

| Group | Roles |
|---|---|
| Torso | `hips`\*, `spine`\*, `chest`, `upperChest`, `neck` |
| Head | `head`\*, `leftEye`, `rightEye`, `jaw` |
| Legs, for `left` and `right` | `leftUpperLeg`\*, `leftLowerLeg`\*, `leftFoot`\*, `leftToes` (and the same with `right`) |
| Arms, for `left` and `right` | `leftShoulder`, `leftUpperArm`\*, `leftLowerArm`\*, `leftHand`\* (and the same with `right`) |
| Fingers, for `left` and `right` | `leftThumbMetacarpal`, `leftThumbProximal`, `leftThumbDistal`, and for each of `Index`, `Middle`, `Ring`, `Little`: `leftIndexProximal`, `leftIndexIntermediate`, `leftIndexDistal` (and the same with `right`) |

That is 55 roles; the 15 marked \* are **required**. JIG does not check
the hierarchy VRM gives them (a `leftHand` under a `leftLowerArm`).
Godot's `SkeletonProfileHumanoid` uses the same names with a capital
first letter, so a Godot reader maps a role by capitalising it (§7.24.5).

**`vrm1_expressions`** is the scheme of an `expression_map` (§7.25.4). Its
names are VRM 1.0's presets: `happy`, `angry`, `sad`, `relaxed`,
`surprised`, `aa`, `ih`, `ou`, `ee`, `oh`, `blink`, `blinkLeft`,
`blinkRight`, `lookUp`, `lookDown`, `lookLeft`, `lookRight`, `neutral`.
Any other name is a warning (V-45); VRM allows custom expressions, so a
document may still use one.

Khronos takes the same view: a role its scheme does not define is for a
validator to warn about, not to reject (DEP-10).

#### 7.24.4 Output

A reader gives, with each build's parts (§7.15.7), when the document
declares `character`: the `scheme` and `reference_pose`; for an `a_pose`
character, the **arm offsets** D_left and D_right as unit quaternions
(G.21, with w ≥ 0); the **roles**,
in the order they were given, each with its target, a part (its resolved
id) or an asset node (the placement's name and the node's name); and for
every part its **reference rotation**, the rotation of its local
transform with every `pose` 0 (Appendix G.13, as a quaternion); and its
**grips** (§7.24.6), in the order written, each with its role, `at`
(`[0, 0, 0]` when not given) and, when it has a turn, the turn as a unit
quaternion (G.4, G.13, with w ≥ 0). A host builds its skeleton from
these; a bake writes them as glTF (§9.1).

#### 7.24.5 Hosts

Informative. A Godot reader maps a `vrm1_humanoid` character to a
`BoneMap` of `SkeletonProfileHumanoid`, capitalising the roles, and may turn
on the importer's axis and silhouette fixes for it; the model needs no
change for it. Godot's retargeting expects a T-pose facing +Z: a
`t_pose` character is one, and an `a_pose` character's rig keeps its own
rest, with actions played from its T-pose by the arm offsets (§7.24.2,
§7.26.7).

#### 7.24.6 Grips

A target aims a hand or a foot at a bone's joint: the wrist, the ankle
(§7.26.3). Where the hand touches a lever is some centimetres past the
wrist, and how far depends on the hand. A character may say so once, for
its own body, in **`grips`** (§6.1.34): per limb role, the **grip
point** and, optionally, the **grip frame** that a host puts on a target
instead of the joint and the bone's own orientation. Models don't change:
they still aim at joints.

```json
"character": {"scheme": "vrm1_humanoid",
  "grips": {"rightHand": {"at": ["-0.08 * height / 1.7", -0.02, 0]},
            "leftFoot":  {"at": [0, -0.06, 0.1], "rotation_deg": [10, 0, 0]}}}
```

- **Roles.** `leftHand`, `rightHand`, `leftFoot` and `rightFoot` (V-56):
  the effectors a two-bone IK places. `hips` aims at its joint by
  definition, `head` at a point it looks at; neither has a grip.
- **Frame.** `at` and the turn are in the **bone's frame**: the figure's
  axes of §7.26.4 (+X its left, +Y up, +Z its front) turned by the bone's
  turn from its T-pose (§7.24.2), the frame of an attach event's offset
  (§7.26.5). So a grip doesn't depend on the rig's own bone axes: on a
  figure in a T-pose, the right hand's `[-0.08, -0.02, 0]` is 8 cm out
  past the wrist, toward the fingertips, and 2 cm down, at the palm.
- **Point.** The grip point is the bone's origin plus `at` in that frame.
  A host moves it, not the joint, onto a hand or foot target's `at`
  (§7.26.7, step 3).
- **Turn.** The grip frame is the bone's frame turned by `rotation` (or
  `rotation_deg`, Euler angles as a target's, G.4). A target's rotation
  (§7.26.3) is then the grip frame's orientation, not the bone's: zero
  puts the grip frame's axes along the figure's, so the bone turns by the
  target's rotation times the inverse of the grip's turn. A target with no
  rotation leaves the orientation to the solver, and the turn then changes
  nothing.
- **Default.** A role with no grip, and a character with no `grips`, aim
  the joint and the bone's orientation, as without grips.
- **Values.** Each value reads the character's global names (§7.26.1),
  not `t` or `u`, and is evaluated once per build, after the build's
  statements, as part of the build's run: its steps count against the
  build's 1,000,000 (§11), not a run of their own. A value of the wrong type or not
  finite is a run-time error at the value (`character.grips.rightHand.at`).
  A grip of a role the build doesn't give is kept; a host has no bone to
  apply it to.
- **Scope.** A grip applies whenever a host plays a hand or foot target on
  the character: a model's own, or one merged with the character's
  overrides (§7.26.12). It changes no sampled value and no merge.
  Attach events (§7.26.5) still follow the bone's origin, not the grip.

### 7.25 Animation

A document can author **clips**: motion of its parts, written as
expressions of the time `t`, in seconds. A reader samples each clip at a
fixed rate (§7.25.3), so every reader gives the same keys and a bake
writes them as glTF animations (§9.1). JIG describes the motion; playing
it, blending clips and retargeting are the host's. A clip moves parts
and morph weights only: it changes no geometry, physics or placement
(§7.19), and a build holds one variant of the model, so a clip never
changes a parameter (D-81).

```json
{"clips": {"walk": {"length": 1.0, "loop": true}},
 "build": [
   {"part": "left_upper_leg", "pivot": [0.1, 0.9, 0],
    "animate": {"walk": {"pose_deg": ["30 * sin(TAU * u)", 0, 0]}}, "do": [ … ]}
 ]}
```

#### 7.25.1 Clips

The top-level `clips` (§6.1.27) lists each clip's `length`, whether it
loops and whether it is an expression (§7.25.4). A clip name is any
non-empty string without `/`, and not `reference_pose` (§9.1); the one
exception is the form `action/phase`, with which a character document
overrides the bone clip of an action's phase (§7.26.7, V-50). Each phase
of an action is a clip too, named the same way (§7.26.6). The
`length` is a value in seconds from 0.001 to 600, evaluated once per
build after the derived values, with their names (§7.18) and not `t` or
`u`; so a walk cycle can follow a parameter.

A clip that no part animates in a build, because the parts that
animate it are not built there (an untaken `if`, a `lid` the model was
built without) or because the `asset` statement of its only `morph`
channel did not run, is **left out of that build**: it has no output
(§7.25.6), no keys, no animation in a bake and no entry in a bake's
`CANWELL_jig.clips`; an `expression_map` entry that names it is left
out of the map, and an input left with no entries is left out too (V-44
checks the names at load, as before). It is no error and no warning, so
a model can offer a clip for an optional part. The clip's `length` and
`speed` are still evaluated, so an error in them is found in every
build.

A clip may instead give **`reverse`**, the name of another clip: it is
that clip played backwards, so a `close` is written as the reverse of
`open` and the motion exists once. It has no channels of its own, so no
`animate` names it (V-42), and no `length`: its length is the length of the
clip it names, which is evaluated once. It has its own `loop` and its own
`speed`; neither is taken from the named clip (a reversed walk may walk
backwards, so the author says so). It is not an expression clip, and
the clip it names has no `reverse` itself and is not an expression clip
(V-41), so reversals don't chain. Sampling (§7.25.3, Appendix G.18): its
keys are the keys of the named clip, and at the key of time t every channel
of the named clip is evaluated with `t` bound to L − t (and `u` to
(L − t) / L), so the value at its time t is the named clip's value at
L − t. It has the channels of the named clip, in the same order. It is
left out of a build when the clip it names is (above), and its `speed` is
still evaluated.

`speed` is for the host, as `loop` is: the speed in metres per second
along +Z (the figure's front, §7.24.2) at which it moves the figure
while the clip plays, so a clip that walks on the spot says how fast it
walks. A reader evaluates it as it does `length`, once per build, to a
finite number (a negative one walks backwards), and gives it with the
clip; it samples nothing. An expression clip has no `speed` (V-41).

`loop` is for the host: it plays the clip again from its start when time
reaches `length`. A reader doesn't check that the motion at `length`
equals the motion at 0, but a looping clip should have it, and writing
the motion as a function of `TAU * t / length` does.

#### 7.25.2 `animate`: what a part does in a clip

`animate` on a `part` (§6.1.12) maps clip names to **channels**
(§6.1.28). Every clip name must be in `clips` (V-42). Several parts may
animate the same clip.

| channel | value | meaning |
|---|---|---|
| `pose`, or `pose_deg` | vec3, radians, or degrees (§5.1) | the part's `pose` at time `t`; while the clip plays it replaces the part's own `pose` |
| `move` | vec3, metres | the part moves by this much along its own X, Y and Z axes (§7.15.7), as a `joint`'s `slide` does (§7.22.6), on top of its place in the model; 0 when the clip doesn't move it |
| `morph` | object: the `as` of an `asset` statement in this part → object: morph target name → number | the weight of that target of that asset (§7.21.6) |

A channel the clip leaves out holds the part's built value: its static
`pose`, no movement, the `morph` weight the asset was built with. A
clip's `animate` object has at least one channel.

**Evaluation.** A channel's expressions are evaluated when the clip is
sampled (§7.25.3), after the build, in the scope of the part statement:
the names visible at the statement, including its `let` and `for`
variables and its component's arguments, as the part's own `pose` is.
In addition the name **`t`** is bound to the time in seconds, and the
name **`u`** to the **phase**, `t` / `length`: 0 at the first key and
1 at the last, so `sin(TAU * u)` is one cycle of the clip, whatever its
length. `t` and `u` are defined only inside the values of a channel (and of an
action's targets and bone channels, §7.26.3, §7.26.4);
anywhere else they are unknown names (V-13), and so they are in a function
called from a channel unless passed as an argument. A name `t` or `u` that
is already in scope at the part (a parameter, constant, `let`, `for`
variable or argument called `t` or `u`) is an error at the `animate`
(V-43). `socket()` and
`socket_dir()` are not available in a channel (V-13). Random values
(§7.2.5) work as everywhere and give the same value at every time,
unless the key holds `t` or `u`.

**`morph`** names an asset statement of the same part by its `as`. That
statement must not be inside a `for`, so that the name means one placement;
every candidate of its `choose` must have the target (V-42). The weight
applies to every mesh of the placed asset with a target of that name
(§7.21.6). A `repeat` places copies that cannot be animated.

#### 7.25.3 Sampling

A reader samples every clip of a build at **30 Hz**, with keys exactly at
0 and at `length` (Appendix G.18). For each key it binds `t` and `u`, evaluates
the channels of every part that animates the clip, and gives, per part:

- with a `pose` channel, the part's local **rotation** at the key
  (a quaternion, from the part's local transform with that pose,
  Appendix G.13 and G.18);
- with a `move` channel, the part's local **translation** at the key;
- per `morph` channel, the **weights** of every node of the asset's
  placed copy that has a mesh with the target, at the key: the target's
  value, and every other weight as built.

A value that isn't the right type, or isn't finite, is a run-time error
at the channel (`build[2].animate.walk.pose`). Sampling counts steps
as every run does and has the same limit (§11). The keys are the whole
output of a clip: a host interpolates linearly between them, as glTF
does for these channels (§9.1).

#### 7.25.4 Expressions

A clip with `"expression": true` is a **facial expression**: motion run
by a driver from 0 to 1 instead of by time. A host with driver e plays it
at time t = e · `length`; at e = 0 the clip has no effect. Its channels
are the parts' and the assets' own: an eyelid part's `pose`, a jaw part's
`pose`, a morph weight of a placed head asset (D-84), so a rigid
character with no morph targets can blink.

Khronos adds an expression's change to the pose: it takes each channel's
value at time 0 as that channel's neutral value, so the clip's value at
`t` = 0 **should equal the part's built value** (§7.25.2: its static
`pose`, 0 for `move`, the built `morph` weight). A reader checks this
when it samples the clip, and warns if a channel differs by more than
1e-6 at the first key (V-46). It still builds the clip as written.
An expression clip has no `loop` and no `speed` (V-41).

**How a host adds an expression's change.** For each channel of an
expression driven with e, the host takes the channel's value s at time
e · `length` and its value n at time 0. On top of the value b that the
build and the expressions added before leave the part, it gives:

- for a translation or a weight: b + (s − n), per component;
- for a rotation: **rest · (sample at 0)⁻¹ · (sample)**, normalised: the
  quaternion b · n⁻¹ · s with b the rotation so far (the part's built
  rotation, for the first expression), n⁻¹ the conjugate of the unit
  quaternion n, and s and n the quaternions of the `rotation` channel
  (Appendix G.18). A per-component sum is not a rotation, which is why
  the change is composed.

The expressions are added in the order of `clips`. At e = 0, s = n and
nothing changes.

`expression_map` (§6.1.29) gives **standard names** to expressions, as
Khronos's mapping does: for a scheme (`vrm1_expressions`, §7.24.3), each
input name (`happy`) lists the expression clips that make it, each with a
weight from 0 to 1 (default 1). A host drives a standard name with a
value `x`; the clip `c` of an entry is driven with weight · `x`, summed
over the entries that name `c`, and clamped to 0–1. Every `clip` of the
map is an expression clip (V-44).

```json
{"clips": {"blink": {"length": 0.2, "expression": true}, "aa": {"length": 0.3, "expression": true}},
 "expression_map": {"vrm1_expressions": {
   "blink": [{"clip": "blink"}],
   "happy": [{"clip": "aa", "weight": 0.3}, {"clip": "blink", "weight": 0.2}]}}}
```

#### 7.25.5 Asset animations

A glTF asset may carry its own animations (§7.21.1). An asset placed by
one `asset` statement keeps them: each animation of the asset's file
that has a channel left for a node of the placed subtree, at the level built,
becomes a clip named **`name/animation`**, where `name` is the
statement's `as`, or else the asset's name (`alias.name` when imported),
and `animation` the animation's name, or `animation_N` for the one at
index N when it has none. Only channels that target a node's
translation, rotation, scale or weights are kept; channels that use
`KHR_animation_pointer` are not, and neither are the translation,
rotation and scale channels of the placed **root** node itself, whose
own transform is left out (§7.21.1); a `weights` channel on it stays.
So an asset cannot move or turn its own placement, and an animation
that had only such channels is not kept. Samplers, keys and values pass through
untouched: a reader does no sampling for them and they follow no
`length`, `loop` or `expression`. Two placements with the same `name`
make clips with the same name: a run-time error at the second statement,
so give each an `as`; so does an asset animation named like any other
clip of the model: a declared clip (a character's `sit/enter` included) or the clip of an action phase, a reverse one too (§7.26.6). A `repeat` drops the animations of its copies, as
it does the `roles` (§7.21.4).

#### 7.25.6 Output

A reader gives, with each build's parts: per clip that some part
animates (§7.25.1), in the order of `clips` and then of the clips of
action phases (§7.26.6), its name, `length`, `loop`,
`speed` (when it has one), `expression` flag, the key times
and, per channel, the part (or asset and target), the property
(`rotation`, `translation` or `weights`) and the sampled values; for the
assets placed, the names of the animations they keep (§7.25.5); and the
`expression_map`. A host plays these; a bake writes them as glTF
animations (§9.1).

### 7.26 Use actions

An **action** says how a person uses a use point (§7.23.1): sitting down
on a bench, making a coffee at a machine. It describes the motion in
layers, each optional (D-87):

- **targets**: where the body must be, as positions of six end
  effectors over time (hips, head, both hands, both feet), in the use
  point's frame or on a part of the model (§7.26.3);
- a **bone clip**: how the body moves, as rotations of VRM humanoid
  roles (§7.26.4);
- the model's own parts, which **move in step** (§7.26.6), and props
  that **follow a hand** for a while and may be left elsewhere (§7.26.5).

An action is written once, by name, in the top-level `actions` table; a
use point lists the names it offers, so the seats of a bench share one
`sit`. An action has up to three **phases**: `enter`, `loop` and
`exit` (§7.26.2). Several people may use one action at once, one per use
point, each on its own clock (§7.26.11). JIG describes the motion; playing it, solving the
targets with inverse kinematics, retargeting the bone clip to a
character's body and choosing how long to stay in a phase are the host's
(REQ-17). Like clips, actions change no geometry, physics or placement
(§7.19), and a build holds one variant of the model.

```json
{"actions": {
   "sit": {
     "enter": {"length": 1.2,
               "targets": {"hips": {"at": [0, 0.5, -0.2], "weight": "smoothstep(0, 0.8, u)"}},
               "bones": {"leftUpperLeg": {"pose_deg": ["-90 * smoothstep(0, 1, u)", 0, 0]}}},
     "exit": {"reverse": "enter"}}},
 "build": [
   {"clearance": {"shape": "box", "center": [0, 0.6, 0.4], "size": [0.6, 1.2, 0.8], "purpose": "use",
                  "point": [0, 0, 0.4], "facing": [0, 0, 1], "role": "sit", "actions": ["sit"]}}
 ]}
```

#### 7.26.1 Declaring actions and use points

- **`actions`** (§6.1.30) is a top-level object of action name →
  action, at most 64 (§11). Only the document being built declares it:
  the `actions` of an imported document are ignored, as its `clips` are
  (§7.4). An action has at least one phase (§7.26.2).
- A `use` clearance with a use point lists **`actions`**, the names of
  the actions it offers (§6.1.25, V-49). It must give `point` and `facing`:
  they are the frame. A name in a library's clearance is checked when the
  clearance runs, as a library's `role` is (§7.24.1).
- **The use point's frame** has its origin at `point`, +Y up, +Z along
  `facing` with its vertical part removed (normalised), and +X
  = +Y × +Z, the figure's left when it faces +Z (§7.24.2). It is fixed in
  the model's space at its rest pose (§7.23.1): a use point in a moving
  part doesn't move its frame. A host puts the figure's feet at `point`,
  facing +Z of the frame. The frame is worked out in the model's space at
  rest: the `facing` as built, in the holding part's space, is turned by
  that part's rest frame first, so a part turned at rest can make a
  horizontal `facing` vertical. A `facing` whose horizontal part (x, z),
  once normalised, is shorter than 1e-9, or that is zero, is a run-time
  error at the clearance's `facing`.
- **Scope of the values.** Every expression of an action reads **global
  names** only: the inputs (parameters, size, `seed`, `lod`, `wall`),
  constants, data blocks, the document's functions, imported constants
  and functions, and all derived values (§7.18), and the built-in
  functions. It reads no `let`, `for` variable or component argument,
  because it belongs to no statement. In `targets` and `bones` the names
  `t` and `u` are defined as in a clip (§7.25.2); a global `t` or `u` is an error
  (V-43). Actions are data of the model like placement (§7.23), so they
  should not read `lod`.
- **Where an action is a recipe, not a mesh**: a seat height read from a
  derived value or a parameter moves every target that reads it.

#### 7.26.2 Phases

A phase is `enter`, `loop` or `exit`, each optional (D-89, V-47). A host
chains them: `enter` once, then `loop`, played again from its start for
as long as it likes, as often as it likes (also never), then `exit`
once. A phase the action doesn't have is skipped: with no `enter` the
figure takes its place at once; between phases, and after the last
phase until the person leaves, the host **holds** the last values of
the phase that ended (targets, weights and bones at the phase's last
key). So the last values of a phase should equal the first values of the
phase that follows it, and a `loop` phase's last equal its first, as for a
looping clip (§7.25.1); a build warns where they differ (V-53). A jump may
be wanted (the figure takes its place at once), so it is not an error.

**`hold`.** A phase with `"hold": true` carries on from the **phase
before it**: for `loop`, `enter`; for `exit`, `loop`, or `enter` when the
action has no `loop`. Every target and bone channel that the phase before
it has and this phase doesn't name takes that phase's **last values**
(a target's `at`, rotation, `pole`, weight and `on`; a bone's rotation) for this
phase's whole length, as if written as constants, after the phase's own;
what the phase names is its own. The phase before may itself hold, so
values carry on through `loop` into `exit`. A
phase without `hold` has only what it names, so a target it leaves out is
let go. `enter` has no phase before it, and a phase with `reverse` holds
nothing of its own (V-47). `exit` may not hold when `loop` holds and
`enter` is the `reverse` of `exit`: `enter`'s values would be `exit`'s,
which would be `loop`'s, which would be `enter`'s (V-47); write `enter`
with its own values and `exit` as its reverse instead. A `reverse` phase's last values are the named
phase's first. So a `loop` that only adds a breath to the spine writes
`"hold": true` and the spine:

```json
"loop": {"length": 4, "hold": true, "bones": {"spine": {"pose_deg": ["2 * sin(TAU * u)", 0, 0]}}}
```

A phase has a **`length`**, a value in seconds from 0.001 to 600, evaluated
once per build after the derived values; it reads the global names of
§7.26.1 and not `t` or `u`. `t` runs from 0 to `length` within the phase,
and `u` = `t` / `length` (§7.25.2); the first key of a phase is its start.

A phase may instead be the **`reverse`** of another phase of the same
action, as a clip may be (§7.25.1): `"exit": {"reverse": "enter"}` is
`enter` played backwards, so standing up is sitting down played back and
the motion exists once. It has no `length`, `targets`, `bones` or
`attach` or `hold` of its own: its length is the named phase's, and all of those
are the named phase's, sampled backwards (Appendix G.20): a value at its
time t is the named phase's value at L − t, and an attach event that
ran from `from` to `until` runs from L − `until` to L − `from` and
leaves the prop where it was before the named event took it (§7.26.5). The
named phase has no `reverse`, so reversals don't chain (V-47). The model's
own parts that move in step play backwards with it (§7.26.6).

#### 7.26.3 Targets

`targets` (§6.1.32) puts end effectors where the model needs them (D-93,
D-94). Its keys are roles, and only these six: `hips`, `head`, `leftHand`,
`rightHand`, `leftFoot` and `rightFoot`, those an IK solver takes as end
effectors. A target has:

- **`on`**, optional: the target's **frame**. With no `on` it is the use
  point's frame (§7.26.1). With the resolved id of a part (§7.15.7) it is
  that part's frame (part space) as it moves: at each time of the phase,
  the part placed by its built pose and the channels of the action's
  phase clips (§7.26.6) as the host is playing them; the channels of other
  clips don't count. So a hand on a lever follows the lever with no
  maths, and the lever's turn is written once. With `body`, the root part,
  it is the model's space, which doesn't move (§7.15.7). A target whose part the build doesn't have is left out
  of the output with a warning (V-52).
- **`at`**, a position in metres in the target's frame. For
  a hand or a foot it is where the bone's origin (the wrist, the ankle)
  must be; for `hips`, the joint (pivot) of the bone with role `hips`,
  the root of the pelvis, not a thigh's hip joint; for `head` it is the point the head
  **looks at**: the head turns to face it and isn't moved. Aim at bone
  joints, not at the sole or the fingertip: the figure's proportions
  decide the rest, and a character's grip (§7.24.6) moves the point of its
  hand or foot that lands on `at`.
- **`rotation`** (or **`rotation_deg`**), optional: the orientation of the
  effector, as Euler angles of a rotation about X, Y and Z, applied Z
  first, then X, then Y, as a part's `pose` is (§7.15.7, G.4), turning
  the bone from its orientation in the figure's T-pose (§7.24.2) with the
  figure facing the frame's +Z; zero is that orientation. The rotation is
  written in the target's frame and turns with it: on a part, the bone's
  orientation is the part's current rotation in the model, times the
  rotation, times the reference-pose orientation of a figure facing +Z. A
  `head` target has none: its orientation follows from the look-at. With
  a character's grip turn, it is the grip frame's orientation (§7.24.6).
- **`pole`**, optional, only on a hand or foot: a point in the target's
  frame, in metres, that the elbow or knee **bends toward**. The solver
  keeps the limb's middle joint in the plane through the limb's root
  joint (the joint of the `leftUpperArm`, `rightUpperArm`, `leftUpperLeg`
  or `rightUpperLeg` bone), the effector and the pole, on the pole's side.
  With no pole, or a pole on the line from the root joint to the target,
  the host chooses the bend (§7.26.7). A pole has no weight of its own:
  the target's `weight` blends in the pose it gives.
- **`weight`**, from 0 to 1, default 1: how strongly the solver pulls the
  effector onto the target (§7.26.7). Values outside 0 to 1 are clamped,
  as a vertex colour is (§7.16).

`at`, the rotation, `pole` and `weight` read `t` and `u`, so a hand can reach for
a lever and then for a cup, and a weight can fade a target in and out.
A target is an instruction for where, not a promise: whether a figure
reaches it is the solver's (§7.26.7). A hand or foot target with no
`rotation` leaves the effector's orientation to the solver: it may keep
the orientation steps 1 and 2 gave it or turn with the forearm.

#### 7.26.4 The bone clip

`bones` (§6.1.32) is the **bone clip**: how the body moves (D-87). Its keys
are roles of the scheme `vrm1_humanoid` (§7.24.3); a bone it doesn't
name is not turned by it. A bone channel has `pose` (or `pose_deg`), a
rotation of that bone as Euler angles in the order of a part's `pose`
(G.4), reading `t` and `u`. Zero is the bone's orientation in the
figure's T-pose (§7.24.2): its reference pose, except for an `a_pose`
character's arms.
The rotation is the bone's turn relative to its parent bone, written in
the axes the model has in the reference pose (+X the figure's left, +Y up,
+Z its front), as the retargeting of a humanoid skeleton takes it. A host
whose bone frames are not those axes conjugates: with G the bone's global
rest rotation, it applies a channel's rotation R as the bone's local pose
rest · G⁻¹ · R · G, so the bone turns by R in its parent's turned axes (for
a rest that already has the figure's axes, as a JIG character's, that is R). A bone
channel is **rotations only** (D-96): there is no `move`, and the hips are
placed by their target or stay where the reference pose has them (a
`hips` bone channel turns the hips in place). The bone clip does not need
the model to be a character (§7.24): it names roles, not parts.

Write the **bone clip for how the body moves** (the knees bending, the
back leaning) and the **targets for where it must be** (on the seat, on
the lever), so a character can replace the first (§7.26.7) and move the
second only relative to the model's (§7.26.12).

#### 7.26.5 Props

An **attach event** (§6.1.32) makes a part, or a placed asset, of the model
**follow a bone** for part of a phase: a cup in a hand (D-91). It names
the prop with `part` (the resolved id, §7.15.7) or `asset` (the bare `as` of an
asset placed by an `asset` statement, §7.21.2, not qualified by a `use`
instance name and looked up among the placements of every part; an
asset placed without `as`, and a `repeat`'s copies, can't be named), the bone with `follow` (any role of `vrm1_humanoid`), and the
times `from` and `until` in seconds of the phase, `0 ≤ from < until ≤
length`. While `from ≤ t ≤ until` the host reparents the prop to the
bone: the prop's origin is at the bone's origin, in the figure's axes
of §7.26.4 (+X left, +Y up, +Z front) turned by the bone's turn from its
reference-pose orientation (no turn when the bone is at rest, whatever the
rig's own bone frame is), plus the offset `at` (metres, default 0) and the
rotation `rotation` or `rotation_deg` (default 0), constant for the
event. The prop's own descendants follow it. Outside the event the prop
is at its own place: its built pose and its own channels (§7.26.6), unless
an earlier event released it elsewhere (below); while attached, those are
replaced by the bone's, so the author puts the hand where the prop is at
`from` and `until`, or lets the next or previous phase carry on (an event
ending at the phase's `length` and one beginning at 0 of the next phase
are the same hold). Attaching changes no geometry and no physics (§7.19).

**`keep`.** With `"keep": true` the event has no `at` or rotation: at
`from` the host works the offset out so that the prop stays exactly where
it is at that moment (in its own place, or where an earlier event left
it), and keeps that offset until `until`. The grip is then written once,
in the hand's target. A bake can't work the offset out, since the bone is
the host's: it writes `keep` and the interval (§9.1), and hosts may differ
by their solvers' error (R-07).

**`release`.** Without `release`, the prop goes back to its own place at
`until`. With a **release place** (`at`, an optional rotation, and an
optional `on` as a target's, §7.26.3) the prop is there, in that frame,
from `until` until the person leaves the use point, or until an event
attaches it again: a cup put under the spout stays there while the coffee
runs. With `"release": "keep"` the prop stays where the bone left it at
`until`, fixed in the model's space. When the person leaves, the prop goes
back to its own place. A release place whose `on` names no part in the
build releases to the prop's own place (V-52).

**In a `reverse` phase** (§7.26.2, G.20) each event of the named phase
runs from L − `until` to L − `from`, with the named event's `follow`,
offset and `keep`. Before that interval the prop is wherever it is (where
the phases played before left it, as for any event). At the interval's
start the bone takes it from there; with `keep` the offset is worked out
then. At the interval's end the prop goes back to **where it was before
the named event took it**, at the named event's `from`; the named
event's own `release` is not used. That place is given by the release of
the **previous event** of the same prop in the named phase (the one whose
`until` is the latest at or before this event's `from`; events of one
prop don't overlap), as the reader gives it:

- a release place: the prop is put there (the same `at`, rotation and
  `on`; a place whose `on` the build lacks is its own place, V-52);
- `"keep"`: the prop stays where the bone leaves it at L − `from`. With
  `keep` on this event that is exactly where the previous event left it;
  with an offset it is where the offset puts it, which is that place when
  the hand is where the prop is at `from`, as above;
- no `release`: its own place.

With no previous event of the prop in the named phase, the prop goes
back to its own place, whichever phase is named. Only the named phase is
read: when it is `loop` or `exit`, a place an earlier phase left the prop
in is not used; to put it back there, write the phase with its own
`release` instead of as a reverse. So when `exit` is the reverse of `enter`, and `enter` takes the
cup from its shelf with `keep` and leaves it under the spout, `exit`
takes it from under the spout and puts it back on the shelf.

**What a place puts.** An offset's `at` and a release place's `at` place
the prop's **origin**: a part's origin is its `pivot` (§7.15.7), an
asset's the origin of its node (§7.21.2).

`from`, `until`, the offset and the release place are evaluated once per
build, read global names and not `t` or `u`. An attach event whose `part` or `asset` names
nothing in the build (a part not built; an optional prop) is left out of
the output with a warning (V-51). A reader works in this order: it evaluates
and checks the times of each event (the range errors below), looks the
props up in the build and drops the missing ones with V-51, then checks
overlap among the events kept, so two overlapping events of a prop the
build leaves out are two warnings, not an error. The 1,000 events of §11
are the events kept. The run-time errors (§10.1) are: an
`asset` name that two placements share (at the event's `asset`); a `from`
that isn't a number or is below 0 (at `from`); an `until` that isn't a
number, isn't above `from` or is above the phase's `length` (at
`until`); and two events of one prop in a phase that overlap (they may
touch), at the later one in the list.

#### 7.26.6 The model's own parts move in step

A part's `animate` (§7.25.2) may name an action phase, `action/phase`
(D-90): every phase that has a `length` is also a **clip**, named by its
action and phase, that need not be declared in `clips` and cannot be
(V-50). Its length is the phase's, it loops only if it is the `loop`
phase, it is no expression and has no `speed`. A part's channels for it
are those of any clip (§7.25.2), sampled as any clip is (G.18), on the
clock of the phase: `t` and `u` are the phase's. So a lever's `pose` in
`make_coffee/enter` moves while the person's hand reaches it. The host
plays these channels on the same clock as the person; with several people,
§7.26.11 says whose.

**`use`.** An `animate` entry of a phase clip may say which use point its
channels belong to: `"use"` with the part that holds the use point,
a template resolved as a part id is (§7.15.7), with the same instance
prefix, so a cushion and its seat made in one `for` or one component
name each other:

```json
{"part": "cushion_{i}", "animate": {"sit/enter": {"use": "seat_{i}", "move": [0, "-0.012 * sin(PI * u)", 0]}}}
```

Those channels play only while a person uses that use point, on that
person's clock; an entry with no `use` plays for any use point. The named
part must be built (else the entry is left out with V-52) and must hold
exactly one use point (a `use` clearance with `point`, run while that part
is current) that offers the action; otherwise it is a run-time error at
the `use`. Use points are placement, so they are counted in the level-2
build (§7.22), whatever the level being built: a use clearance under a
test that reads `lod` (V-38) counts only when it is built at level 2. The
named part must be in the build being made. The root part's resolved id
is `body`.

A phase with `reverse` is the reverse clip (§7.25.1) of the phase it
names, with the same channels backwards: no `animate` names it (V-42).
A phase clip that no part animates in a build is left out of it, as a
clip is (§7.25.1); the phase itself isn't. The phase clips come after
the clips of `clips` in a build's output, in the order of `actions` and
within an action in the order `enter`, `loop`, `exit`.

#### 7.26.7 Layering, and a character's own bone clip

A host plays a phase on a figure in this order, for every time t of the
phase (D-94, normative), the solver of step 3 being the host's:

1. **Base.** The figure stands in its T-pose (§7.24.2), feet on the
   floor at the use point, its front along the frame's +Z. For an
   `a_pose` character the host turns each upper arm by its arm offset's
   inverse D_s⁻¹ (G.21), about the upper arm's joint in the figure's
   axes: with G the bone's global rest rotation, its local pose is
   rest · G⁻¹ · D_s⁻¹ · G.
2. **Bone clip.** The rotations of the bone clip (§7.26.4) are applied to
   the bones it names: the phase's `bones`, or the character's own clip
   when it has one (below). On an `a_pose` character's upper arm a
   channel's rotation R comes after the offset: the local pose is
   rest · G⁻¹ · R · D_s⁻¹ · G, so the arm ends where R puts a T-pose arm.
   Every other bone takes R as §7.26.4 says.
3. **Targets.** The phase's targets, merged with the character's own
   when it has some (§7.26.12). The host moves each effector whose target
   has a weight w above 0 onto the target (a hand or foot by its grip
   point and grip frame when the character has a grip, §7.24.6), bending
   a limb toward the target's `pole` when it has one, as far as the figure's proportions allow, from
   where steps 1 and 2 left it: at weight 1 as the solver can reach, at
   weight 0 not at all, and in between the position and rotation are
   blended between the two by w (a linear blend of positions, a spherical
   one of rotations). A `head` target turns the head from the bone
   clip's orientation to face the point. A figure with no `hips` target
   keeps its hips where step 1 puts them.

The bone clip is always first: IK moves the effectors the bone clip put
somewhere else, so a `leftHand` target wins over the arm's rotations.
A host that has no solver plays steps 1 and 2. The T-pose has
straight arms and legs, so a solver has no plane to bend a knee or an elbow
in: a host bends it toward the target's `pole` (§7.26.3); with no pole it
keeps the plane the bone clip's bend gives and, where there is none,
chooses its own (§7.26.9). An author bends knees and elbows a little in the bone clip
wherever a target pulls them, so every solver bends them the same way,
and gives a `pole` where the bend must go one way (a knee out to the side).

**A character's own bone clip** (D-88, D-95). A document with a
`character` (§7.24) may have a clip named **`action/phase`** (V-50),
such as `sit/enter`: for every action of that name the host uses it **in
place of** the bone clip of that phase, whatever model the action is
from. It plays over the phase: the host's `u` for the phase is the
clip's `u`, and the clip's own `length` only sets its sampling rate. It
turns the character's parts (each with a `role`), only by `pose` or
`pose_deg`: rotations, as the bone clip (V-50). A role it doesn't
animate is not turned: the override replaces the action's bone clip as a
whole. It **overrides targets only through `character.actions`, relative to
the model's** (§7.26.12), and never the attach events or the model's own
parts: they belong to the model, which knows where the seat is. A phase
with `reverse` takes the bone clip of the phase it names, **after**
replacement, played backwards, unless the character has a clip of the
reverse phase's own name; the character may make it with `reverse`
itself (`"sit/exit": {"reverse": "sit/enter"}`). Its `reverse` may name any
clip that V-41 allows, an ordinary clip too; the rule of V-50 on a part's
`role` and rotations only applies to the parts that animate a declared
`action/phase` clip, whatever it reverses.

Authors who want overrides to work across models use the same action
names; the guide lists recommended ones.

#### 7.26.8 Sampling

A reader samples every phase of every action at 30 Hz, with the keys of
a clip of the phase's length (Appendix G.20, G.18): per key it binds `t` and `u`, evaluates the
target values and bone channels, and gives per phase: for every target,
the `at` positions, the `rotation` quaternions (when it has a rotation),
the `pole` positions (when it has a pole) and the weights; for every bone channel, the rotation quaternions; and
the attach events as evaluated once. A value that isn't of the right type
or isn't finite is a run-time error at the value
(`actions.sit.enter.targets.hips.at`). Sampling counts steps and values
against the limits of §11. The keys are the whole output: a host
interpolates linearly between them (spherically, for quaternions).

A phase with `hold` (§7.26.2) gets, after its own targets and bones, the
held ones in the order of the phase before it, each with every key equal
to that phase's last key (a target's `on` too). A reader samples a phase
after the phases it reads: the phase its `reverse` names, and, with
`hold`, the phase before it. V-47 rules out a cycle, so such an order
always exists and every held value is known when it is needed. A target's `on` doesn't change its samples: `at` and
the rotation stay in the target's frame, which the host places at play
time (§7.26.3). A target left out by V-52 is not in the output.

**A pair** (§7.26.12) is sampled by a step of its own, after the model's
phases: for each phase of the model, in the same order, at the same keys,
the reader binds `t` and `u` as for the model's phase, evaluates the
character's override values in the character's global scope, with
`model_at` and `model_weight` reading the model's samples at that key,
and merges them (G.20). A value of the wrong type or not finite is a
run-time error at the override's value
(`character.actions.sit.enter.targets.hips.at`). The step is a run of
its own with the limits of §11.

#### 7.26.9 Hosts

Informative. Godot maps the bone clip to the bones of a `Skeleton3D` with
`SkeletonProfileHumanoid` (a role by capitalising it, §7.24.5), the
targets to its IK modifiers (`SkeletonModifier3D` subclasses: a two-bone
IK for each arm and leg, a look-at modifier for the head, the hips by
moving the skeleton so that the `Hips` bone's origin lands on the target)
with the target's `weight` as the
modifier's `influence`, and an attach event to a node under a
`BoneAttachment3D` that the host reparents for the interval. The
character's own clip `action/phase` is an animation of that name on the
character's `AnimationPlayer`; Godot's animation names can't hold `/`, so
`action/phase` is `action_phase` there, as for every clip name.

Played on Godot 4.7's `SkeletonProfileHumanoid` rig, the mapping works as
follows. A two-bone IK for each limb (root, middle and end bone, such as
`LeftUpperLeg`, `LeftLowerLeg`, `LeftFoot`), not one modifier for four,
since `influence` is per modifier and each target has its own `weight`; a
look-at modifier on `Head` (the bone's forward is +Z); the hips have no IK
class and are moved directly, blended by their weight, before the modifiers
run. The modifiers run after the bone clip, and `weight` is `influence` one
to one. A two-bone IK needs a **pole** to bend a straight limb (§7.26.7):
the target's `pole`, as the IK's pole target (a node the host moves to the
pole, in the target's frame, at every frame); with none the host chooses
it (in front of the knee, behind and below the elbow). It places the end
bone but does not orient it, so a target's `rotation` needs a step after
the IK that turns the bone's global orientation towards the target's by
the weight. It has no tip offset, so for a character's **grip** (§7.24.6)
the host moves the IK target back by the grip's `at` turned by the
effector's orientation (the target's rotation times the inverse of the
grip's turn when the target has a rotation, else the bone's after the
bone clip), and the rotation step aims the grip frame.

#### 7.26.10 Output

A reader gives, with each build: for every action, in the order of
`actions`, and in each of its phases (`enter`, `loop`, `exit`): the
action and phase name, the evaluated `length`, the name of the phase it
reverses, the number of keys and the keys of the targets (each with its
`on`, when it has one), bone channels and attach events (each with its
`keep`, and its `release`: `"keep"`, or the evaluated place with its
`on`; in a `reverse` phase, the release of §7.26.5) of §7.26.8, in the order written, held ones last; and for each use
point the names of its actions. The clips of the phases that some part
animates are in the build's clips (§7.25.6), each channel with the
resolved `use` of its entry, when it has one. A bake writes them (§9.1).

The pair step (§7.26.12) gives the same for every action and phase of the
model, in the same order, with the targets merged (each with its `on`,
when it has one); the length, keys, reverse name, bone channels and attach
events are the model's. With the merged actions it gives its warnings
(V-55) and the character's grips (§7.24.4), so the one list a host plays
has them.

#### 7.26.11 Several people, and empty use points

A host keeps **one clock per use point** (D-107): each person plays the
phases on their own clock, from when they start using the point. On a
two-seat bench, A sits on `seat_1` at 0 s and B on `seat_2` at 3 s;
each seat's channels with `use` (§7.26.6) play on that seat's clock.
Two people at the same use point are not in the format (OI-29).

**A channel with no `use`** belongs to the action, not to a seat, and
plays **first in, last out** (D-111): `enter` on the clock of the first
person to start the action, `loop` while anyone is in it (its clock
runs on when the first person leaves), and `exit` on the clock of the
last person to leave. A person who leaves while someone stays doesn't
play it: a desk lamp that turns on in `work/enter` stays on while
anyone works. The action's `loop` is cut where it is when the last
person's `exit` starts, so a moving `loop` channel with no `use` can
jump there; keep such channels steady.

**When nobody plays a channel** (D-112), the part is as a build with no
person makes it: its built pose, and the clips of `clips` the host plays.
That holds for a channel with `use` while its use point is empty (before
anyone comes, after they leave), and for a channel with no `use` while
the action is empty. So an `exit` should end at the built pose.

Targets and props are each person's: a target `on` a part follows the
part as the host poses it, on whatever clock moves it, and a prop that a
person released stays until that person leaves.

#### 7.26.12 A character's own targets

A character (§7.24) may change the **targets** of any model's action for
its own body (D-117 to D-123): a toddler sitting on an adult's bench lifts
its feet instead of pushing its shins through the seat. It writes them in
**`character.actions`** (§6.1.33), **relative to the model's targets**, so
it never learns the model's geometry: the model's `hips` already carry the
seat height.

```json
"character": {"scheme": "vrm1_humanoid", "actions": {"sit": {
  "enter": {"targets": {
    "hips":     {"at": "model_at('hips') + vec3(0, -0.04, 0.04)"},
    "leftFoot": {"at": "mix(model_at('leftFoot'), model_at('hips') + vec3(0.06, -0.12, 0.27), smoothstep(0.6, 1, u))"}}},
  "loop": {"targets": {
    "hips":     {"at": "model_at('hips') + vec3(0, -0.04, 0.04)"},
    "leftFoot": {"at": "model_at('hips') + vec3(0.06, -0.12, 0.27)"}}}}}}
```

- **Matching.** An override applies to the phase of the same action and
  phase name in the model's `actions`, for every model, as the
  character's own bone clip does (§7.26.7). A name the model lacks is
  ignored, with no warning.
- **What it changes.** Per role (one of the six of §7.26.3), any of
  `at`, the rotation (`rotation` or `rotation_deg`), `pole` (a hand or
  foot only) and `weight`; an omitted one keeps the model's. A role the model's phase lacks is
  **added**; `"weight": 0` lets one go. Nothing else: no `on`, attach
  events, `length`, `hold`, `reverse`, bones or parts. The props, the
  timing and the model's parts belong to the model (§7.26.5, §7.26.6),
  and the bones to the character's `action/phase` clip (§7.26.7).
- **Values.** Each value reads the character's global names (§7.26.1;
  those of the character's build, so `height` scales an offset with the
  figure), `t` and `u` of the model's phase (§7.26.2), and two built-in
  functions (§7.2.4), allowed nowhere else (V-54):
  - **`model_at(role)`**: the vec3 `at` of the model's target of that role
    at this key, in that target's frame;
  - **`model_weight(role)`**: its weight at this key, clamped to 0–1.

  "The model's target" is the target as the model's own output gives it
  (§7.26.10): its own targets and held ones, a reverse phase's values
  backwards, and none that V-52 left out. Never the merged one. `role`
  is a string literal, one of the six roles, so it is checked at load.
- **`let`.** A phase override may name values for its targets, as a
  `let` statement does (§7.15.1):

  ```json
  "loop": {"let": {"seat": "model_at('hips')", "lift": "vec3(0, -0.04, 0.04) * height / 0.85"},
           "targets": {"hips": {"at": "seat + lift"}, "leftFoot": {"at": "seat + vec3(0.06, -0.12, 0.27)"}}}
  ```

  Names are bound in order at each key of the phase, so they read `t`,
  `u`, `model_at` and `model_weight` as the target values do, and a later
  name the earlier ones. They are local names (§7.2.3) and in scope only
  in that phase override's targets, not in another phase's. A `let` name
  is evaluated only for the targets kept that read it (below); one read
  by none is never evaluated.
- **Frame.** An override of a role the model's phase has takes that
  target's `on`. An added target is in the use point's frame (§7.26.1).
- **Dropped** (V-55). An override target is left out of the merge, with a
  warning, when its values call `model_at` or `model_weight` of a role the
  model's phase lacks, or `model_at` of a target whose `on` differs from
  the frame of the target being written (both none, or the same part id,
  match), or when it adds a role and gives no `at`. Every call written
  counts, whether its branch is taken or not, and so does every call in a
  `let` name the target's values read, directly or through another. The merge goes on as if the
  override target weren't written: the model's target of that role, if
  any, stands (a held one holds the merged last key, below).
- **Merge first.** A phase's targets are merged before `hold` and `reverse`
  read them (D-122). A held target (§7.26.2) holds the **merged** last key
  of the phase before, so a raised foot stays raised; an override of a
  role the model's phase holds counts as the phase's own. A phase with
  `reverse` plays the named phase's **merged** targets backwards, unless
  the character overrides the reverse phase itself: then its overrides
  merge with the model's reverse phase as with any phase, and `model_at`
  reads that reverse phase.
- **Order.** A merged phase has the model's own targets, in the order
  written, with their overrides; then the added targets and the overrides
  of roles the model's phase holds, in the order the override writes them;
  then the held ones (§7.26.8).

**Who merges.** A reader, in a **pair step**: given a build of the
character and a build of the model, it samples the overrides at the keys
of the model's phases (§7.26.8, G.20) and gives the model's actions with
the targets merged, in the form of §7.26.10. A host plays that one list of
targets (§7.26.7) and evaluates no expression. The bake of either document
is unchanged (§9.1): a host with no reader at run time plays the model's
targets.

## 8. Inputs and quality

### 8.1 Inputs

A build's **inputs** are the parameter values, the size (`width`,
`height`, `depth`), `seed`, `lod`, in a path model the path, and in a
model that declares `wall` the wall's thickness (§7.23.3). They are
independent: nothing the document computes changes an input. The host
gives them, and the reader settles them once per build, in one fixed
step:

1. a parameter the host doesn't give takes its default; numbers are
   clamped to `min` / `max` and `int` values rounded half away from zero
   (§7.10); an `enum` value must be one of its options; `lod` is
   rounded and clamped to 0–2 (§7.9);
2. presets apply (§7.11), as if the user had picked those values;
3. each size axis is clamped to its limits, which may depend on the
   parameters and the other axes (§7.8); `wall` is clamped to its
   `min` and `max`.

Presets and size limits are written in the document but belong to
settling: the reader applies them before any derived value or statement
runs, and nothing later changes the settled values.

What a model computes from its inputs, such as a plank count that fits
the height or an axle position, is a **derived value** (§7.18): the build
reads it by name, and a host may show it, but nobody sets it. Each input
has an impact class (§7.19) a reader works out from the document, so a
host can tell what changing it can affect.

### 8.2 Authoring conventions

These aren't checked by readers, but they keep a library of models
consistent, so people can learn the parameters once.

- **Leave to the host what the host controls.** Size is `width`, `height`
  and `depth`; variation is `seed`; detail is `lod`. Don't add parameters
  that duplicate them, such as a facet count, a curve step or a
  variation-strength slider.
- **Order:** design choices first (shape, style, counts, toggles), then
  the `finish`, then colours.
- **Names** are lower-case `snake_case` nouns for what the user sees:
  `boards`, `lid_open`, `arm_curve`. A number with a unit names its unit
  in `unit`, not in its name.
- **Names that are taken.** Every built-in function name is reserved
  (§7.2.3), and several are ordinary words a document reaches for. The
  usual clashes, with names that work instead:

  | taken | try |
  |---|---|
  | `len`, `length` | `span`, `run`, `arm_length` |
  | `step`, `steps` | `pitch`, `spacing`, `stair` |
  | `round` | `ring`, `turn` |
  | `mod` | `module`, `unit` |
  | `range` | `span`, `reach` |
  | `min`, `max` | `lo`, `hi`, `least`, `most` |
  | `sign` | `side`, `board` |
  | `distance` | `gap`, `offset` |
  | `reverse`, `rotate` | `flipped`, `turned` |
  | `mix` | `blend` |
- **Finish:** a model with a choice of material or colour scheme has an
  `enum` parameter named `finish`. Its presets set the colours, and its
  last option is `custom`, which leaves them free.
- **Colours** are named `<part>_color`, after the part they paint:
  `seat_color`, `frame_color`. Give a part its own colour only where users
  would really pick it separately.
- **Textures** have no parameter of their own. A `<part>_color` parameter
  is the tint of its part's texture, and `finish` picks the image where
  the material changes, e.g. `finish == 'ashlar' ? wall_color :
  texture('brick', wall_color)`.
- **Ranges** are real-world limits, so every value a slider reaches gives
  a believable object. Defaults are the most typical example.
- **Docs:** give every parameter whose name doesn't say it all a one-line
  `doc`, and say how size limits or derived values use it.
- **Derive what a host should show.** Put a value worked out from the
  inputs in `derived`, with a `doc`, when a user would want to see it (a
  plank count, an axle position) or several places use it. A `let` is
  fine for arithmetic local to a block.
- **Random keys name the piece.** Make the key of `random`,
  `random_range` and `vary` from what identifies the piece
  (`['plank', i]`), so values don't shift when other pieces come or go.
  Prefer loop counters and names to computed coordinates: a key built
  from a coordinate changes when the size does, and one computed with
  `sin`, `cos` or `pow` can differ in its last bit between readers
  (R-01), giving a different value.
- **The front faces +Z**, as in glTF (§5.1): the side a person faces,
  reads or uses. Say in `description` which way the model faces.
- **Round shapes** (§7.16). Write a sphere stretched per axis as an
  `ellipsoid`, not a `sphere` in a scaling `transform`, and a ring as a
  `torus`; pick `sides` (and `tube_sides`) per `lod`, as
  `"[24, 16, 10][lod]"`.
- **Characters** (§7.24). Model the figure in a T-pose, standing on +Y
  facing +Z, with every part's `pose` 0; for an A-pose look, lower the
  upper arms with a static `pose` (§7.24.2). `a_pose` is for a skinned
  asset whose rig rests in an A-pose. Put each part's pivot at the joint it turns about, name the bone
  with a `role` template (`"{side}UpperArm"`) where parts come from a
  loop, and give every required role of the scheme (§7.24.3). A clip's
  values are absolute, so write every expression clip to equal the rest
  at `t` = 0 (V-46), and write a looping clip as a function of
  `TAU * u` so its last key equals its first.
- **Limbs that bend** (§7.16.1). Make a sleeve, trouser leg or neck one
  `chain_loft` over its chain of parts, with a `blend` width at each
  joint, rather than a tube per part and a ball at each joint; start it
  `open` inside the solid it grows from. Place it after the limb's
  outermost `part`, or in an ancestor, and tie `steps` and `sides` to
  `lod`. Keep rigid parts rigid: machines, props and a wooden mannequin
  need no blending.
- **Actions** (§7.26). Write the targets in the use point's frame, so that
  one definition serves every seat, and aim them at bone joints (a wrist,
  an ankle, the joint of the `hips` bone). Give the bone clip for how the body moves and
  the targets for where it must be; a character replaces the first.
  A character that changes targets (§7.26.12) writes them from
  `model_at`, never as numbers in the use point's frame, so one override
  fits every seat, and scales its offsets by its own size. Give a hand or
  foot target a `pole` where the knee or elbow must bend one way, and a
  character `grips` where its palm or sole is far from the joint
  (§7.24.6); models still aim at joints.
  Ramp a target's `weight` from 0 at the start of `enter` and back to 0 at the
  end of `exit`, so the figure blends from and to its own pose, and make
  the last values of a phase equal the first of the next. Read no `lod`.
  Use the recommended action names of the guide, so characters can
  override them.
- **Parts** have `snake_case` ids for what moves: `lid`, `gate`, `arm`. A
  library component that makes parts takes its instance name from `as`,
  not from an argument, and names its parts for what they are inside the
  component (`axle`, `hub`).
- **Shading.** Leave `smooth` at its default unless the look calls for
  something else: `0` for a deliberately faceted object (a cut gem, a
  low-poly style), up to 60–70 for scanned or sculpted shapes whose rings
  meet at steeper angles. Give a part `roughness` and `metallic` only where
  its surface kind is wrong for it (polished brass on a `metal` bust).
  Give `emissive` only to what shines by itself (a lamp's glass, a
  screen), and a light (§7.23.6) where it should light its surroundings.
- **Levels of detail.** A model honours `lod` (§7.9) so that a host can
  swap levels without anyone noticing anything but the detail:
  - **Same size, origin and footprint** at every level.
  - **Fewer triangles, never more**, as `lod` goes up. Aim for roughly half
    per level.
  - **Reduce detail, keep the silhouette.** Lower the facet count on round
    parts, the segment count on curves and paths, and repeated small details
    (rungs, glazing bars, spokes, teeth, rivets). Drop small pieces that
    vanish at a distance. Keep the outline and the main masses.
  - **Keep the colours.** A part should be the same colour at every level.
    Random calls keyed by the piece do this by themselves.
- **Kits** (§7.21). Model each piece at its own origin, facing +Z like a
  model (§5.1). Put a socket wherever another piece may meet it, with +Z
  pointing out of the piece; a piece that repeats has `socket_in` and
  `socket_out` on one straight line. Keep slice zones and the pieces a
  `repeat` stretches free of sculpted detail, and give the kit's
  materials names, since documents set their factors by name. Ship each
  piece's levels of detail with `MSFT_lod` or as `_lod1`, `_lod2`
  nodes listed in `lods`, and give every level the same materials and
  morph targets.

### 8.3 Conformance

`conformance/cases/` holds, for each model in `models/`, a list of
parameter settings. `conformance/reference.json` holds, for every case at
every level of detail (0, 1, 2), the settled inputs (§8.1), the derived
values, and a **fingerprint** of each part the reference reader built. Two
readers conform to each other when their fingerprints agree within the
tolerances below. `conformance/README.md` defines the file precisely.

A case is an object of parameter values, plus optionally `width`,
`height`, `depth`, `seed` (default 1) and `path` (the host's
path: a list of points `[x, y, z, in_x, in_y, in_z, out_x, out_y,
out_z]`).

A part's fingerprint, in the order the parts were created (the root part
first):

| field | value |
|---|---|
| `name` | resolved id (§7.15.7) |
| `parent` | index of the parent part, −1 for the root |
| `triangles` | triangle count |
| `min`, `max` | bounds of the vertex positions (part space); empty for no triangles |
| `area` | sum of triangle areas |
| `pos`, `normal`, `color` | sums over all vertices of position, normal and colour (r, g, b) |
| `surface` | sum over all vertices of the surface data (§7.16) |
| `material` | sums over all vertices of (roughness or 0, metallic or 0, 1 if roughness given, 1 if metallic given, emissive r, g, b (sRGB 0–1, 0 when not given), emissive strength (1 when not given), counted even with a black `emissive`, which a bake ignores) |
| `uv` | sums of stored texture coordinates (Appendix G.10) |
| `textures` | file names of the images the part uses, sorted |
| `origin` | the part's translation relative to its parent part (§7.15.7) |
| `assets` | one entry per asset placed in the part, in placement order: the asset placed (after `choose`), the node of its level, its transform relative to the part (12 numbers), its `materials` and `morph` values, and for a sliced asset the bounds and sum of its sliced level's positions |
| `sockets` | one entry per socket placed in the part, in placement order: its resolved id, origin and +Z, in part space |
| `weights` | only for a part that holds blended geometry (§7.15.7): resolved part id → the sum, over every vertex of the part's triangles, of that part's weight (G.22; a rigid vertex gives its own part 1) |

Tolerances: settled values 1e-5; area 1e-4 (2e-3 on a curve); colour and
surface sums 1e-4; position sums 6e-8 × triangles × 3 × the model's size
plus 1e-3 per vertex on a curve; asset transforms and socket frames
1e-4; weight sums 1e-5 per vertex. Positions, normals and weights of blended geometry are at the reference pose, before any skinning. Assets add no triangles and no sums except a sliced asset's own.

A case's **physics fingerprint** (§7.22, §7.23) holds, for each body, its part, motion type, mass, centre of mass and inertia; the number of colliders of each shape and their total volume; every clearance, in output order, with its part, purpose, level and, for a box, its centre and size; and the number of polygons and arcs of the plan symbol. Numbers agree to relative 1e-6, except a clearance box's centre and size, to relative 1e-9 (Appendix G.16). `conformance/README.md` defines it.

A case's **character and clip fingerprint** (§7.24, §7.25) holds, for a model that declares `character`, its scheme, reference pose, arm offsets (for `a_pose`), roles with their targets in the order given, each part's reference rotation, and its grips (§7.24.6) with their `at` and turn quaternion; for every clip the build animates, in the order of `clips`, its name, length, `loop`, `speed` (0 when it has none), `expression`, key count and, per channel, its target, property and the first key's, last key's and all keys' sums of values; for every placed asset, the animations it keeps; and the build's warnings (V-45, V-46) as a sorted list of paths. Names, counts, flags and warning paths are equal; rotations and key values agree to 1e-5, sums to 1e-5 per key. `conformance/README.md` defines it.

A case's **action fingerprint** (§7.26) holds, for a model that declares `actions`, for every action in the order of `actions` and every phase it has (`enter`, `loop`, `exit`): the evaluated `length`, the name of the phase it reverses, the key count; per target, in the order written (held ones last, §7.26.8), its `on` and the first key's, last key's and all keys' sums of its `at`, its rotation quaternion (when it has one), its `pole` (when it has one) and its weight; per bone channel the same for its quaternion; and the attach events with their evaluated `from`, `until`, offset (none with `keep`), `keep`, `release` and the name of what follows. The use points' action names are in the placement data. Names, counts and flags are equal; values agree to 1e-5, sums to 1e-5 per key. The clips of the phases are in the clip fingerprint (a channel with its `use`), and the warnings V-51 to V-53 in the warnings.

A **pair**'s fingerprint (§7.26.12) holds, for a character and a model each built at the inputs its pair case gives, the merged actions in the form of the action fingerprint, the character's grips as in the character fingerprint, and the pair step's warnings (V-55) as a sorted list of paths; a pair case may instead name the error path the step must stop at. The same tolerances apply. `conformance/pairs.json` lists the pairs and `conformance/README.md` defines it.

The reference reader's `jig check --schema` checks a document against the schema first and the reader after, and reports both; `jig check --schema-only` checks it against the schema alone, so a document of a version no reader reads yet can be checked (the schema's `version` pattern accepts any 0.N). The schema is not the spec: it accepts a superset of the valid documents (Appendix C). `conformance/README.md` defines it.
Because the fingerprint includes resolved
part ids and piece seeds, renaming a part or changing the random hash
changes the reference.

**Bakes.** Every glTF file a baker writes (§9.1) must pass the Khronos
glTF-Validator (DEP-08) with no errors; warnings and infos are allowed.
Its `CANWELL_jig` objects must validate against
[`canwell_jig.schema.json`](canwell_jig.schema.json).

## 9. Interchange and security

### 9.1 Interchange

JIG is the source format. To hand a single variant to tools that don't
read JIG, bake it to glTF 2.0. JIG's frame is glTF's (§5.1), so a bake
needs no axis conversion, and the mapping below is exact and normative.
The file must pass the Khronos glTF-Validator with no errors (§8.3).

| JIG output | glTF | Note |
|---|---|---|
| The model | One root node with the `CANWELL_jig` node extension (below); its children are the root part's node | Named after the document's `name` |
| Part | A node, `name` = the part's full resolved id (§7.15.7), with a mesh if the part has triangles | Children nested like the parts |
| `pivot`, `pose`, part axes | The node's `translation`, `rotation` and, for a mirrored part, `scale` (Appendix G.13) | Geometry is stored relative to the part frame |
| Physics (§7.22) | `KHR_physics_rigid_bodies` and `KHR_implicit_shapes`, listed in `extensionsUsed`, never in `extensionsRequired`: each body's part node gets `motion` (none for a static body; `isKinematic` for a kinematic one; `mass`, `centerOfMass`, and `inertiaDiagonal` with `inertiaOrientation` from the inertia tensor's principal axes, Appendix G.15); each collider a child node holding its implicit shape or its hull as a mesh with `convexHull: true`, with its `physicsMaterial` and `collisionFilter`; each joint a node joint with `connectedNode` the parent body and a `physicsJoints` entry of its limits and drive; a trigger a `trigger`. A `break_force` goes in `CANWELL_jig`. An asset's own physics nodes are not copied: its colliders bake from the reader's physics, on the part's body (§7.22.2) | Units and angles pass through unchanged: both are SI and radians |
| Lights (§7.23.6) | `KHR_lights_punctual`, in `extensionsUsed`: one light per `light`, on a child node of its part's node at `at`, turned so its −Z runs along `direction`; `color` clamped to 0–1 and converted to linear (Appendix G.2); `intensity` as it is; `cone` as `innerConeAngle` and `outerConeAngle` | The node follows its part's node, so the part's animations move the light |
| Placement (§7.23) | Clearances, use points (with the names of their `actions`), mounts, the wall gap, supports, openings, passages, effects, tags, socket types and the plan symbol in `CANWELL_jig`, shapes in `KHR_implicit_shapes` form, hulls as point lists | Hosts without JIG ignore them |
| `selectable` part (§7.23.7) | `KHR_node_selectability` (DEP-12) in `extensionsUsed`, never `extensionsRequired`: `{"selectable": true}` on the part's node; no other node carries it | Khronos can only switch selection off and JIG only switches it on, so the mark is `true` on the marked nodes only: a viewer with no JIG reader sees every node selectable, as glTF's default is |
| Triangles | Primitives with `mode` 4 and `indices`, counter-clockwise from outside | |
| Positions | `POSITION`, float, with `min` and `max` | glTF requires the bounds |
| Normals | `NORMAL`, float, unit length | The smoothed normals of §7.17 |
| Texture coordinates | `TEXCOORD_0`, float, on textured faces | The stored coordinates (Appendix G.10), already in glTF's convention |
| Vertex colours | `COLOR_0`, float, linear: VEC3, or VEC4 with the tint's alpha in a primitive whose texture uses alpha (§7.6) | Converted from sRGB, Appendix G.2 |
| Grain | `_GRAIN`, VEC3 float | glTF reserves a leading `_` for application attributes |
| Surface data | `_SURFACE`, VEC2 float: surface index, piece seed | |
| Texture, roughness, metalness and emission of a face | One material; one glTF primitive per material in a part's mesh, in order of first use | Below |
| Settled parameters, size, `seed`, `lod`, source document | The `CANWELL_jig` extension | Records which variant was baked |
| Top-level `x-` keys | The model root node's `extras`, under the same keys | |
| Placed asset | A node under its part's node, named the asset's `as` (a `repeat` copy: `as_k`, k from 0) or else its name, with the asset's subtree below it | Below |
| Socket of a `socket` statement | An empty node `socket_<name>` under its part's node | An asset's sockets are already nodes of its subtree |
| Character (§7.24) | The root object `extensions.KHR_character: {}`, and `KHR_character` in `extensionsUsed`. Written only when the document declares `character`; all the rows below that name a `KHR_character_*` extension need it | `extensionsUsed`, never `extensionsRequired`, for every `KHR_character*` extension (REQ-16, DEP-10) |
