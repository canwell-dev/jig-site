#### G.4 Transforms

The current transform maps the coordinates a statement gives to model
space; an operation T makes it current · T. A **rotation** by φ about unit
axis a is R = cos φ · I + sin φ · [a]× + (1 − cos φ) · a aᵀ (right-handed;
[a]× is the cross-product matrix). `rotate` uses normalize(axis), and
about `origin` is translate(origin) · R · translate(−origin).

**Euler rotation** (`pose`, the `rotation` of a box, ellipsoid or torus) of radians (x, y, z), after
converting any `_deg` twin (§5.1), is
R = R_Y(y) · R_X(x) · R_Z(z), so a vector turns about Z first, then X,
then Y, with R_X, R_Y, R_Z the right-handed rotations about each axis.
This is the only Euler order in JIG. A bake turns the result into a glTF
quaternion (G.13).

**Removing scale** (a part's axes): with the basis columns x, y, z of the
current transform, x' = normalize(x), y' = normalize(y − x'(x'·y)),
z' = normalize(z − x'(x'·z) − y'(y'·z)). The part frame is (x', y', z')
with origin current(pivot). A vertex p given inside the part is stored as
frame⁻¹ · current · p.

#### G.5 Triangles and primitive construction

**Emitting a triangle** (a, b, c) with an inside point i, all given in the
statement's coordinates: transform all four to part space. If this is the
solid's first triangle, a is its **first point** (for `origin: "solid"`),
even if the triangle is dropped. Let n = (b − a) × (c − a). If |n|² <
1e-14 drop the triangle. If n · ((a + b + c)/3 − i) < 0, swap b and c
(and their surface coordinates) and negate n. The face normal is
normalize(n), and the triangle is stored in the order a, b, c
(counter-clockwise seen from outside). A triangle **facing** a direction d
uses i = (a + b + c)/3 − d. A quad (a, b, c, d) is the triangles (a, b, c)
and (a, c, d).

**Box.** Half size h = size/2. Bottom ring: center + R(sx·h.x, −h.y,
sz·h.z) and top ring with +h.y, for (sx, sz) = (−1, −1), (1, −1), (1, 1),
(−1, 1). A loft of [bottom, top] with caps.

**Lathe.** Profile points (r, y). For each segment p₀ → p₁ with d = p₁ − p₀
not shorter than 1e-6, and i = 0 … sides − 1, with θ₀ = phase + 2πi/sides,
θ₁ = phase + 2π(i + 1)/sides, e(θ) = (cos θ, 0, sin θ) and m =
normalize(e(θ₀) + e(θ₁)): the quad base + e(θ₀) r₀ + y₀, base + e(θ₁) r₀
+ y₀, base + e(θ₁) r₁ + y₁, base + e(θ₀) r₁ + y₁ (y along +Y), facing
m · d.y + (0, −d.x, 0): the profile's right-hand side, turned round the axis.

**Extrude.** The frame: N = normalize(`normal`) (a zero `normal` is an
error); U₀ = `up` if given, else (|N.y| > 0.9 ? (0, 0, 1) : (0, 1, 0));
w = U₀ − N(U₀ · N), an error if |w|² < 1e-12; U = normalize(w); R = N × U.
Outline point (a, b) at height h is P(a, b, h) = `base` + a R + b U + h N.
With the defaults R = +X, U = +Z, N = +Y. With signed area A = Σ (aᵢ
bᵢ₊₁ − aᵢ₊₁ bᵢ) over the outline (closing back to the first point) and t =
A ≥ 0 ? 1 : −1: for each edge p → q with d = q − p, the quad P(p, 0),
P(q, 0), P(q, height), P(p, height), facing t · normalize(d.b R − d.a U).
Then the ear-clipped outline (G.6, in (a, b)) at h = 0 facing −N, and at
h = height facing +N; each cap is one face.

**Loft.** n points per ring, rings r₀ … r_L, centroids c_s. For each s < L
and i, with j = (i + 1) mod n: the quad r_s[i], r_s[j], r_{s+1}[j],
r_{s+1}[i], facing σ · (r_{s+1}[j] − r_s[i]) × (r_{s+1}[i] − r_s[j]), with σ
from G.7. With caps, the first cap faces −σ·N(r₀) and the last σ·N(r_L),
N the Newell normal (G.7); if |N|² < 1e-24 the cap faces c₀ − c₁ (or
c_L − c_{L−1}). A cap is cut by G.7.

**Sweep.** For each path point pᵢ: tangent tᵢ = normalize(p_{min(i+1, last)}
− p_{max(i−1, 0)}). A reference r starts as t₀ × (0, 1, 0), or t₀ ×
(1, 0, 0) if that is shorter than 1e-6 in squared length; at each point
r = normalize(r − tᵢ(r·tᵢ)). Ring i is circle_ring(pᵢ, radius, sides, tᵢ,
r). A loft of the rings.

**Sweep profile.** For each distance d of `path_distances(max(step,
0.01))`, the ring of profile points (z, y) placed at frame(d) · (0, y, z).
A loft of the rings.

**Ellipsoid and torus.** A `sphere` or a lathe made inside a transform,
as §7.16 gives it: every point and inside point goes through that
transform before the facing test above, so a negative radius or a turn
still faces out.

**Polygon.** Triangles (p₀, pᵢ, pᵢ₊₁), i = 1 … n − 2, facing `normal`;
one face. **Mesh.** Each triangle (a, b, c) facing (b − a) × (c − a); each
triangle is its own face.

**Geometry helpers.**

- `circle_ring(c, r, sides, axis, ref)`: a = normalize(axis) (a zero axis
  is an error); r₀ = ref if not zero, else a × ((|a.y| > 0.9) ? (1, 0, 0)
  : (0, 1, 0)); u = normalize(r₀ − a(r₀·a)); v = a × u; point i = c + (u
  cos θᵢ + v sin θᵢ) r with θᵢ = 2πi/sides.
- `rect_ring(c, u, v, hu, hv, ch)`: k = min(ch, 0.9 min(hu, hv)). For
  (sx, sy) = (1, 1), (−1, 1), (−1, −1), (1, −1): if k > 0, two points, in
  this order: when sx·sy > 0, (sx hu, sy (hv − k)) then (sx (hu − k), sy
  hv); otherwise (sx (hu − k), sy hv) then (sx hu, sy (hv − k)); if k ≤ 0
  the one point (sx hu, sy hv). Each 2D point (α, β) becomes c + uα + vβ
  (u and v are not normalized).
- `superellipse_ring(rx, ry, e, n)`: e ≤ 0 is an error; for i = 0 … n − 1,
  θᵢ = 2πi/n, c = cos θᵢ, s = sin θᵢ, point i = (rx · sign(c) · |c|^(2/e),
  ry · sign(s) · |s|^(2/e)), a vec2 (0^(2/e) = 0).
- `bezier(p₀, c, p₁, n)`: p₀, c and p₁ all vec2 or all vec3 (else an
  error); n + 1 points of that size, t = i/n, mix(mix(p₀, c, t),
  mix(c, p₁, t), t).
- `centroid(points)`: their mean; `[0, 0, 0]` for no points.
- `rect_profile(z, hw, y₀, y₁)`: [(z − hw, y₀), (z + hw, y₀), (z + hw, y₁),
  (z − hw, y₁)].

#### G.6 Ear clipping

Used for extrude caps and loft caps, on 2D points P₀ … P_{n−1}:

```text
if n < 3: no triangles
A = Σ over p, with q the previous index (q = n−1 for p = 0): P[q].x P[p].y − P[p].x P[q].y
V = A > 0 ? [0, 1, …, n−1] : [n−1, …, 1, 0]
relaxed = false;  nv = n;  count = 2 nv;  v = nv − 1
while nv > 2:
  c = count;  count = count − 1
  if c ≤ 0:
    if relaxed: return no triangles
    relaxed = true;  count = 2 nv
  u = v (0 if u ≥ nv);  v = u + 1 (0 if v ≥ nv);  w = v + 1 (0 if w ≥ nv)
  if snip(u, v, w): output (V[u], V[v], V[w]);  remove V[v];  nv = nv − 1;  count = 2 nv

snip(u, v, w): a, b, c = P[V[u]], P[V[v]], P[V[w]];  ε = relaxed ? −1e-5 : 1e-5
  if ε > (b.x − a.x)(c.y − a.y) − (b.y − a.y)(c.x − a.x): false
  for every other index p < nv: if inside(a, b, c, P[V[p]]): false
  true

inside(a, b, c, p), with the cross products
  k₁ = (c − b) × (p − b),  k₂ = (a − c) × (p − c),  k₃ = (b − a) × (p − a):
  strict (relaxed): k₁ > 0 and k₂ > 0 and k₃ > 0
  otherwise:        k₁ ≥ 0 and k₂ ≥ 0 and k₃ ≥ 0
```

If ear clipping gives no triangles, the cap is fanned like a polygon.

#### G.7 Loft orientation and caps

With o the mean of the ring centroids and τ(a, b, c) = (a − o) · ((b − o)
× (c − o)), sum τ over the side triangles (r_s[i], r_s[j], r_{s+1}[j]) and
(r_s[i], r_{s+1}[j], r_{s+1}[i]) and the cap fans (c₀, r₀[j], r₀[i]) and
(c_L, r_L[i], r_L[j]) for every i: V = Σ τ, S = Σ |τ|. σ = sign(V) if |V| >
1e-5 S, otherwise 1.

The Newell normal of a ring is N = Σᵢ ((pᵢ.y − pᵢ₊₁.y)(pᵢ.z + pᵢ₊₁.z),
(pᵢ.z − pᵢ₊₁.z)(pᵢ.x + pᵢ₊₁.x), (pᵢ.x − pᵢ₊₁.x)(pᵢ.y + pᵢ₊₁.y)), closing
back to the first point. A cap: if |N|² < 1e-24, fan it like a polygon.
Otherwise n̂ = normalize(N), u = normalize(n̂ × ((|n̂.x| < 0.9) ? (1, 0, 0) :
(0, 1, 0))), w = n̂ × u; ear-clip (G.6) the points (p·u, p·w) and emit the
triangles facing the cap's direction, as one face.

#### G.8 Grain

A `grain` statement with value g stores G = T · g, with T the basis of the
transform current where it runs (G = 0 when g is zero). A face's grain is
normalize(P · G), with P the basis of the part frame⁻¹, when the block's
G is not zero; otherwise it is normalize(B · a), with B the basis of
(part frame⁻¹ · current transform) and a the primitive's automatic grain
(§7.15.5) for that face. With no grain the vertex grain is zero.

#### G.9 Smoothing

Per part, after the build: group vertices by (solid, ⌊x·10⁵⌉, ⌊y·10⁵⌉,
⌊z·10⁵⌉), positions in part space, ⌊·⌉ rounding half away from zero. Each
triangle t has face normal n_t and crease angle θ_t (its solid's `smooth`).
For each vertex v of triangle t:

```text
if θ_t = 0: normal = n_t
else:
  sum = Σ over vertices w in v's group, of triangle t_w with θ_{t_w} > 0
        and n_t · n_{t_w} ≥ cos θ_t and not split(v, t, t_w):   n_{t_w} × angle(w)
  normal = |sum|² > 1e-30 ? normalize(sum) : n_t
angle(w) = acos(clamp(ê₁ · ê₂, −1, 1)), ê₁, ê₂ the unit edges from w to the
           other two corners of its triangle; 0 if either edge has zero length
split(v, a, b) = true when v is a sharp ring point h of a chain loft's
           ring (G.22) and one of a and b lies in column (h − 1) mod N
           and the other in column h
```

A chain loft's bridge strip (G.22) takes no part: its triangles are left
out of every sum, and its vertices keep the normals they copy.

#### G.10 Texture coordinates

For a face with a texture, each vertex first gets raw coordinates: its
surface coordinates (§7.6) when the texture is `fit: "surface"` and the
primitive provides them, otherwise (q·u, q·v) with the face frame of §7.6
and q = p, or p minus the solid's first point for `origin: "solid"`. The
grain test of §7.6 applies when `align` is `grain` and the grain isn't
zero. Then, per face, with s the piece seed, σu = random_offset ? 7.31 s :
0 and σv = random_offset ? 3.17 s : 0, the **stored** coordinates (the
glTF convention, v down the image) are:

| case | stored (u, v) |
|---|---|
| `tile`, or `surface` with `size` and surface coordinates | ((u + offset.u)/size.u + σu, −((v + offset.v)/size.v + σv)) |
| `surface` without `size`, with surface coordinates | (u, 1 − v) |
| `face`, or `surface` on a face without surface coordinates | ((u − u_min)/max(u_max − u_min, 1e-9), 1 − (v − v_min)/max(v_max − v_min, 1e-9)), over the face's vertices |
| no texture | (0, 0) |

Lathe surface coordinates: u = i/sides (× 2π r with `size`), v = distance
along the profile (as a fraction of its length without `size`). A
`torus` is a lathe here. Ellipsoid: without `size`, its unit sphere's
coordinates; with `size`, for the point at step i round and step j up,
u = the sum of the lengths of the ring's edges from point 0 to point i
and v = the sum of the lengths of the meridian's edges from the bottom
pole to point j, both measured after the scale by `radii` (rotation and
translation don't change them). Loft: u =
distance round the ring from its first point (as a fraction of that ring's
perimeter without `size`), v = distance between centroids from the first
ring (fraction of the total without `size`). Chain loft (G.22): u as a
loft's, round each ring from its point 0; v = the ring's t, or t · L
(metres along the curve) with `size`; a `point` tip takes, in each fan
triangle, the mean u of the triangle's two ring points and its own t; a
bridge strip's vertices keep their rings' v, with u made continuous
along the walk (G.22 step 11). Extrude walls: u = distance
along the outline (fraction of the perimeter without `size`), v = 0 at the
bottom and height (or 1) at the top.

#### G.11 Paths

A host curve is points Pₖ with handles inₖ and outₖ relative to the point.
Segment k is the cubic Bézier B(t) with control points Pₖ, Pₖ + outₖ,
Pₖ₊₁ + inₖ₊₁, Pₖ₊₁.

**Baking.** Start with the list [P₀] and distance 0. For each segment:
take m = max(16, ceil(L_c / 0.005)) with L_c the length of its control
polygon; tabulate B at t = j/m and the running chord lengths ℓⱼ; let ℓ =
ℓ_m and count = max(1, ceil(ℓ / 0.2)). For k = 1 … count, find the target
ℓ·k/count in the table, interpolate t linearly between the bracketing
entries, and append B(t) (exactly Pₖ₊₁ for k = count); each appended
point's distance is the previous distance plus the straight distance from
the previous point. The path length is the last distance.

**Sampling** at distance d (clamped to 0 – length): find the baked points
p₁, p₂ whose distances bracket d, t the fraction between them, p₀ and p₃
their outer neighbours (repeating the ends), and take

```text
0.5 × (2p₁ + (p₂ − p₀) t + (2p₀ − 5p₁ + 4p₂ − p₃) t² + (3p₁ − p₀ − 3p₂ + p₃) t³)
```

**Frame** at d (clamped): forward f = sample(min(d + 0.05, length)) −
sample(max(d − 0.05, 0)); side z = f × (0, 1, 0), or (0, 0, 1) if |z|² <
1e-8; f and z normalized; up y = z × f. The frame has axes (f, y, z) and
origin sample(d). On the straight default the frame is the translation
(d − length/2, 0, 0), not clamped. `path_point(d)` is the frame's origin,
`path_forward(d)` its f.

#### G.12 Data decoding

Each number is read from its bytes, little-endian: `f16`, `f32` as IEEE
754 binary16 and binary32, converted exactly to binary64; integers as
two's complement (`i…`) or unsigned (`u…`). With `normalized: true`, an
integer c becomes, as in glTF:

| type | value |
|---|---|
| `i8` | max(c / 127, −1) |
| `u8` | c / 255 |
| `i16` | max(c / 32767, −1) |
| `u16` | c / 65535 |

Number j of element i (§7.7) starts at byte offset + i × stride + j ×
size, where size is the number size and stride is `stride` if given,
else the element's size in bytes (the number size times its count of
numbers). The numbers are then nested by `shape`, outermost axis first;
an element of 2 or 3 numbers becomes a vec2 or vec3 (§7.7).

#### G.13 Baked node transforms

A part's node carries its transform relative to its parent part,
M = (parent frame)⁻¹ · (part frame) · pose (§7.15.7): a translation t
and an orthonormal 3×3 matrix B, which has determinant −1 when the part
frame is mirrored (G.4 keeps a mirror). The node's `translation` is t.
If det B > 0, its `rotation` is q(B) and it has no `scale`. If det B < 0,
its `scale` is (1, 1, −1) and its `rotation` is q(B · diag(1, 1, −1)).
The root part's node and the model root node have the identity
transform. A zero translation, an identity rotation and a unit scale may
be left out.

q(R), for a rotation matrix R with entries Rᵢⱼ (row i, column j), is the
unit quaternion (x, y, z, w) with w ≥ 0:

```text
tr = R₀₀ + R₁₁ + R₂₂
if tr > 0:
  s = 2√(1 + tr);            (x, y, z, w) = ((R₂₁ − R₁₂)/s, (R₀₂ − R₂₀)/s, (R₁₀ − R₀₁)/s, s/4)
else if R₀₀ ≥ R₁₁ and R₀₀ ≥ R₂₂:
  s = 2√(1 + R₀₀ − R₁₁ − R₂₂); (x, y, z, w) = (s/4, (R₀₁ + R₁₀)/s, (R₀₂ + R₂₀)/s, (R₂₁ − R₁₂)/s)
else if R₁₁ ≥ R₂₂:
  s = 2√(1 + R₁₁ − R₀₀ − R₂₂); (x, y, z, w) = ((R₀₁ + R₁₀)/s, s/4, (R₁₂ + R₂₁)/s, (R₀₂ − R₂₀)/s)
else:
  s = 2√(1 + R₂₂ − R₀₀ − R₁₁); (x, y, z, w) = ((R₀₂ + R₂₀)/s, (R₁₂ + R₂₁)/s, s/4, (R₁₀ − R₀₁)/s)
if w < 0: negate x, y, z and w
```

then divided by its length (Shepperd's method). Because glTF decides which side of a
triangle is the front by the determinant of the node's global transform,
triangles stored counter-clockwise in part space still face out under a
mirrored node.

#### G.14 Convex hulls

The convex hull of a set of points is the smallest convex solid holding
them all; its surface is unique, so readers agree on it whatever
algorithm they use, within §8.3's tolerances. Points closer than 1e-9 m
to each other are one point. A set that spans no volume (all points on a
plane, a line or one point) has a flat or empty hull, with no volume.
The hull's points are a subset of the input points, in its part space.
A chain loft's points are split by strongest bone first (§7.22.2), each
set moved from the home part's space to its bone's part space by
(frame of the bone)⁻¹ · (frame of the home part); mass (G.15),
clearance (G.16) and outlines (G.17) follow from those colliders.

**Fixed point sets.** A box, cylinder, sphere or capsule that a
transform no longer keeps that shape (§7.22.2), and an ellipsoid that
isn't kept a sphere (as the sphere of radius 1 inside its transform,
§7.16), is hulled from these
points, given in the shape's own frame (centred as Khronos centres it,
§7.22.2) and then moved by the shape's own placement and the current
transform into part space. A **ring** of radius r at height y is the 64
points (r cos θᵢ, y, r sin θᵢ), θᵢ = 2πi/64, i = 0 … 63, or the single
point (0, y, 0) when r is 0.

| shape | points |
|---|---|
| box | its 8 corners (±size.x/2, ±size.y/2, ±size.z/2) |
| cylinder | a ring of `radius` at y = −height/2 and a ring of `radius_end` at y = +height/2 |
| sphere | for i = 0 … 16, φ = πi/16: the point (0, y, 0) for i = 0 and 16, else a ring of radius r sin φ at y = −r cos φ |
| capsule | for i = 0 … 8, φ = (π/2)·i/8, and for each end (centre −height/2, radius `radius`, sign −1) and (centre +height/2, `radius_end`, sign +1): a ring of radius ρ = r sin φ at y = centre + sign · r cos φ, or the point (0, y, 0) when i = 0 or ρ = 0 |

#### G.15 Mass properties

For each collider with volume V > 0 and density ρ: mass m = ρV, centre
c and inertia tensor I about c of the uniform solid:

- box of size (a, b, c): I = m/12 · diag(b² + c², a² + c², a² + b²) in
  the box's axes;
- sphere of radius r: I = 2/5 · m r² · identity;
- cylinder of height h and radii r₀ (bottom) and r₁ (top): the solid of
  revolution about +Y, a cone frustum, with its centre and inertia from
  the closed-form integrals over it;
- capsule: the solid of revolution of its profile (§7.16), the sum of
  its two half balls and its frustum;
- hull: the sum of the tetrahedra from the hull's first point to each
  face triangle, each with the tetrahedron's closed-form centre and
  inertia.

A body's mass is Σ m, its centre C = Σ m·c / Σ m, and its tensor the
sum of each collider's I turned into the body's axes and moved to C by
the parallel-axis rule. A bake writes the tensor's principal moments as
`inertiaDiagonal` and the rotation to its principal axes as
`inertiaOrientation`; readers agree on the tensor, and on the principal
axes where the moments differ by more than 1e-9 relative.

#### G.16 Swept clearance

A joined part's inferred clearance (§7.23.1) is the axis-aligned box, in
its parent part's frame, that holds the points of its body's colliders
swept as follows. The points are those of the colliders (implicit shapes
as the hull of 64 equal points round each circle, a hull as its points),
in the part's space. P is the transform from the part's space to its
parent part's space, without the pose; a point q lands at P q.

1. **Rotation, one axis at a time.** Each rotation axis (X, Y or Z of
   the part) whose limit is not `false` is swept on its own, the other
   two at 0. For a point q, let a be its part along the axis, v = q − a
   and w = axis × v. At angle θ it is at P (a + v cos θ + w sin θ). The
   range of θ is [min, max], or [0, 2π] for a free axis. For each
   coordinate X, Y and Z of the parent frame, let A and B be that
   coordinate of the rotation part of P applied to v and to w; skip the
   coordinate when A and B are both 0. The box holds the point at θ =
   min, at θ = max, and at every θ = atan2(B, A) + nπ (n any integer)
   within the range, where that coordinate of the arc is greatest or
   least. The box is the smallest one holding the points of all the
   axes: the union of the per-axis boxes. A pose turned about two axes at
   once can lie outside it, so for such a joint the box is an
   approximation (OI-20). With no rotation axis, the box holds P q for
   every point q, at rest.
2. **Slides, summed.** For each slide axis with a range [s₀, s₁], let d
   be the part's axis in the parent frame (that column of P's rotation
   part). The box grows on each parent axis c: its minimum by min(d_c s₀,
   d_c s₁) and its maximum by max(d_c s₀, d_c s₁). Slide axes are applied
   one after another and the growths add, so the order doesn't matter: a
   slide combined with rotation, or with another slide, widens the
   rotation's box by the sum of the slide ranges. A free slide has no
   bound and does not widen the box.

The result is the box's centre and size, computed in 64-bit floats;
readers agree to relative 1e-9 (§8.3). A joint whose axes are all locked,
and a body without collider points, infer nothing.

#### G.17 Outlines seen from above

The outline of a collider within a band [y₀, y₁] is the convex hull,
projected onto the XZ plane, of the collider clipped to the band. Round
shapes count as points first: 32 equal points round each circle, the
cylinder's two end circles, and circles at equal heights over a sphere
or a capsule's ends. The clipped solid is the hull of those points:
its points inside the band, and where its edges cross y₀ and y₁. A collider that does not reach into the band
has no outline. Points are in model space, rounded to 1e-6 m.

#### G.18 Sampling clips

For a clip of length L seconds (0.001 ≤ L ≤ 600, §7.25.1), the sample
rate is 30 Hz. With n = ⌈30 · L − 10⁻⁶⌉, the key times are

```text
t_k = k / 30      for 0 ≤ k < n   (one binary64 division)
t_n = L
```

so there are n + 1 keys, the first at 0 and the last exactly at L, and
t_(n−1) < L, which keeps the times strictly increasing. At most 18,001
keys result (§11). If 30 · L is a whole number, t_n = n / 30 as well.

**A key too close to the last one is left out.** If n ≥ 1 and
L − (n − 1) / 30 < 0.001, computed in binary64 exactly as written (1 ms: L is a hair above
(n − 1) / 30; so L = 1.001 drops the key at 1 s), the key t_(n−1) is dropped, and the keys are t_0 … t_(n−2), then L: n keys. The
key at L stays, and so does the key at 0 (L ≥ 0.001). A reader that
stores key times as 32-bit floats, as glTF and Godot do, would otherwise
round the two to one time. So L = 1.0005 s (30 · L = 30.015, n = 31)
gives 31 keys, not 32, the last two of them 29 / 30 and 1.0005; L = 1 s
and L = 31 / 30 s give 31 and 32 keys.

**A clip with `reverse`** (§7.25.1) has the keys of the clip it names, with
the same L and n, and the same key left out. At its key t_k a reader binds
`t` to s = L − t_k (one binary64 subtraction; 0 at the last key, L at the
first) and `u` to s / L (one division; 1 at the first key), and evaluates the
channels of the clip it names with them. The quaternion signs are then
chosen along the keys of the reversed clip, in its own order, as below.

At each key a reader binds `t` to t_k and `u` to t_k / L (one binary64
division; 1 at the last key), evaluates the part's channel
values (§7.25.2) and builds the part's local matrix, as in §7.15.7 and
G.13:

```text
M_k = (parent frame)⁻¹ · (part frame) · T(move_k) · Pose_k
```

where `move_k` is the `move` value (0 if the clip has no `move`
channel), and Pose_k the rotation of G.4 from the `pose` or `pose_deg`
value (the part's own static pose if the clip has no such channel).
Pose rotates about the pivot, which is the part frame's origin, so
the translation of M_k is t_F + A · `move_k`, where t_F and A are the
translation and linear part of (parent frame)⁻¹ · (part frame).

- A `rotation` channel holds, per key, the quaternion q(B_k) of G.13,
  with B_k the linear part of M_k (turned by diag(1, 1, −1) when its
  determinant is negative, as G.13 says). The first key keeps w ≥ 0.
  For every later key, if the four-component dot product of q_k with the
  **already chosen** q_(k−1) is negative, q_k is negated, so a linear
  interpolation between keys takes the short way. Mirroring is not
  animated: a mirrored part's `scale` stays (1, 1, −1).
- A `translation` channel holds the translation of M_k.
- A `weights` channel of a `morph` holds, per key, the weight vector of
  one node: the mesh's targets in their glTF order, each the key's value
  when the channel names it, else the weight the node was built with (the
  asset's `morph` value, or the mesh's own default weight).

The **reference rotation** of a part (§7.24.4) is q(B) of G.13 for M with
`move` 0 and every `pose` 0.

#### G.19 Skinned geometry

A bake skins the mesh of every part of a character, and of every home
part of a blended solid in any model (§9.1). Let W_j be the **reference
world matrix** of part j: the product of the local matrices M (§7.15.7,
with every `pose` 0 and no `move`) from the root part `body`
(identity) down to part j, which is part j's frame (G.4). Its linear
part is orthonormal, with determinant −1 where an odd number of the
parts' frames on the way are mirrored.

- Every vertex position v of a skinned part j's mesh, in its part space,
  is written as W_j · v, and every normal as the linear part of W_j
  applied to it (an orthonormal matrix, so no inverse transpose). The
  vertices are therefore in **model space at the reference pose**,
  whatever the part's own static pose, and the node's own transform
  plays no part in skinning (glTF 2.0, skins). Blended vertices are
  already stored at the reference pose in the home part's space
  (§7.15.7), so the same W_j applies.
- If the determinant of W_j's linear part is negative, the order of each
  triangle's second and third vertices is swapped, so triangles stay
  counter-clockwise seen from outside.
- `JOINTS_0` of a rigid vertex of part j holds the index of j in the
  skin's joints, and `WEIGHTS_0` holds (1, 0, 0, 0). A blended vertex
  holds its parts' indices and weights as G.22 keeps them: at most 4,
  ordered by weight descending and then joint index ascending, summing
  to 1, padded with joint 0 and weight 0. The joints list the parts in
  creation order, the root part first. Weights are written as floats,
  unquantised.
- Part j's inverse bind matrix is W_j⁻¹.

At the reference pose a joint matrix W_j · W_j⁻¹ is the identity, and the
skinned figure is the model built with every part's `pose` 0. A node's
own translation, rotation and scale (G.13) are the part's built pose,
which may differ from the reference pose when the document sets a static
`pose`.

**Showing a build.** A reader that draws blended geometry itself skins it
by linear blending: a vertex v stored in home part h's space with parts
j₁ … j₄ and weights w₁ … w₄ is drawn at Σ wᵢ · P_{jᵢ} · W_{jᵢ}⁻¹ · W_h · v
in model space, P_j part j's world matrix in the built pose (its built
local transforms, poses included, from the root down). Normals use the
linear part of the same sum, normalized.

#### G.20 Sampling actions

For a phase of length L (§7.26.2; for a `reverse` phase, the length of the
phase it names), the number of keys and the key times are those of G.18:
n = ⌈30 · L − 10⁻⁶⌉, t_k = k / 30, t_n = L, and the key t_(n−1) left out
by the same rule. At key k a reader binds `t` to t_k and `u` to t_k / L
(one binary64 division), in the global scope of §7.26.1, and evaluates,
whatever the order written:

- of a target, `at` (three numbers), its rotation (`rotation` or
  `rotation_deg`) if it has one, its `pole` (three numbers) if it has
  one, and `weight`, which is clamped to 0–1;
- of a bone channel, `pose` or `pose_deg`.

A rotation, given as angles about X, Y and Z, is the rotation of G.4
for that pose (degrees converted to radians first), written as the
unit quaternion q(R) of G.13. The first key keeps w ≥ 0, and each later key is
negated when its four-component dot product with the already chosen
previous key is negative, as G.18 says. A target that has no rotation has
no rotation samples.

A phase with `reverse` has the keys of the phase it names. At its key
t_k every value of the named phase is evaluated with `t` bound to
s = L − t_k and `u` to s / L, as G.18 does for a clip, and the quaternion
signs are chosen along its own keys.

An attach event's `from`, `until`, `at` and rotation are evaluated once,
with no `t` or `u`. The offset rotation is written as a quaternion in
the same way, with w ≥ 0. In a `reverse` phase the interval becomes
`from` = L − `until` and `until` = L − `from`, and the offset and `keep`
stay. Its `release` is not the named event's but the release of the
previous event of the same prop in the named phase, the one with the
latest `until` at or before the event's `from` (§7.26.5), as that
event's output gives it: a place, `"keep"`, or none; with no previous
event in the named phase, none, whichever phase is named. A release place's `at` and rotation are evaluated once in the
same way.

A held target or bone of a phase with `hold` (§7.26.2) has, at every key
of the phase, the value of the last key of the phase before it, as that
phase's output gives it (a `reverse` phase's own last key), with the
quaternion negated if needed so that w ≥ 0, as for a first key. A
`reverse` of a phase with held values samples them like its other values.

A phase's clip (§7.26.6) is sampled as G.18 says, with the same keys.

**Merging a pair** (§7.26.12). Let M be the model's output (§7.26.10) and
O the character's override of a phase, when it has one. The reader goes
through the model's phases in the order of §7.26.8 (a phase after the
phases it reads) and makes each merged phase P′ of the model's phase P:

1. **Which override.** O(P), the character's override of P, if it has
   one. Else, when P is the `reverse` of Q, P′ is Q′ backwards: each value
   of Q′ that comes from O(Q) is evaluated at P's key t_k with `t` bound
   to s = L − t_k and `u` to s / L, as G.20 does for a reverse, and every
   other value of Q′ (the model's, and Q′'s held ones) is taken as the
   reverse takes it; go to step 5. Else O(P) is empty and the steps
   below still run, so a held target holds the merged last key.
2. **Drop** (V-55) every override target of O(P) that names, in any of its
   values, `model_at(r)` or `model_weight(r)` of a role r that M's P
   lacks, or `model_at(r)` of a target whose `on` is not the `on` of the
   target being written (step 3), or that is of a role M's P lacks and has
   no `at`.
3. **Merge.** The own targets of P are those P writes, or, for a reverse
   P, all of M's P. For each own target, in order: when O(P) has its role,
   each of `at`, rotation, `pole` and `weight` that O(P) gives replaces M's
   samples of it (a rotation or `pole` given to a target with none gives it one);
   the `on` is M's. Then each other role of O(P), in the order O(P)
   writes them: a role M's P holds takes that held target's `on` and
   replaces its values as above; a role M's P lacks is a new target with
   no `on`, its `at`, its rotation and `pole` when given, and `weight` 1
   when not given.
4. **Hold.** When P has `hold`, every target of the merged phase before
   it that step 3 hasn't given P′ is added, in that phase's order, with
   every key equal to its last key, as for a held target above.
5. Values are sampled at P's keys: at key k, `t` and `u` as for P (step
   1 for a reverse), then O(P)'s `let` names that a kept target reads, in
   the order written; `model_at(r)` gives M's P `at` of r at key k and
   `model_weight(r)` its clamped weight at key k (for a reverse with no
   O(P), M's P at key k is M's Q at s). `weight` is clamped to 0–1;
   rotations become quaternions with the sign rule above, along P's keys.

Bones, attach events, the length and the keys are M's. The overrides of an
action or phase the model lacks are not read.

#### G.21 Arm offsets of an A-pose

For an `a_pose` character (§7.24.2), after the build, for each side s
with T-pose direction t (`left`: (1, 0, 0); `right`: (−1, 0, 0)):

```text
J = model-space origin of the node with role {s}UpperArm, at the reference pose
K = model-space origin of the node with role {s}LowerArm, at the reference pose
if |K − J| < 1e-6: run-time error at character.reference_pose
a = normalize(K − J);  c = clamp(t · a, −1, 1)
if c < −0.9999: run-time error at character.reference_pose   (an arm across the body)
if c > 1 − 1e-12: D_s = identity
else: D_s = rotation by acos(c) about normalize(t × a)   (G.4)
```

A node's model-space origin is the translation of its global transform:
the placed asset's transform times the node's own up to the asset's
node (§7.21.1). D_s is given as the quaternion (n sin(θ/2), cos(θ/2)),
which has w ≥ 0. It has no twist about the arm, so only the arm's
direction is read, never the rig's own bone axes. A host that plays a
bake finds the same offsets from the baked nodes at the reference pose.

#### G.22 Chain lofts

The construction of a `chain_loft` (§7.16.1), in this order. Every
point is in the statement's coordinates, as other primitives' arguments
are, until G.5 emits the triangles into the home part's space. S is the
current transform, frame(j) part j's frame (G.4), and J(j) part j's
index in creation order, the root part 0 (its joint index, G.19).

**1. Points.** With `chain` (parts j₀ … j_{n−1}): a run-time error at
`chain` unless each part exists, each j_k is a direct child of j_{k−1},
all have frames of one determinant sign, and |det| of S's linear part is
at least 1e-12. The curve's input points are S⁻¹ · origin(frame(j_k))
for k = 0 … n − 1, then `end`. The **front** F is S⁻¹'s linear part
applied to frame(j₀)'s +Z, normalized, and the **up** U the same of its
+Y. With `path`: the points as given. Walk the points in order and keep
each one that is at least 1e-6 m from the last one kept; a chain point
that isn't kept stands for the kept point it is close to. With fewer
than 2 kept points the primitive draws nothing: no triangles, no
`weights` evaluation, no warnings and no strip (a bridge to or from it
makes no strip), though its `id` is still taken. A bridge whose target
draws nothing is still checked in full (step 11) and still marks the
target's end bridged, so a second bridge to it is the "already bridged"
error; only the strip is left out. Every other key is
still evaluated and checked as below first (`blend`, the sections'
values, outlines, anchors and matching, the `ends` entries), so a
value that is wrong is an error whether or not anything is drawn.

**2. Curve.** Kept points P₀ … P_m (m ≥ 1), with P₋₁ = 2P₀ − P₁ and
P_{m+1} = 2P_m − P_{m−1}. Segment i (i = 0 … m − 1) runs from Pᵢ to
Pᵢ₊₁ along the centripetal Catmull–Rom curve (α = 0.5) of (A, B, C, D) =
(Pᵢ₋₁, Pᵢ, Pᵢ₊₁, Pᵢ₊₂), at s ∈ [0, 1] (Barry–Goldman):

```text
k0 = 0, k1 = k0 + |B − A|^0.5, k2 = k1 + |C − B|^0.5, k3 = k2 + |D − C|^0.5
x  = k1 + s (k2 − k1)
A1 = ((k1 − x) A + (x − k0) B) / (k1 − k0)
A2 = ((k2 − x) B + (x − k1) C) / (k2 − k1)
A3 = ((k3 − x) C + (x − k2) D) / (k3 − k2)
B1 = ((k2 − x) A1 + (x − k0) A2) / (k2 − k0)
B2 = ((k3 − x) A2 + (x − k1) A3) / (k3 − k1)
Cᵢ(s) = ((k2 − x) B1 + (x − k1) B2) / (k2 − k1)
```

**3. Arc length and t.** Sample each segment at s = j/64, j = 0 … 64,
and sum the chord lengths in order over all segments: ℓ at every
sample is the running total from P₀, so a segment's first ℓ equals the
previous segment's last (the same point); L is the total. Q(d), the curve point at distance d (clamped to
0 … L): find samples j, j + 1 of one segment whose ℓ bracket d (the
first such pair), take s = (j + (d − ℓⱼ) / (ℓⱼ₊₁ − ℓⱼ)) / 64 (s = j/64
when ℓⱼ₊₁ = ℓⱼ), and evaluate Cᵢ(s). The tangent at d is
T(d) = normalize(Q(min(d + δ, L)) − Q(max(d − δ, 0))), δ = 10⁻³ L. A
point's t is its ℓ / L; chain part k's t_k is the t of its kept point
(t₀ = 0); the **joints** are k = 1 … n − 1, and t_n = 1 stands for `end`.

**4. Rings.** b_k = max(`blend`[k − 1], 0) (a `blend` that isn't a list
of n − 1 numbers is a run-time error at `blend`; all 0 when not given),
and the half width h_k = min(b_k / (2L), (t_k − t_{k−1}) / 2,
(t_{k+1} − t_k) / 2). The rings are at τ = i / `steps` for i = 0 …
`steps`, then, for each joint k in order, at t_k − h_k/2, t_k and
t_k + h_k/2; sorted by τ, a stable sort in that listing order. A `point`
end adds a **tip ring** before the first ring (τ = 0) or after the last
(τ = 1): N copies of one point, C = Q(τL). They are one point, and
none of them is a sharp ring point, so G.9 never splits normals at a tip.

**5. Frames.** Ring r has C_r = Q(τ_r L) and T_r = T(τ_r L). The
reference x starts, with `chain`, as F − T₀(F · T₀), or U − T₀(U · T₀)
when that has a squared length below 1e-12; with `path`, as
T₀ × (0, 1, 0), or T₀ × (1, 0, 0) when that has a squared length below
1e-6 (the `sweep` start, G.5). Then, for each ring in order, ring 0
included: x = normalize(x − T_r (x · T_r)), X_r = x and Y_r = T_r × x.

**6. Outlines.** Each section becomes a closed **outline**: pieces joined
end to start, a point 0, a length Λ, and named anchors at distances
along it, each sharp or not. A piece is straight, or a command curve
with a table of its points at u = j/64, j = 0 … 64, and their running
chord lengths. The point at distance d is found on its piece (a
distance at the joint of two pieces belongs to the later piece): on a
straight piece by linear interpolation; on a curve as in step 3,
u = (j + fraction) / 64, evaluated on the curve.

- A `ring` (a run-time error at `ring` unless it is a list of at least 3
  vec2): straight pieces Pᵢ → Pᵢ₊₁, the last back to P₀. Anchor `X: a`
  (a whole number 0 … n − 1, else a run-time error at `anchors.X`) is
  at the distance of P_a.
- A closed `path`: one piece per `L`, `Q` or `C`, from the previous
  command's end point (`M`'s first); `Q` is the curve (1 − u)² P₀ +
  2u(1 − u) P₁ + u² P₂ and `C` the curve (1 − u)³ P₀ + 3u(1 − u)² P₁ +
  3u²(1 − u) P₂ + u³ P₃. `Z` then adds a straight piece back to the `M`
  point when the last end point is farther than 1e-9 m from it. Point 0
  is the `M` point; a command's `anchor` is at the end of its piece
  (`M`'s at 0). Anchor distances are taken mod Λ: an anchor on a last
  command that ends on the `M` point (so no `Z` piece) is at 0, the
  `M` point, and with an anchor on `M` too that is two anchors at one
  distance (below). A command value of the wrong type is a run-time error at
  it (`sections[1].path[2].Q`).
- An **open curve**: its centre line is the `line`'s points, or the
  `path`'s `M` point, each `L`'s end point and each `Q`'s and `C`'s
  points at u = j/64, j = 1 … 64. A point within 1e-9 m of the one before
  is left out (an anchor on it moves to the kept one); fewer than 2 left
  is a run-time error at `line` or `path`. `thickness` must be 2 numbers
  ≥ 0 with a sum above 0 (else a run-time error at `thickness`): l, r.
  With dᵢ the unit direction of centre segment i and its left normal
  nᵢ = (−dᵢ.y, dᵢ.x): the first point's offsets use the first segment's
  n and the last point's the last segment's. At an inner point c with
  incoming n₁ and outgoing n₂: if 1 + n₁ · n₂ ≥ 1/8 (a mitre at most 4
  times the thickness) it has one offset per side, c + w (n₁ + n₂) /
  (1 + n₁ · n₂); else two, a bevel, c + w n₁ then c + w n₂ in the
  direction of travel; w = l on the left and −r on the right. The
  outline is the left offsets from the first point to the last, the end
  tip, the right offsets from the last point back to the first, and the
  start tip, as straight pieces; point 0 is the first left offset.
  `flat` tips add no points. `round` tips add, at the end, the points
  m + ρ(cos φ · n + sin φ · d) and, at the start, m − ρ(cos φ · n +
  sin φ · d), for φ = πk/64, k = 1 … 63, with m the middle of that end's
  two offsets, ρ = (l + r)/2, and n and d that end segment's normal and
  direction. Anchors: an anchor `X` on centre point i gives `X_left` at
  its left offset and `X_right` at its right offset (at a bevel, the
  first of the two in outline order), sharp when `X` is; `flat` adds the
  sharp anchors `start_left`, `end_left`, `end_right` and `start_right`
  at the four corners; `round` the smooth anchors `end` and `start` at
  k = 32 of each tip.
- Two anchors at the same distance are a run-time error at the section.
  So, with `flat` tips, is an anchor on an open curve's first or last
  centre point: that corner is already `start_left` and `start_right`
  (or `end_left` and `end_right`).
- **Winding.** A = ½ Σ (xᵢ yᵢ₊₁ − xᵢ₊₁ yᵢ) over the outline's points
  (the piece ends, and each curve piece's 63 inner samples), closing back
  to the first. If A < 0 the outline is reversed: the point at distance
  d becomes the old one at (Λ − d) mod Λ, and so do the anchors.

**7. Matching.** Let the first section's anchors, by distance, be
X₀ … X_{K−1}. Every section must have the same anchors in the same
cyclic order (else a run-time error at the section,
`build[0].chain_loft.sections[2]`). Span k runs from X_k to X_{k+1}, the
last back round to X₀; with K = 0 there is one span, the whole outline
from point 0. Each ring has N = max(`sides`, K) points. With m_k the
mean over the sections of span k's length, K' = max(K, 1), R = N − K'
and M = Σ m_k: q_k = R · m_k / M (R / K' when M = 0); span k gets
n_k = 1 + ⌊q_k⌋ points, and the R − Σ⌊q_k⌋ left over go one each to the
spans with the largest q_k − ⌊q_k⌋, chosen one at a time: the largest
fraction left, and among the fractions within 1e-9 of it the lowest k. A ring's points are span 0's, then span
1's, and so on; point j of span k (j = 0 … n_k − 1) is at the span's
start plus its length · j / n_k. An anchor is sharp when any section
marks it sharp; its ring index is its span's first point.

**8. Interpolation.** Each number (each ring point's x and y, `offset`'s
x and y, `rotation` in radians, `scale`'s x and y) has values v_s at the
sections' t_s (a run-time error at `sections[i].t` unless each t is a
number in 0–1 above the one before). With one section it is v₀. Else,
outside [t₀, t_{S−1}] it is the nearer end value, and inside it the
Fritsch–Carlson monotone cubic:

```text
δ_s = (v_{s+1} − v_s) / (t_{s+1} − t_s)             s = 0 … S − 2
m₀ = δ₀,  m_{S−1} = δ_{S−2}
m_s = δ_{s−1} δ_s > 0 ? (δ_{s−1} + δ_s) / 2 : 0      s = 1 … S − 2
for s = 0 … S − 2, in order:
  if δ_s = 0: m_s = 0, m_{s+1} = 0
  else: a = m_s / δ_s, b = m_{s+1} / δ_s
        if a² + b² > 9: k = 3 / √(a² + b²), m_s = k a δ_s, m_{s+1} = k b δ_s
value at t in [t_s, t_{s+1}], h = t_{s+1} − t_s, x = (t − t_s) / h:
  (2x³ − 3x² + 1) v_s + (x³ − 2x² + x) h m_s + (−2x³ + 3x²) v_{s+1} + (x³ − x²) h m_{s+1}
```

Ring r's point j, from its interpolated (x, y), scale (σx, σy), rotation
θ and offset (ox, oy), is p = (σx x cos θ − σy y sin θ + ox,
σx x sin θ + σy y cos θ + oy), placed at C_r + p.x X_r + p.y Y_r. A tip
ring's points are its C.

**9. Weights.** With `path`, every vertex is bound to the home part with
weight 1. With `chain`, `blend`'s weights at τ are, per chain part: 1
for part p, the largest k with t_k ≤ τ, and 0 for the others; except
where |τ − t_k| < h_k for a joint k: there s = smoothstep(t_k − h_k,
t_k + h_k, τ), part k − 1 gets 1 − s and part k gets s. With `weights`,
the expression is evaluated for each ring point, with `angle` =
atan(p.y, p.x) plus 2π when negative and `point` = (frame of the home
part)⁻¹ · S · the point, and once for each tip, with `angle` 0; a cap
vertex takes its ring point's weights. Then negative weights become 0,
and all 0 is a run-time error at `weights`. The parts with a weight
above 0 are ordered by picking one at a time: the largest weight left,
and among the weights within 1e-9 of it the lowest J; the first 4 are kept and divided by
their sum. The first is the vertex's **strongest bone** (§7.22.2).

**10. Triangles.** σ is G.7's, over the rings in order, tip rings
included, as if both ends were capped. For each pair of consecutive
rings and i = 0 … N − 1, the quad of G.5's loft between them, facing as
there (a quad with a tip ring loses its zero-area half). A `cap` end is
G.5's loft cap of its end ring (the start cap faces −σ·N(R₀), the end
cap σ·N(R_last)); `open` and bridge ends get none. Order: the bands in
ring order, each with i = 0 … N − 1, then the start cap, the end cap,
the start's bridge strip and the end's. Each side triangle (and each
triangle of a quad with a tip ring) carries its **column** i, the quad's
index round the ring: at a sharp ring point h, G.9 keeps the columns
h − 1 (mod N) and h apart, so the surface creases there, one sharp
anchor too. Caps carry no column.

**11. Bridges.** An `ends` entry `{"bridge": B, "end": e}` resolves B as
`id` is resolved. It is a run-time error at the entry
(`build[3].chain_loft.ends[0]`) when no chain loft with that id ran
earlier in the build, when it is this primitive, when its end e is not
`open` or is already bridged, or when the two primitives' chains (for a
`path` primitive, its home part) differ in determinant sign. Ring A is
this end's ring (in this home part's space), ring B the target's end
ring, moved by (frame of this home part)⁻¹ · (frame of the target's home
part). With centroids c_A and c_B, the axis a = normalize(c_B − c_A); or
the Newell normal of A (G.7), normalized, when |c_B − c_A| < 1e-6; or
(0, 1, 0) when that normal is exactly zero (all three components 0). A ring whose Newell normal has a
negative dot product with a is walked backwards (point 0, then n − 1,
… 1). With anchors on both rings (a run-time error at the entry unless
they have the same names in the same cyclic order, as walked), spans run
from anchor to anchor, starting at A's first anchor in walking order and
at B's anchor of that name. Otherwise there is one span each: A's from
its point 0, B's from its point nearest in angle round a to A's point 0
(angles in the plane square to a, each ring about its own centroid;
the smallest angle difference, and among the differences within 1e-9 of
it the earliest point in walking order). For each pair of spans, with points A₀ … A_{nA} and
B₀ … B_{nB} (the last being the next span's first, or the start again)
and f(i) the distance along the span's points from its start as a
fraction of the span's length (i / n for a span of length 0):

```text
i = 0, j = 0
while i < nA or j < nB:
  if j = nB or (i < nA and f_A(i + 1) ≤ f_B(j + 1)): emit (A_i, A_{i+1}, B_j), i = i + 1
  else:                                              emit (A_i, B_{j+1}, B_j), j = j + 1
```

Each triangle is emitted as a `mesh` triangle (G.5: dropped when tiny,
facing its own winding, which is away from the axis). Its vertices copy
their ring point's position, weights, v and normal, and a u made
continuous along the walk: the first point of a ring's walk keeps its
own u, and each step adds the distance round the ring to the next point
(a fraction of the perimeter without `size`) walking forwards, or
subtracts it walking backwards, so no strip triangle spans the seam.
The normal is the normal G.9
gives the point at its first corner, in emission order, of a kept side
triangle of its own primitive's end band (turned with B's points), or
the strip triangle's face normal when there is none. Strip normals are
therefore settled after G.9 has run on every part. The strip carries no
column and takes no part in G.9. B's positions and normals are moved
by the same matrix, whose linear part may include a reflection (when
the two home parts are mirrored differently): that is exact, since it
only re-expresses model-space points and directions in this home part's
space; the strip is then emitted there and baked as any of its
triangles (G.5, G.19), so no rule on the home parts' handedness is
needed.

**12. Warnings (V-58).** A **pinch** at ring r (not a tip ring): with
δ = L / 128, d = clamp(τ_r L, δ, L − δ), a = Q(d − δ), b = Q(d),
c = Q(d + δ), u = a − b, v = c − b and w = u × v, skip the ring when
|w|² < 1e-30; otherwise the circle through a, b, c has its centre
o = b + ((|u|² v − |v|² u) × w) / (2 |w|²), radius R = |o − b|, and
k = (o − b) / R. The ring pinches when some point q of it has
(q − C_r) · k > R. A **crossing** in an open-curve section: its N
matched points (step 7, before step 8) as a closed polygon have two
edges (pᵢ, pᵢ₊₁) and (pⱼ, pⱼ₊₁) that are not neighbours by index
(j ∉ {i − 1, i, i + 1} mod N; points at the same place but of other
indices still count) with, for
o(a, b, c) = (b − a) × (c − a) in 2D, both o(pᵢ, pᵢ₊₁, pⱼ) ·
o(pᵢ, pᵢ₊₁, pⱼ₊₁) and o(pⱼ, pⱼ₊₁, pᵢ) · o(pⱼ, pⱼ₊₁, pᵢ₊₁) below 0.

# 13. Design decisions

Moved out of [JIG.md](JIG.md) §13. One line per decision; the long version is in `spec/drafts/`. Ids are stable.

| # | Decision | Rationale | Impact |
|---|---|---|---|
| DD-01 | JSON | Every language and tool reads it; no parser to write. | Comments are `//` keys; expressions live in strings. |
| DD-02 | Metres, Y up, origin on the floor | Real-world sizes; matches glTF and most engines. | Models drop into scenes at the right scale. |
| DD-03 | Radians everywhere, with a degree twin | Superseded by DD-34 (0.10); until 0.9, documents were in degrees and expressions in radians. | See DD-34. |
| DD-04 | Unknown keys are errors | Typos fail loudly instead of being ignored. | Vendor data goes in `x-` keys. |
| DD-05 | Names checked in every branch | Errors surface when a document loads, not when a rare setting is picked. | No dynamic names. |
| DD-06 | Smooth by default (40°) | Round solids look round; boxes stay crisp. | `{"smooth": 0}` restores the faceted look. |
| DD-07 | JSON member order is significant | `let`, constants and data refer to earlier names; presets apply in order. | Tools must preserve order. |
| DD-08 | `version` is a minimum, not a switch | One set of rules per reader; no version-dependent behaviour to test. | A reader reads old documents by today's rules. |
| DD-09 | Keyed, stateless random (PCG-hash) | Values don't depend on call order; bit-identical across languages with 32-bit integer maths. | All random output changed in 0.6. |
| DD-10 | Part ids with `use` instance names | Library parts can't collide; ids stay stable across imports. | Imported components that make parts need `as`. |
| DD-11 | Relative paths inside the document's folder | A document can't read arbitrary files or the network. | Shared libraries live below the models that use them. |
| DD-12 | Degenerate primitives draw nothing | Parametric documents hit zero sizes at their limits; that shouldn't break a build. | Only genuinely bad input (bad mesh indices) is an error. |
| DD-13 | Fixed, mandatory limits | Every reader accepts the same documents. | Readers can't lower them. |
| DD-14 | Expressions are GLSL's (4.60) | Authors and readers already know it; `KHR_interactivity` shares its names. | `&&` `\|\|` `!`, swizzles, `mix`, `mod`; no `%`, no word operators. |
| DD-15 | Data, materials and bakes use glTF's vocabulary | A bake is a copy, not a translation; glTF files can feed data and meshes. | Data blocks map to accessors; maps to material slots. |
| DD-16 | Same name, same definition | A familiar name that behaves differently is a trap. | JIG-only behaviour gets JIG-only names (`limit_length`, `saturate`); differences are listed (§7.2.6). |
| DD-17 | binary64, one number type | Determinism across readers (REQ-04) needs one exact type. | No GLSL `int`/`float` split, no integer division. |
| DD-18 | No compatibility forms before 1.0 | Aliases and opt-outs would be carried forever into 1.0. | Each 0.x version may break documents; the revision history says how to update. |
| DD-19 | No `vec4` or matrices yet | Nothing needs them yet; colours carry four channels. | Names reserved, so they can be added later without breaking names. |
| DD-20 | `mesh` `uvs` in glTF's convention | glTF data feeds `mesh` unchanged (§7.7, §7.16). | 0.5 documents flip v. |
| DD-21 | No unpacking in `for` or comprehensions | One variable per loop keeps the language small; indexing does the same job (§7.15.2). | `p[0]`, `p[1]` or a loop over indexes. |
| DD-22 | Random keys are numbers, strings and lists only | A vector held in 32 bits by one reader would hash differently from another's 64 (R-02). | Key by loop counters and names (`['tile', i, j]`). |
| DD-23 | Bakes take roughness and metalness from one image | glTF stores them in one image; packing two would need image decoding in every baker. | Bake textures use `metallic_roughness`; separate maps still render. |
| DD-24 | Inputs are independent; no `rules` or `set` | An input that a document can change has two values, the host's and the model's, and every change can ripple through the others. With inputs fixed and computations named in `derived`, a change has one cause and a known reach. | Clamping becomes size limits (§7.8) or derived values; hosts show derived values read-only. Presets and size limits are part of settling, a declarative step before any derived value or statement runs (§8.1). |
| DD-25 | Impact classes found statically, by grammar position | A reader and a host know before building what a change can affect, and a document can't hide a dependency. The analysis is over-approximate: an `if` condition is always `structure`, though its branches may differ only in colour. | Partial rebuilds (§7.20); a derived value's class is inferred, and a declared one is checked at load (V-22). |
| DD-26 | Keyed piece seeds | A seed from a build-wide counter changed whenever a piece before it came or went, at another `lod` or after a parameter change, so a part couldn't be rebuilt alone. | Every piece seed changed in 0.7; a piece key holds the values of its enclosing `for`s, not their pass numbers, so seeds also survive a change of loop step (Appendix G.3). |
| DD-27 | `?:` takes its result's class | The usual colour or material switch (`finish == 'oak' ? a : b`) shouldn't force a full rebuild; only a list's length changes the structure. | A `?:` that feeds a list argument is still `structure` (§7.19). |
| DD-28 | Built-in function names are reserved for values too | No name means a value and a built-in in one expression (`step * step(0.5, x)`). | §8.2 lists the usual clashes and names to use instead. |
| DD-29 | Texture coordinates follow from the face, not the build | A texture swap (`finish` picks brick or stone) would otherwise rebuild every triangle. Texture coordinates depend only on the face, its solid and the texture (§7.6), so a reader can redo them alone. | A texture change repaints in place (§7.20); texture tables follow the document's order, not the order of first use (§9.1). |
| DD-30 | Assets pass through; `mesh` takes geometry in | A sculpted asset gets its look from data JIG has no slot for (authored normals, tangents, extra texture sets, its own materials and levels). Passing it through untouched keeps that look; a reader does no work per triangle. | Assets take no JIG colour, surface or smoothing; three controlled ways change their look (§7.21.6). Their triangles don't count toward the triangle limit. |
| DD-31 | Sockets mate face to face, read from level 0 | Pieces meet exactly by name, without the author computing coordinates; +Z out, +Y up is the convention artists already use for snapping. Reading sockets from level 0 alone keeps placement independent of `lod`, with nothing to compare between levels. | `onto` and `socket()` name the most recent socket with an id, so loops chain pieces. A reference to a socket not placed yet fails at build time. |
| DD-32 | Sizing never stretches sculpted detail | A sculpt scaled as a whole smears its detail and bends its normal maps. Repeat, slice zones and plain fill reach any size while sculpted regions keep their authored scale. | Non-uniform scale on an asset is an error; the only stretch is a `repeat`'s, at most 1 ± 0.5, and a marked zone's. Texture coordinates in a zone stretch with it (OI-18). |
| DD-34 | Angles are radians; every angle key has a `_deg` twin | One unit in documents and expressions, the unit of GLSL (§2.3) and glTF, so a bake and a Khronos extension need no conversion. People still think in degrees, so each angle key has a degree twin rather than every author writing `radians()`. A twin is one property in two units, not an alias (REQ-06). | V-27; `rotate_deg()` in expressions; a reader converts before anything reads the value. |
| DD-35 | Physics follows Khronos, built from the coarsest level | The Khronos extensions are where engines and glTF tools are meeting, so JIG takes their vocabulary and a bake needs no translation. Building physics from `lod` 2 keeps it cheap and stable while the shown detail changes. Inferring the simplest collider per primitive gives every model physics without markup. | Implicit shapes where a primitive is one; hulls elsewhere; surface kinds carry default materials. |
| DD-36 | Joints belong to parts | Parts already have a pivot and a pose a host animates, so the joint, its limits and its drive sit on the part, and the pose is the drive's target. A part without a joint is welded, so one mechanism covers rigid and moving pieces. | `joint` object on `part`; free bodies are joints with every axis free. |
| DD-37 | Placement data is the model's; free names are the host's | A model knows where it can go, the space it needs and how it is used; the room builder knows its rules. So the spec fixes only what changes how a reader builds (the four clearance purposes, the mounts, the levels) and leaves roles, users, groups, tags, socket types, effects and filter systems as free names. Clearance follows IFC's `Clearance` so BIM tools agree on its meaning. | IFC meanings for clearances, openings and plan symbols; `KHR_lights_punctual` for lights; the rest in `CANWELL_jig`. |
| DD-38 | Parts and skinned assets form one skeleton; roles sit beside the pivot | The part's pivot is the joint, so the role that names the bone belongs next to it, and a part made in a loop or component names its bone with a template. A bought skinned figure joins by naming its own bones. A bake binds each part's geometry rigidly to its node, so every glTF importer, not only ours, gets a skeleton. | `role` on `part`, `roles` on `asset`, top-level `character` (§7.24); one skin over the parts (§9.1). |
| DD-39 | Clips are expressions of `t`, sampled at a fixed 30 Hz | A clip stays parametric, a walk cycle that follows `stride` and `leg_length`, and every reader samples it the same way, so no keyframes are stored and the fingerprints agree. A rate, a key at 0 and a key at `length` are all a bake needs. Keyframes are expressions too (`mix`, `step`). | `animate`, `clips`, `t`, Appendix G.18; no parameter is animated, so a bake holds one variant (D-81). |
| DD-40 | Expression clips reuse clips; Khronos names are a map | A facial expression is a clip run by a 0–1 driver, so a jaw or eyelid part can do it on a rigid character; the standard names are an addition (`expression_map`), not a different kind of clip. | `"expression": true`; `KHR_character_expression` and `_mapping` (§7.25.4). |
| DD-41 | A scheme's role names are checked as warnings | Khronos says a validator that knows a vocabulary should warn about a role it doesn't define, not reject; a robot or a vehicle names bones freely under its own scheme. | Only `vrm1_humanoid` and `vrm1_expressions` are known; V-45, V-46. |
| DD-43 | A clip may be the reverse of another | A close is an open played backwards; copying the expression with `1 - …` (review item 129) repeats motion and lets the two drift, and a host that can't play backwards still needs the clip. One key, no length and no channels, so the check is static (V-41), and reversals don't chain. | `reverse` (§7.25.1); sampled at L − t (G.18); a bake writes a separate animation. |
| DD-42 | `selectable` bakes to `KHR_node_selectability` | A ratified Khronos extension says it, where `CANWELL_jig` was a private field. | `{"selectable": true}` on the part nodes only (§9.1). |
| DD-33 | Kit materials are textures | One general mechanism: a glTF material goes wherever a texture value goes, with the same fitting, tint and repaint rules (§7.6, §7.20), instead of a second material system. | No `materials` block or `material` option; `"color": "texture('plaster')"`. |
| DD-44 | Actions are named, top level and layered | A bench's seats share one `sit`, so the action lives in one table and a use point names it. The body is described twice: targets for where it must be and a bone clip for how it moves, so the model fixes what it owns (the seat is where it is) and a character keeps its own style by replacing only the bone clip. | `actions`; a use point's `actions`; a character's clip `action/phase` overrides the bone clip, never the targets (§7.26.7). |
| DD-45 | Targets are in the use point's frame; the solver is the host's | One definition then serves every seat and every model. The six effectors are what IK solvers take as end effectors. JIG fixes the targets and the order (bone clip first, then IK, blended by weight) and not the algorithm, which engines already have and which differs between them. | `at` relative to `point` and `facing`; `weight` 0–1; no pose is promised (R-07). |
| DD-46 | A phase is a clip | The model's own parts moving in step (a lever, a seat cushion) need no second mechanism: a part's `animate` names `action/phase`, and sampling, baking and `reverse` are a clip's. | Implicit clips named `action/phase` (§7.26.6); a phase may be the `reverse` of another (§7.26.2). |
| DD-47 | The bake keeps sampled targets and bone rotations in `CANWELL_jig` | glTF has no IK targets, and there is no person in the model to animate. The samples are exact, the same in every reader and readable by any host; the model's own part motion stays ordinary glTF animation. | `CANWELL_jig.actions` (§9.1). |
| DD-48 | A target or a prop's release place may be on a part | The model's own things (a lever, a cup, a spout) live in the model's space and move; a target written in the use point's frame had to mirror them by hand and restate the lever's turn. A literal `on` names the frame by a part's resolved id (the root, `body`, is the model's space, so no second word is needed) and is checked up front like an attach event's `part`; a shared action still works over use points with different facings. Only the part's phase channels count, so a target doesn't depend on what else the host mixes in (use_actions_0_14 D-98 to D-100, D-113). | `on` (§7.26.3, §6.1.32), V-52. |
| DD-49 | A prop can keep its place when taken, and be left elsewhere | A grip written twice with opposite signs (target and offset) was a trap, and a prop that always went home made the author choose the model's rest to suit the action. `keep` lets the host work the offset out; `release` makes a place data; a reverse reads both backwards, so standing up puts the cup back (D-101 to D-103). | `keep`, `release` (§7.26.5), G.20. |
| DD-50 | A phase may hold the one before it, and a jump is a warning | Restating six targets and five bones in every phase was the commonest slip. `hold` is opt-in so a phase that leaves a target out on purpose reads as before; a jump may be wanted, so V-53 warns rather than rejects, as V-46 does (D-104, D-105). The one cycle `hold` and `reverse` can form (`enter` the reverse of `exit`, `loop` and `exit` holding) is an error, not a fixpoint every reader must compute: the action means nothing sensible, and the check runs at load with a path (D-114). | `hold` (§7.26.2), V-47, V-53. |
| DD-51 | One clock per use point; shared channels play first in, last out; nobody means the built pose | A two-seat bench must not dip both cushions. Channels bound to a use point by `use` play on its person's clock; a channel with no `use` belongs to the action, so it follows "someone is here". An empty use point looks like the built model on every host, with no history to keep (D-106, D-107, D-111, D-112). Two people at one use point stay out (OI-29). | `use` on `animate` (§7.26.6), §7.26.11. |
| DD-52 | A reverse puts a prop back where it was, not at the forward `release` | Reading `release` as written made a reverse end with the cup back under the spout: standing up then left the cup where sitting down had put it. Undoing a pick-up means the place the prop had before it, which is the previous event's release in the named phase, so the reader writes that release into the reverse phase and a host applies every release as written (D-115). | §7.26.5, G.20, §9.1. |
| DD-53 | With no previous event in the named phase, a reverse puts the prop at its own place | For a named `loop` or `exit` an earlier phase may have moved the prop first. Reading only the named phase keeps the rule static and the same in every reader, with no playing order and no cycle (Q-34's kind); an author who wants the earlier place writes the phase with its own `release` (D-116). | §7.26.5, G.20; OI-33 closed. |
| DD-54 | A light value out of range is an error, not clamped | A negative intensity, a zero range or an inverted cone has no meaning and would bake a glTF light the validator rejects (§8.3). Like a negative density (§7.22), it is an author's mistake, so the reader names the key instead of guessing; colour channels are clamped, as every colour is when it turns linear. | §7.23.6, §10.1 |
| DD-55 | A character overrides an action's targets relative to the model's, under `character.actions` | A short figure on an adult's bench pushed its shins through the seat: where a body can put its feet depends on the body, where the seat is on the model. The character writes targets as expressions of the model's (`model_at`, `model_weight`), so it never learns the model's geometry and one override fits every seat. It may change `at`, the rotation and `weight`, add a target and let one go; never the props, the timing or the model's parts, which the model's own animation needs. Overrides match by action and phase name, as the bone clip does; the bone override stays the `action/phase` clip (D-117 to D-121, D-124, D-125). | `character.actions` (§6.1.26, §6.1.33, §7.26.12), §7.2.4, V-54, V-55; §7.26.7. |
| DD-56 | Overrides merge before `hold` and `reverse` | A raised foot must stay raised through a held `loop`, and standing up must lower it first, as the reverse of a merged `enter`; merging after would put the feet back on the floor at the start of `exit` (D-122). | §7.26.12, G.20. |
| DD-57 | The reader merges a pair; hosts never evaluate expressions | A host gets one list of targets in the model output's form, so every host plays the same merged keys and conformance can hold them (pair cases). The cost is a step that reads two documents; a bake can't merge, since it has one, so a host without a reader at run time plays the model's targets (D-123). | §7.26.12, §8.3, §9.1, TC-14. |
| DD-58 | JIG's own solids may emit: an `emissive` colour and an `emissive_strength`, no maps | Lamps, screens and signal lenses were drawn unlit, or needed a kit asset just for a glowing face. A colour and a strength are glTF's own `emissiveFactor` and `KHR_materials_emissive_strength`, set like `roughness` and `metallic`, so any host reads them; maps would bring image packing and a second texture slot for little gain (D-127). Emission lights only the face; scene light stays a model's lights (§7.23.6). | §7.17, §6.1.14, §9.1, §8.3; OI-11 narrowed to maps. |
| DD-59 | No maximum document size | §11's limits already bound the work a reader does (steps, items, triangles, numbers per data block); the bytes a host accepts are the host's, and a limit in the format would only reject large but cheap documents (D-128). | §11; OI-04 closed. |
| DD-60 | A `hips` target aims at the joint of the bone with role `hips` | The same rule as every other target (a wrist, an ankle): a bone's joint, which every rig has and every solver moves, rather than a point between the thighs that each rig puts elsewhere (D-129). | §7.26.3, §7.26.9, §8.2. |
| DD-61 | A character's phase override may have a `let` | Overrides repeat `model_at('hips')` and offsets in every target and phase; a `let` names them once, with the same meaning as the build's `let`, scoped to the phase override and evaluated per key (D-130). A name's `model_at` calls count for the targets that read it, so V-55 stays per target. | §7.26.12, §6.1.33, V-54, V-55, G.20. |
| DD-62 | A character gives each hand and foot a grip: an offset and an optional turn in the bone's frame | Where a hand touches a lever depends on the hand, not the lever. The body states its own contact point once, and every model keeps aiming at joints; named contacts on the model would add a naming scheme to both sides for the same result (D-131). The bone's frame is the figure's axes turned by the bone, as an attach offset's, so a grip doesn't depend on the rig. | §7.24.6, §6.1.34, V-56, §7.26.7, §7.26.9, §9.1; OI-30 closed. |
| DD-63 | A hand or foot target may carry a `pole`, sampled like `at` | A straight limb has no plane to bend in, and a knee that must bend sideways couldn't be said. A pole point is what every two-bone solver takes; it lives in the target's frame and phases like `at`, so `hold`, `reverse` and overrides need no new rule. No spine or shoulder targets: they need a full-body solver (D-132). | §7.26.3, §6.1.32, §6.1.33, V-48, V-53, V-54, G.20, §9.1, §11; OI-29 narrowed. |
| DD-64 | No curve helper for clips, for now | `mix`, `smoothstep` and `step` write keyframes and easing as expressions; no author has needed more (D-133). | OI-25 stays open. |
| DD-65 | A target keeps one `on` per phase, for now | A frame that changes within a phase would complicate `hold`, `reverse`, V-53 and the merge for no model that needs it; split the motion across phases or hands (D-134). | §7.26.3; OI-31 stays open. |
| DD-66 | New primitives `ellipsoid` and `torus`, not a vector `radius` on `sphere` | A stylised figure is mostly ellipsoids, and a five-step transform per shape is noise; a ring took a `lathe` whose profile is a comprehension round a circle, long to write and easy to wind the wrong way. Both are defined by existing solids (a transformed sphere, a lathe of a circle), so closure, facing, grain and surface coordinates follow known rules. A vector `radius` would break *same name, same definition* with Khronos's sphere and the `collider` statement (D-135, D-137). | §7.16, §6.1.14; OI-35. |
| DD-67 | `ellipsoid` and `torus` turn with `rotation` / `rotation_deg`, as `box`; the torus has its own optional `tube_sides` | One way to turn a solid in place; a thin ring and a fat donut need opposite detail ratios, so one derived count can't fit both (D-136, D-138). | §7.16, §6.1.14, §7.19. |
| DD-68 | Component argument defaults in a separate `defaults` key, reading global names and earlier arguments; none for functions | `args` and every existing component stay as they are; reading earlier arguments matches the primitives' own `radius_end` = `radius`. Functions are positional GLSL-style calls, where defaults would hide wrong calls (D-140 to D-142). | §7.14, §6.1.11, §7.15.8, V-15, V-38. |
| DD-69 | The T-pose is the default reference pose; `a_pose` only for a skinned asset rig, with arm offsets found from the rig | Bone clips, targets and grips count from the reference pose, so an action meant different arm positions on T- and A-pose figures. JIG's own solids get any look from a static `pose` over a T-pose; an asset's rig can't be re-posed by the document, so its A-pose is measured (the shortest turn from ±X to the upper-to-lower-arm direction) and every action plays from the figure's T-pose. No angle is written, so nothing can disagree with the rig (D-144, replacing D-143). | §7.24.2, §6.1.26, V-39, §7.26.4, §7.26.7, §9.1, G.21. |
| DD-70 | A round shape's fallback collider is the hull of a fixed point set, not of its triangles; an ellipsoid's too | The collider stays independent of `sides` and `lod`, as the round shape it replaces is, and both readers already built it so for the old shapes: no fingerprint changes there (D-145). The new ellipsoid follows the same rule, the sphere's set scaled and turned, for consistency (D-146). | §7.22.2, G.14; OI-36 closed. |
| DD-71 | Blended geometry is a primitive, `chain_loft`, that names a chain of parts by id and runs in a home part; any model with parts may have it | Parts stay the only bones (§7.15.7 and the skeleton are unchanged); chain order is a parent test; a component that makes a limb makes its surface too. Roles were rejected because they name bones for retargeting, not geometry; a `blend` key on `part` because it can't join separate solids (D-147, D-149). | §7.16.1, §6.1.35, §7.15.7, §7.24.2, V-57. |
| DD-72 | Weights come from a `blend` width per joint (smoothstep along t), with 3 rings at every joint whatever the width; a per-vertex `weights` expression, one number per chain part, overrides them | One number per joint is easy to write, and fixed band rings keep every count a function of `steps`, `sides`, the chain and `ends`, so `blend` stays a `shape` value. The expression covers weighting round a ring; a wrong length or all zero is an error, negatives clamp as an action weight does (D-148, D-154, D-160, D-161). | §7.16.1, G.22, §7.19. |
| DD-73 | The curve is a centripetal Catmull–Rom through the joints, t by arc length on 64 samples per segment; sections are matched by resampling with anchors and interpolated by a monotone cubic | No cusps or loops, no tension parameter, the same t at every `lod`; a monotone cubic never overshoots what the author keyed; anchors line up corners across sections of any point count, and differing anchors are an error rather than a guess (D-150, D-151, D-153). | §7.16.1, G.22. |
| DD-74 | Sections are vec2 lists, `superellipse_ring`, JSON path commands (absolute M L Q C Z, y up, placed exactly by arc length), or open curves with a `[left, right]` thickness and `flat` or `round` tips | Commands as JSON keep paths checkable and parametric without a language in a string; one formula covers sleeves to rails; arcs, relative and shorthand commands are left to a converter (D-152, D-162 to D-169). | §7.16.1, §7.2.4, §6.1.35, G.5, G.22; OI-44 closed. |
| DD-75 | A bridge is an end kind naming an earlier chain loft's `id`; its strip copies the rings' normals, coordinates and weights | No new statement, build order guarantees the target, and the seams shade smooth; a strip between parts is blended, so a hose between rigid pipes works (D-156, D-170 to D-173). | §7.16.1, G.22, G.9; OI-03 narrowed. |
| DD-76 | Outside a character, a bake skins only the meshes of home parts of blended geometry, with the character's skin; per-part uses take each vertex for its strongest bone | A model without blended geometry bakes as before, and one hose changes only its home part's mesh; a limb's collider stays on the limb (D-157, D-159). | §9.1, G.19, §7.22.2, G.14. |
| DD-77 | A chain loft that folds over on the inside of a bend, or a thick curve that crosses itself, is built as written with a warning | A slider that bends a curve must not fail the document; thinning or clipping would change the author's shape silently (D-158, D-168). | V-58, §10.4, G.22. |
| DD-78 | In a document with a `chain_loft` over a `chain`, every `placement` sink is also a `shape` sink | Moving a pivot reshapes the surface in its home part, and which parts a chain names is only known at run time; the impact classes must stay a static over-approximation (§7.19). Found while writing 0.19; the drafts did not ask it. | §7.19, §7.20. |


# 14. Open issues and risks

Moved out of [JIG.md](JIG.md) §14. Ids are stable; a closed issue keeps its row.

| # | Open issue |
|---|---|
| OI-01 | Procedural textures as values (noise, stripes) instead of images. Both need a deterministic noise function, which would also serve geometry as an expression built-in (value or gradient noise of a vec2 or vec3 and a seed, defined bit for bit from the hash of G.3 so every reader agrees within §8.3's tolerances). |
| OI-02 | Texture atlases: many small images in one file. |
| OI-03 | Blending between solids (fillets, soft joins), which smoothing deliberately doesn't do. Includes joining a limb to a body (`spec/drafts/v0_19.md` Q-72): a child ring that shares the parent surface's points, and cutting a hole in a parent surface to stitch a child's end ring into it. Narrowed in 0.19: stitching one chain loft's end ring to another's of a different count is the bridge end (§7.16.1; D-156, DD-75). |
| OI-04 | Closed in 0.16, won't add: no maximum document size. §11's limits bound the work; the size of a file a host accepts is the host's (§11; D-128 of `spec/drafts/v0_16.md`, DD-59). |
| OI-05 | The `CANWELL_jig` extension and the media type `application/jig+json` are provisional (§9.1, §4.4). |
| OI-06 | `str()` of a number follows ECMAScript's format (Appendix G.1); other languages need a small formatter. |
| OI-07 | glTF 2.1 unique ids: once ratified, bake each resolved part id as the node's unique id too, so ids stay stable across bakes. Informative until then. |
| OI-08 | glTF 2.1 external assets: once ratified, a baker may write imported components as external assets instead of inlining them. |
| OI-09 | Closed in 0.11: `sphere` and `capsule` are primitives with Khronos's meanings in JIG's names, and every primitive bakes its collider as a Khronos implicit shape or hull (§7.22). |
| OI-10 | `vec4` and matrices (`mat3`, `mat4`) for transforms; names reserved (§7.2.3). |
| OI-11 | Emissive maps (glTF `emissiveTexture`), out of scope (§1.3). Narrowed in 0.16: an emissive colour and strength are in (§7.17, D-127 of `spec/drafts/v0_16.md`); only maps stay out. |
| OI-12 | Rename `CANWELL_jig` to an `EXT_` name when a second, independent implementation exists. |
| OI-13 | Closed: `station_building` and `semaphore_signal` now face +Z (§8.2), each turned as a whole by one `transform`; the signal's width is now its arm length and its depth its footing. |
| OI-14 | Seams where fill geometry meets a sculpt: normals and texture coordinates need not match. Options: shared trim pieces that hide the joint, or a normal-matching rule at socket edges. Makes OI-03 more pressing. |
| OI-15 | Layered materials: parametric wear, dirt and decals beyond factor overrides need a material-layering scheme glTF doesn't have yet. |
| OI-16 | More levels of detail: whether `lod` 0–2 is enough once kits reach open-world scale, and whether a bake may carry every level through `MSFT_lod`. |
| OI-17 | Closed in 0.12: a skinned asset keeps its own skin; `roles` name its bones and a single `asset` statement keeps its animations (§7.24.1, §7.25.5). Binding an asset's joints to JIG parts stays out: the character's skin holds the parts only. |

| OI-19 | `KHR_physics_rigid_bodies` is a draft: field names, defaults and joint semantics may still change; JIG follows them until ratified. |
| OI-20 | Joint limits on several rotation axes: Khronos limits two axes as a cone; JIG measures each axis as an Euler angle of the pose. A bake writes a limit per axis, which matches for a hinge and approximates a ball joint. The inferred clearance of such a joint sweeps each axis on its own (G.16), so it can be smaller than the space the part reaches when turned about two axes at once. |
| OI-21 | The default physical values per surface kind (§7.22.3) round typical published figures; their sources should be listed. |
| OI-22 | Closed in 0.12: `selectable` bakes to `KHR_node_selectability` (ratified); `KHR_node_hoverability` has no JIG counterpart. |
| OI-23 | The Khronos character extensions are drafts (glTF PR #2512): field names, the expression rules and the mapping format may change; JIG follows them until ratified (DEP-10, D-72). |
| OI-24 | Left out of 0.12: look-at, camera and visibility hints, and the humanoid bone set `KHR_character_skeleton_biped`, which Khronos postponed. |
| OI-25 | A curve helper for clips (keyframes, easing) if authors find expressions of `t` too long; `mix` and `step` do it today (§7.25). Kept out in 0.17 (D-133 of `spec/drafts/v0_17.md`, DD-64); open until authors need it. |
| OI-26 | Building a ragdoll from a part's role and joint (D-85): the bake writes both, a host builds the bodies; a Godot reader could build `PhysicalBone3D` later with no change to the format. The same holds for spring (secondary-motion) chains, a run of parts such as a tail, ears or a hood string that a host swings as damped springs: the format would only mark the chain and its stiffness and damping; the simulation stays the host's. |
