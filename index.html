<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JIG viewer</title>
<style>
  :root { --bg: #f4f2ee; --fg: #222; --panel: #fff; --line: #ddd; --err: #b00020; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1b1d; --fg: #e8e8e8; --panel: #252528; --line: #3a3a3e; --err: #ff6b7f; } }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-columns: minmax(320px, 40%) 1fr; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  #side { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; }
  textarea { flex: 1; resize: none; border: 0; padding: 12px; background: transparent; color: inherit; font: 13px/1.5 ui-monospace, monospace; outline: none; }
  #params { padding: 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  #params label { display: grid; grid-template-columns: 7em 1fr 4em; gap: 8px; align-items: center; }
  #err { padding: 8px 12px; color: var(--err); font-family: ui-monospace, monospace; min-height: 2.2em; border-top: 1px solid var(--line); }
  #view { position: relative; min-height: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: 50vh 50vh; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="side">
  <textarea id="src" spellcheck="false" aria-label="JIG document"></textarea>
  <div id="params"></div>
  <div id="err" role="status"></div>
</div>
<div id="view"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { read } from './jig.js';

const src = document.getElementById('src'), paramsEl = document.getElementById('params'), errEl = document.getElementById('err');
const view = document.getElementById('view');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.01, 100);
camera.position.set(1.6, 1.2, 2);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.3, 0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x666655, 2), new THREE.GridHelper(4, 40, 0x888888, 0x888888));
const sun = new THREE.DirectionalLight(0xffffff, 1.5); sun.position.set(2, 4, 3); scene.add(sun);
const mesh = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshStandardMaterial());
scene.add(mesh);

const values = {};
let shownParams = '';

function rebuild() {
  let out;
  try { out = read(JSON.parse(src.value), values); errEl.textContent = ''; }
  catch (e) { errEl.textContent = e.message; return; }
  const [x, y, z] = out.shape.size;
  mesh.scale.set(x, y, z);
  mesh.position.y = y / 2; // origin on the floor
  mesh.material.color.set(out.shape.color);
  // Rebuild the sliders only when the parameter set changes, so dragging keeps focus.
  const key = JSON.stringify(Object.entries(out.params).map(([k, p]) => [k, p.min, p.max]));
  if (key !== shownParams) { shownParams = key; sliders(out.params); }
}

function sliders(params) {
  paramsEl.replaceChildren(...Object.entries(params).map(([name, p]) => {
    const label = document.createElement('label');
    const input = Object.assign(document.createElement('input'), { type: 'range', min: p.min, max: p.max, step: (p.max - p.min) / 200, value: p.value });
    const out = Object.assign(document.createElement('output'), { value: p.value });
    input.oninput = () => { values[name] = Number(input.value); out.value = input.value; rebuild(); };
    label.append(name, input, out);
    return label;
  }));
}

function resize() {
  const { clientWidth: w, clientHeight: h } = view;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });

src.addEventListener('input', rebuild);
src.value = await (await fetch('examples/box.jig.json')).text();
rebuild();
</script>
</body>
</html>
